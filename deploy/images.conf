# The images this deployment runs. One source of truth, read by compose.yaml,
# install.sh, publish.sh and verify.sh.
#
# WHY A FILE AND NOT A TAG IN compose.yaml: a tag is mutable. `foyer:0.1.0` can be
# repointed at a different build by whoever owns the repository, and a deployment
# that trusts a tag has no way to notice. A digest cannot be repointed, which is
# why verify.sh compares digests and not names.
#
# deploy/publish.sh rewrites the two FOYER_* lines below after it pushes, so the
# digest here is always the digest of what was published rather than something a
# human typed.
#
# UNPUBLISHED: the digests are empty because nothing has been pushed yet. Until
# they are filled, install.sh refuses unless FOYER_ALLOW_UNPINNED=1 — an unpinned
# install is a development convenience, and a security product should say so out
# loud rather than let it be the quiet default.

FOYER_IMAGE_REPO=ghcr.io/kiennt048
FOYER_VERSION=0.1.0-alpha

# Filled by deploy/publish.sh. Format: <repo>/<name>:<version>@sha256:<digest>
FOYER_IMAGE_FOYER=
FOYER_IMAGE_FREERADIUS=

# Third-party, pinned the same way and by hand, because we do not publish it.
FOYER_IMAGE_POSTGRES=postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

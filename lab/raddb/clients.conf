# clients.conf — generated by internal/raddb. Do not hand-edit.
#
# There is not one shared secret in this file, and that is the point.
#
# RADIUS clients live in the SQL client table. rlm_sql loads them at startup
# (read_clients = yes) and the sections below let a row added *after* startup be
# discovered without a restart. The alternative — regenerate and restart on
# every access point an operator adds — drops every in-flight EAP conversation
# and the in-memory TLS session cache, so every corporate laptop on site
# re-authenticates because somebody added an AP.
#
# Each section is a network, not a client. A source address inside one is still
# only a client if the client table has a row for it; the lookup is in
# sites-available/dynamic-clients.
#
# require_message_authenticator and limit_proxy_state are set here, in
# security {} in radiusd.conf, and again per discovered client in the
# dynamic-clients server. FreeRADIUS's own default is "auto", which decides from
# the first packet a client ever sends and therefore silently leaves the weakest
# gear unprotected (BlastRADIUS, CVE-2024-3596).

client foyer_net_loopback {
	ipaddr = 127.0.0.0/8
	proto = *
	dynamic_clients = foyer_dynamic_clients
	lifetime = 300
	require_message_authenticator = yes
	limit_proxy_state = yes
	nas_type = other
}

client foyer_net_rfc1918_10 {

openapi: 3.1.0

info:
  title: Foyer API
  version: 0.1.0
  summary: Captive portal and network access platform.
  description: |
    **This document is the source of truth for the API.** Both the Go backend and the
    frontends are built from it: the backend implements this contract rather than
    negotiating a new one.

    Two rules shape it, and both come from measurement rather than taste:

    1. **The portal's authenticating operations are form navigations, not JSON.**
       The iOS Captive Network Assistant re-checks captivity only after a full URL
       navigation. A `fetch`-submitted login leaves the CNA showing "Cancel", which
       disassociates the device — the guest is authenticated and then thrown off the
       network. So `POST /portal/voucher` and `POST /portal/account` take
       `application/x-www-form-urlencoded` and answer `303 See Other`. This is not a
       mock convenience; it is the contract.

    2. **Nothing here promises data the protocol cannot deliver.** Byte counters
       advance only on RADIUS Interim-Update or Stop, `Acct-Interim-Interval` has a
       widely-implemented 300-second floor, and on the controller-API path there may
       be no accounting at all. Every counter therefore travels with the freshness
       of its sample, and a UI is not permitted to render one without the other.

    See `docs/protocol-reality.md` for the evidence behind both.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v0
    description: Same-origin. The portal must render before the client has internet.

tags:
  - name: portal
    description: |
      Guest-facing. Reachable pre-authentication, from inside a captive browser.

      **These eight operations declare no client parameters, and a reader
      implementing from this document alone cannot see how a MAC reaches the
      server. Stated once here rather than eight times.**

      `getPortalContext` and `getPortalStatus` take no parameters at all; the
      authenticating operations (`redeemVoucher`, `loginWithAccount`,
      `acceptTerms`, `verifyPhoneCode`) take `code`, `username`, `password` and
      `lang` as their method needs them, and the guest's own details the venue
      asks for (`name`, `phone`, `email`, `marketingConsent`, `consentVersion` —
      see `GuestDataSettings`), and nothing else; `requestPhoneCode` takes `phone`
      and `lang`; `withdrawOwnMarketingConsent` takes `lang`. There is therefore no
      operation in this document through which a client MAC, access point or site
      can arrive — **and that is the design, not an omission.**

      The carrier is a **portal session cookie**, `foyer_portal_session`: `httpOnly`,
      `SameSite=Lax`, `Path=/`, `Secure` from the connection rather than
      unconditionally, and with no `Max-Age`. It is set by the portal's front door —
      `GET /` on the guest listener, the document the access point redirects a phone
      to. That route is **not described in this document and should not be**: it
      serves a document rather than an API, and the operations below are what the
      document then calls.

      Three consequences, each of which is a rule somewhere else in the repository:

      - **The MAC arrives once, from the NAS, and is never a parameter.** UniFi
        appends `ap`, `id`, `t`, `url` and `ssid` as unsigned query strings that
        anyone within radio range can forge, so they are a *claim* put to
        `NASDriver.VerifyPresence()` before any grant exists
        (`docs/rules/security.md` §4). An operation that accepted a MAC would be a
        public API for authorizing arbitrary devices, including ones that never
        associated.
      - **The binding is to the browser, server-side.** The cookie names a session
        row; the row names the verified MAC. A mid-flow MAC change is refused. None
        of the NAS parameters are ever echoed back — returning them would make the
        portal an oracle for what it believes about an attacker-supplied address.
      - **`Secure` is conditional and there is no persistence attribute**, because a
        captive portal is regularly reached over plain HTTP and the CNA's data store
        is ephemeral: it destroys its cookie jar on close whatever is asked for. A
        portal that set `Secure` unconditionally works in a browser and silently
        drops every cookie on a phone.

      The `csrfToken` scheme does not apply here and says why: the CNA is a client
      that cannot be given a token to echo. `VerifyPresence` and a MAC-bound grant
      are the defence on this surface.
  - name: controllers
    description: |
      The management plane an operator actually possesses. For UniFi, Omada and
      Ruckus this is the object that holds the credentials, performs guest
      authorization, and is the only thing that knows what access points exist.
  - name: nas
    description: |
      Devices Foyer speaks RADIUS to. **Discovered from a controller** where there is
      one, registered by hand only for the drivers that have none.
  - name: network
    description: |
      Transport and RADIUS-plane settings: the portal's public address and HTTPS
      certificate, the sign-in throttles, the request ceilings, FreeRADIUS's
      generator settings and the per-device CoA timing. **Every one of these is
      set here** — an operator never edits
      an environment variable, a file or runs `foyerctl` — and that a change takes
      effect without restarting Foyer. Secrets are write-only: a private key is
      sealed on the way in and only its presence is ever reported.

      Where a deployment supplies a bootstrap value (`FOYER_PORTAL_URL`, a
      certificate file), it is shown with `source: environment`; a value saved here
      always wins over it.
  - name: vouchers
    description: Voucher batches and individual vouchers.
  - name: sessions
    description: |
      The records are read-only: FreeRADIUS owns `radacct`, and these can never be
      written. **One action exists, and it is not an edit** — `disconnectSession`
      asks the device to end a live session and changes no accounting row itself.
  - name: accounts
    description: Local accounts. argon2id.
  - name: diagnostics
    description: |
      Why a guest is not online. Read-only, and honest about what it cannot see —
      several ways of failing to get online leave no record anywhere.
  - name: portal-settings
    description: |
      What an operator can change about the portal a guest sees. The writable twin of
      `PortalContext`.
  - name: garden
    description: |
      The walled garden — unauthenticated egress before a guest has authenticated.
      Not a feature: without the portal's own FQDN in here the portal cannot serve
      itself (`docs/rules/security.md` §5).
  - name: overview
    description: Dashboard and alarms.
  - name: reports
    description: |
      What happened over a range of days: trends for the dashboard, and CSV exports
      for the spreadsheet a venue reconciles in. An export is a bulk read of personal
      data — MACs, usernames, times — so it is its own permission, `reports:export`,
      and every one is recorded in the audit log as `data-exported`.
  - name: auth
    description: |
      The console's own sign-in. Local accounts only — no SSO and no OAuth, and the
      boundary is a rule rather than an appetite: `docs/rules/frontend.md` forbids
      designing screens for systems that do not exist, and an identity provider is
      the largest of them.
  - name: operators
    description: |
      The people who may sign in to the admin console. Deployment-wide, never
      site-scoped, and a different object from `Account` — see `listOperators`.
  - name: audit
    description: |
      What was changed and by whom. Read-only forever, and an administrator surface.
  - name: privacy
    description: |
      Guests' personal data: how long each kind is kept, and erasing one person's.
      An administrator surface. What is stored where is written for operators in
      `docs/operator/personal-data.md`, and `internal/store/privacy_test.go` holds
      that page to the code.
  - name: guest-data
    description: |
      What a venue asks its guests for at sign-in, and the marketing consents they
      gave. **Two things that must never be read as one.** The
      details a venue collects (`name`, `phone`, `email`) are optional unless the
      venue marks one required to get online; **marketing consent is a separate,
      unticked checkbox that is never required**, never inferred from accepting the
      terms, and recorded — when, and the exact text shown, by its SHA-256 — only
      when the guest ticks it. A guest who does not tick it leaves no marketing
      record at all.

      What the field does, and what this follows: Purple ships separate, unticked,
      per-purpose checkboxes and states that marketing may not be a condition of free
      Wi-Fi; Meraki's sign-on splash collects name and e-mail and leaves consent to
      the administrator; UniFi's own portal collects nothing, and the products that
      add it (Spotipo, Art of WiFi) add a configurable registration form. Vietnam's
      Decree 356/2025/ND-CP forbids pre-ticked boxes and treating silence as
      consent, and asks that consent be separated by purpose, be verifiable as to
      its time and content, and be easy to withdraw — which is why a guest can
      withdraw from the portal itself (`withdrawOwnMarketingConsent`) and an
      administrator can for them (`withdrawMarketingConsent`).

# Everything here requires an admin session except the guest portal's own operations
# and the two ways in, which say so with `security: []`. The `401` and `403` those
# operations can answer are a property of the scheme rather than of any one operation,
# so they are described once on `sessionCookie` instead of on every operation.
security:
  - sessionCookie: []

paths:
  # ─────────────────────────────────────────────────────────────── portal ──

  /portal/context:
    get:
      operationId: getPortalContext
      x-permission: "public"
      tags: [portal]
      summary: What the portal may show this client.
      description: |
        Resolved server-side from the NAS redirect parameters **after**
        `NASDriver.VerifyPresence()` has confirmed the MAC is really associated, on
        the claimed AP, in the claimed site, and still unauthorized.

        The NAS parameters themselves are never echoed back. UniFi passes `ap`,
        `id`, `t`, `url` and `ssid` as unsigned query parameters that anyone can
        forge; returning them would make this endpoint an oracle for what the portal
        believes about an attacker-supplied MAC.
      security: []
      responses:
        "200":
          description: Presence verified. The portal may proceed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalContext" }
        "403":
          description: |
            Presence could not be verified. The client is not associated, is on a
            different AP or site, or is already authorized. The portal renders the
            problem page; it does not retry and does not explain which check failed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal/voucher:
    post:
      operationId: redeemVoucher
      x-permission: "public"
      tags: [portal]
      summary: Redeem a voucher code. Form navigation, not JSON.
      description: |
        **Answers `303 See Other`, always.** Success and failure are both
        navigations, because the CNA only re-checks captivity after one.

        The success document is sent in full *before* the NAS is asked to authorize
        the client — Android destroys the login WebView the moment the network
        validates, so anything written after authorization may never be seen.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: |
                    Case-insensitive. Group separators and whitespace are stripped
                    before validation, so a code copied with or without dashes works.
                  example: ABCD-EFGH-JKMN
                lang:
                  $ref: "#/components/schemas/Language"
                name: { $ref: "#/components/schemas/GuestNameInput" }
                phone: { $ref: "#/components/schemas/GuestPhoneInput" }
                email: { $ref: "#/components/schemas/GuestEmailInput" }
                marketingConsent: { $ref: "#/components/schemas/MarketingConsentInput" }
                consentVersion: { $ref: "#/components/schemas/ConsentVersionInput" }
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"

  /portal/agree:
    post:
      operationId: acceptTerms
      x-permission: "public"
      tags: [portal]
      summary: Click-through — the guest agrees and is let on. Form navigation, not JSON.
      description: |
        **The most-requested café mode, and the cheapest honest one**: no credential,
        no personal data, no account. The guest reads the terms and presses one
        button.

        Same shape as `redeemVoucher` and for the same reasons — `303 See Other` on
        every outcome because the CNA only re-checks captivity after a navigation,
        and the success document sent in full *before* the NAS is asked to authorize,
        because Android destroys the login WebView the moment the network validates.

        **The consent is the whole of the authentication, so the terms and this
        button are on the same document, adjacent.** A separate agree page would
        render the terms twice or move them away from the action; both are worse.

        `VerifyPresence` still applies. A mode with no credential is a mode where the
        only thing standing between an arbitrary MAC and a grant is the driver
        confirming that MAC is actually associated (`docs/rules/security.md` §4) —
        so this is the operation where skipping it would matter most.

        Refused with `404` where the venue has not enabled the method, rather than
        silently granting: an endpoint that works when the button is hidden is an
        endpoint somebody finds.

        **A presence failure here is a `303` to the problem page, not a `403` problem
        document**, which is what both servers do — `web/mock` and the Go server. Two
        measured reasons, and the second is the one that decides it:

        - A form navigation answered `403 application/problem+json` **renders raw JSON
          to the guest**, inside a 900 × 550 pt mini-browser with no back button. There
          is no client left to turn a problem document into a sentence: the submit
          replaced the document, and the flow must complete with JavaScript disabled.
        - **It is not a navigation the CNA treats as a captivity re-check.** The button
          stays *Cancel*, and Cancel disassociates the device. So the one response that
          could explain the failure is also the one that throws the guest off the
          network before they can read it.

        The `404` above is deliberately *not* corrected with it, and the difference is
        the narrow one: no guest navigation reaches it. The button is hidden at a venue
        that has not enabled the method, so that response answers a request the portal
        never makes — a hand-made one, from somebody who found the endpoint. Both
        servers answer it identically today.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                lang:
                  $ref: "#/components/schemas/Language"
                name: { $ref: "#/components/schemas/GuestNameInput" }
                phone: { $ref: "#/components/schemas/GuestPhoneInput" }
                email: { $ref: "#/components/schemas/GuestEmailInput" }
                marketingConsent: { $ref: "#/components/schemas/MarketingConsentInput" }
                consentVersion: { $ref: "#/components/schemas/ConsentVersionInput" }
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"
        "404":
          description: |
            This venue does not offer click-through access. Reachable only by a
            request the portal does not make — see the note above on why a presence
            failure is not answered this way.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal/account:
    post:
      operationId: loginWithAccount
      x-permission: "public"
      tags: [portal]
      summary: Log in with a local account. Form navigation, not JSON.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                lang: { $ref: "#/components/schemas/Language" }
                name: { $ref: "#/components/schemas/GuestNameInput" }
                phone: { $ref: "#/components/schemas/GuestPhoneInput" }
                email: { $ref: "#/components/schemas/GuestEmailInput" }
                marketingConsent: { $ref: "#/components/schemas/MarketingConsentInput" }
                consentVersion: { $ref: "#/components/schemas/ConsentVersionInput" }
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"

  /portal/phone:
    post:
      operationId: requestPhoneCode
      x-permission: "public"
      tags: [portal]
      summary: Send a sign-in code to a phone number. Form navigation, not JSON.
      description: |
        **The first half of phone sign-in**, and it grants nothing. The venue's
        provider is asked to send a six-digit code to the number submitted; the guest
        is sent to `/{lang}/phone/?sent=1` to type it, or back to the phone form with
        a reason.

        **Answers `303 See Other`, always**, for the reason every portal operation
        does: the flow must complete with JavaScript off and the CNA only re-checks
        captivity after a navigation.

        **The number is never echoed.** It is not in the redirect, not in the page,
        and not in any log line: a phone number in a `Location` header is a phone
        number in every proxy log between the handset and the portal. The code is
        bound server-side to this browser's portal session, which is what
        `verifyPhoneCode` resolves it from.

        `VerifyPresence` runs **before** anything is sent. That is not only
        `docs/rules/security.md` §4: a message costs the venue money, and the top
        risk on this endpoint is SMS toll fraud rather than guessing (§9), so a device
        the controller cannot place on the network does not get to spend the venue's
        SMS budget at all. After it, in order: the number must be a Vietnamese mobile
        number (the destination allowlist defaults to the install's own country), then
        per-device and per-address limits, then per-number limits and the site's
        **daily message ceiling, which fails closed** — a ceiling that cannot be read
        is a ceiling that is reached.

        `404` where the venue has not configured phone sign-in, for the same reason as
        `acceptTerms`: an endpoint that works while its button is hidden is an
        endpoint somebody finds.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  maxLength: 32
                  description: |
                    As the guest typed it: `0912 345 678`, `+84912345678` and
                    `84912345678` are the same number. Spaces, dots, dashes and
                    brackets are ignored.
                  example: "0912 345 678"
                lang:
                  $ref: "#/components/schemas/Language"
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"
        "404":
          description: This venue does not offer phone sign-in.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal/phone/code:
    post:
      operationId: verifyPhoneCode
      x-permission: "public"
      tags: [portal]
      summary: Sign in with the code a phone received. Form navigation, not JSON.
      description: |
        **The second half of phone sign-in, and the one that grants.** Same shape as
        `redeemVoucher`: `303` on every outcome, and the success document is sent in
        full *before* the NAS is asked to authorize the client.

        The code is the one most recently sent for **this browser's portal session**
        — never looked up by phone number or MAC — and it is checked in constant time
        against a keyed hash; the code itself is not stored. It is single use, lives
        five minutes and survives five wrong attempts, after which the guest asks for
        a new one. Requesting a new code retires the previous one, so asking again
        does not multiply the attempts available.

        **The venue's guest-data setting applies here as on the other three
        methods**: the code form carries the fields
        the venue asks for and its marketing checkbox, read before the code is spent.
        `phone` is not among them — the number this guest just proved is the phone
        the venue collects, so a venue that asks for one never asks twice, and a
        consent given here names the verified number.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 16
                  description: Six digits. Spaces are ignored.
                  example: "482913"
                lang:
                  $ref: "#/components/schemas/Language"
                name: { $ref: "#/components/schemas/GuestNameInput" }
                email: { $ref: "#/components/schemas/GuestEmailInput" }
                marketingConsent: { $ref: "#/components/schemas/MarketingConsentInput" }
                consentVersion: { $ref: "#/components/schemas/ConsentVersionInput" }
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"
        "404":
          description: This venue does not offer phone sign-in.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal/status:
    get:
      operationId: getPortalStatus
      x-permission: "public"
      tags: [portal]
      summary: What the connected page may show about this grant.
      description: |
        Deliberately thin. It carries what the venue granted — not what the client
        has used, because that number does not exist at a useful freshness.
      security: []
      responses:
        "200":
          description: Grant found for this client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalStatus" }
        "404":
          description: No active grant. The portal shows the welcome page.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal/marketing-consent/withdraw:
    post:
      operationId: withdrawOwnMarketingConsent
      x-permission: "public"
      tags: [portal, guest-data]
      summary: The guest withdraws their marketing consent. Form navigation, not JSON.
      description: |
        Decree 356/2025/ND-CP asks for a withdrawal path that is easy to find, and the
        easiest one a guest has is the portal they consented on. The connected page
        carries this button wherever the venue asks for marketing consent.

        **Withdraws every active consent this device gave at this venue** — the
        device is the portal session's verified MAC, never a parameter — and answers
        `303` to the connected page with `?n=consent-withdrawn`, whether or not there
        was anything to withdraw: whether a device ever consented is not something a
        stranger holding its MAC should be able to learn by pressing a button.

        **Only a portal session that holds a grant withdraws anything** — the browser
        that signed in, with the cookie it was given after `VerifyPresence`. A session
        without one is answered the same `303` and withdraws nothing, even when the
        controller confirms its MAC is online: presence proves a MAC is on the
        network, not that the caller is that device, and MACs are visible over the
        air. The button is only rendered on
        the connected page, which only a session holding a grant reaches; a guest who
        lost that browser asks the venue, which withdraws for them
        (`withdrawMarketingConsent`).
        The withdrawn record keeps when it was given, the text's version and when it
        was withdrawn — the evidence the venue needs that it stopped — and
        `withdrawnBy: guest`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                lang:
                  $ref: "#/components/schemas/Language"
      responses:
        "303":
          $ref: "#/components/responses/PortalRedirect"

  # ────────────────────────────────────────────────────────── controllers ──

  /controllers:
    get:
      operationId: listControllers
      x-permission: "nas:read"
      tags: [controllers]
      summary: The controllers this deployment can reach.
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Controller" }
    post:
      operationId: createController
      x-permission: "nas:manage"
      tags: [controllers]
      summary: Register a controller.
      description: |
        **This is the object an operator possesses.** Ubiquiti's own external-portal
        API is entirely controller- and site-scoped, and the access point appears in it only as a MAC in a query
        string.

        The credential is stored write-only, like a RADIUS shared secret and for the
        same reason — it is a password to somebody's network.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControllerCreate" }
      responses:
        "201":
          description: Registered. Probe it next.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Controller" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /controllers/{controllerId}:
    parameters:
      - name: controllerId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getController
      x-permission: "nas:read"
      tags: [controllers]
      summary: One controller.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Controller" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateController
      x-permission: "nas:manage"
      tags: [controllers]
      summary: Rename it, re-point it, or replace its credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControllerUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Controller" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/ValidationProblem"
    delete:
      operationId: deleteController
      x-permission: "nas:manage"
      tags: [controllers]
      summary: Forget a controller.
      description: |
        **Refused while access points discovered from it are still registered.**
        Deleting the controller would leave devices Foyer speaks RADIUS to with no
        way to authorize a guest on them and no record of where they came from —
        present in `clients.conf`, invisible in the console, and impossible to
        diagnose. Remove or re-home them first.
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Access points discovered from this controller still exist.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /controllers/{controllerId}/probe:
    parameters:
      - name: controllerId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: probeController
      x-permission: "nas:manage"
      tags: [controllers]
      summary: Can Foyer actually talk to it, and does it speak a version we support?
      description: |
        Answers the three questions a registration form cannot: does the address
        resolve and accept a connection, does the credential work, and is the
        software new enough.

        **The version check is not decoration.** UniFi's official integration API
        requires Network Application 9.1.105 or newer; below that the credential is
        an API key nothing will accept, and the failure presents as "the key is
        wrong". Foyer says which it is.
      responses:
        "200":
          description: Probe completed. May still report the controller unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerProbe" }
        "404": { $ref: "#/components/responses/NotFound" }

  /controllers/{controllerId}/discover:
    parameters:
      - name: controllerId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: discoverFromController
      x-permission: "nas:manage"
      tags: [controllers]
      summary: Ask the controller what access points exist, and adopt them.
      description: |
        **Access points are discovered, never typed.** The redirect a guest arrives
        with identifies the access point by **MAC** and nothing else, so Foyer has to
        be able to resolve a MAC to a device — and only the controller can do that.
        Typing twelve of them by hand also means typing the thirteenth, which is the
        moment an operator stops.

        Discovery is **reconciling, not additive**: a device the controller no longer
        reports is marked `missing` rather than deleted. An access point that
        disappeared for ten minutes is not the same fact as one an operator removed,
        and deleting on absence would silently drop its `clients.conf` entry the
        first time a controller was slow to answer.

        Every device adopted here shares the controller's **one** shared secret. That
        is not a simplification — it is how the hardware works: the secret lives in a
        controller-level RADIUS profile and every access point using that profile
        presents it, from its own address. `clients.conf` is therefore N addresses
        against one secret, which is the inverse of per-device registration.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                siteId:
                  type: string
                  description: The Foyer site to adopt them into. Defaults to the controller's.
                vendorSiteId:
                  type: string
                  description: |
                    Which of the controller's own sites to read. A controller manages
                    many; `ControllerProbe.vendorSites` lists them and the operator
                    picks one rather than typing a name they have to look up.
      responses:
        "200":
          description: Discovery completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The controller has not been probed, or is not reachable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ────────────────────────────────────────────────────────────────── nas ──

  /nas/{nasId}/evidence:
    parameters:
      - $ref: "#/components/parameters/NasId"
    get:
      operationId: getNasEvidence
      x-permission: "nas:read"
      tags: [nas]
      summary: How this device's capabilities and wire attributes are known.
      description: |
        **The CoA family's evidence, made visible.** The CoA family ships
        with every capability UNVERIFIED — no Cisco, Aruba, MikroTik or Ruckus
        device has been measured against Foyer — and that label must
        reach an operator rather than living only in the code.

        ── it is two lists because they disagree, and flattening them loses the fact ──

        `internal/nas` keeps `CapabilityEvidence` and `AttributeEvidence` separately
        and they answer differently on purpose:

        * every **wire encoding** is `documented` — the attribute names are read from
          FreeRADIUS's own dictionaries and the vendor tables, so *what Foyer will
          put on the wire* is known;
        * every **capability** of the CoA family is `unverified` — that any NAS
          *honours* what is sent has never been observed, because nothing here has
          ever sent it to a device.

        A client that merged them into one badge would be answering *"is this driver
        trustworthy"*, which is not a question either list asks. The right sentence
        for a Cisco row is *we know what we will send and we do not know what it will
        do*, and that needs both halves.

        ── why it is not on `NasProbe`, and not on `Nas` ──────────────────────

        **Not `NasProbe`**: that object is *"what one probe established — including
        the things it could not"*, and nothing here is established by a probe. These
        facts are properties of the driver and the vendor profile and are identical
        before and after any packet is sent. Putting them there would make a
        measurement out of a citation, which is the one thing that schema is shaped
        to prevent.

        **Not `Nas`**: `Nas` is returned by `listNas` for every row, and this is a
        dozen objects per device that a list has no use for.

        ── a `coa` row with no vendor ────────────────────────────────────────

        Answered `200` with `profile: vendor-not-chosen` and both lists empty, not
        `404` and not an error. Cisco and Aruba identify a session differently and a
        wrong guess is *an ACK with no effect* — the one failure a fake NAS cannot
        produce — so **"nobody said which vendor" has to be representable and
        refused**. An empty list with no state beside it would read as *this driver sends
        nothing*.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverEvidence" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites:
    get:
      operationId: listSites
      x-permission: "authenticated"
      tags: [overview]
      summary: Sites this operator may administer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
    post:
      operationId: createSite
      x-permission: "nas:manage"
      tags: [overview]
      summary: Create a site.
      description: |
        **Without this, a freshly deployed Foyer cannot register its first access
        point.** `createNas` requires a `siteId` and refuses `422` without one,
        correctly; a migrated database holds **zero** sites; and nothing else in the
        product can put the first row in. *A stranger installs it and a phone gets
        online* would be unreachable at step one, and a test world cannot show it
        because every test world already has a site.

        **A site is not seeded and must not be.** A migration that inserts one is a
        schema file pretending to be a fixture, and the name here is the **venue's**
        name — the one fact about a deployment that only the operator knows. A default
        of *"Default site"* would ship a placeholder that every install is then stuck
        renaming, on the screen where the operator is deciding whether this product
        knows what it is doing.

        ── one venue per install ─────────────────────────────────────────────

        **The second call is refused `409 /problems/one-site-per-install`**, and the
        operation's shape is the same either way: a client that creates the first
        site needs nothing else.

        The reasoning ends at the protocol rather than at product scope. `nas.nasname`
        is **globally unique** because FreeRADIUS's client list is one flat namespace
        with no tenant in it, and `nasname` is the value the server matches on — so it
        can be neither prefixed nor synthesised. Two venues on private-range networks
        both using `192.168.1.1` can never both be projected, and on those networks
        that is the common case rather than an edge one. A second customer is a second
        installation.

        **The refusal is this operation's, not the schema's.** `sites` still permits
        many rows: the tenant seam stays as insurance, migrations and test seeding
        still create more than one, and a store test proving a site scope needs two
        populated sites to prove anything at all. What is settled is that *this
        operation* will not make the second one.

        It is enforced in one statement — `INSERT … WHERE NOT EXISTS (SELECT 1 FROM
        sites)` — rather than as a count followed by an insert, which is the
        read-then-write shape §9 of the security rules rejects for voucher claims and
        rejects here for the same reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "409":
          description: |
            This deployment already has a site, and it holds one. See the
            operation description: FreeRADIUS's client namespace is flat, so two
            venues that share a private-range NAS address can never both be
            projected. A second customer is a second installation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/time-zone:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getSiteTimeZone
      x-permission: "portal:read"
      tags: [overview]
      summary: The calendar this site counts its days in.
      description: |
        An IANA zone name. It decides where *today* starts for everything that
        counts by the day: the phone sign-in daily ceiling and `sentToday`,
        `vouchersRedeemedToday`, the day and week buckets of `getTrends`, and the
        start and end dates of a portal block. Without it that would be the server
        process's local time, which in the shipped container is UTC — seven hours off
        for a venue in Vietnam.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteTimeZone" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateSiteTimeZone
      x-permission: "portal:manage"
      tags: [overview]
      summary: Change the site's time zone.
      description: |
        Refused `not-a-time-zone` for a name the server's zone database does not
        know. Takes effect without a restart. Moving the zone moves where today's
        daily ceiling starts, once; the ceiling itself is unchanged. Writes a
        `site-time-zone-changed` audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteTimeZoneUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteTimeZone" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /nas:
    get:
      operationId: listNas
      x-permission: "nas:read"
      tags: [nas]
      summary: Access points and controllers.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Nas" }
    post:
      operationId: createNas
      x-permission: "nas:manage"
      tags: [nas]
      summary: Register an access point.
      description: |
        The generated RADIUS shared secret is returned **exactly once**, in this
        response, and is never retrievable again. There is no default secret and no
        way to ask for it later — stock FreeRADIUS ships an example secret in its
        sample configuration, and shipped example credentials are how appliance
        software gets mass-owned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NasCreate" }
      responses:
        "201":
          description: Registered. Contains the only copy of the shared secret.
          content:
            application/json:
              schema:
                type: object
                required: [nas, sharedSecret]
                properties:
                  nas: { $ref: "#/components/schemas/Nas" }
                  sharedSecret:
                    type: string
                    description: Shown once. Never returned by any other operation.
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /nas/{nasId}:
    parameters:
      - $ref: "#/components/parameters/NasId"
    get:
      operationId: getNas
      x-permission: "nas:read"
      tags: [nas]
      summary: One access point.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nas" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateNas
      x-permission: "nas:manage"
      tags: [nas]
      summary: Rename or re-describe an access point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nas" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNas
      x-permission: "nas:manage"
      tags: [nas]
      summary: Remove an access point.
      description: |
        **Removing a device is not revoking it, and a client has to say so.**

        Measured against FreeRADIUS 3.2.10 with `read_clients = yes`: the row is
        deleted, the `nas` projection is synced, and the running server **still
        answers that client**. The definition was *discovered*, so the server holds it
        cached.

        **There is no number to give here and a client must not invent one.** The
        window is `lifetime` in the generated `clients.conf` — 300 seconds by Foyer's
        default — but that is a setting on a server no operation in this document
        reads, the expiry itself has never been waited out
        (`docs/protocol-reality.md` records it `UNVERIFIED`), and a client the server
        loaded at **startup** has no expiry at all and is held until it restarts. A
        restart is the only bounded answer. *"Up to five minutes"* would present a
        configured default as a measurement, which is the same defect one step
        sideways.

        This is `ChangeClass` one action along: an operator is shown what a change does
        to the running server before they trigger it, and deletion is the case where
        *nothing visible happens for a while* is the whole of the answer.
      responses:
        "204":
          description: |
            The row is gone. **Not a statement about the running server** — see above.
        "404": { $ref: "#/components/responses/NotFound" }

  /nas/{nasId}/probe:
    parameters:
      - $ref: "#/components/parameters/NasId"
    post:
      operationId: probeNas
      x-permission: "nas:manage"
      tags: [nas]
      summary: Ask the driver what this device can actually do.
      description: |
        Capabilities are measured, not declared. A probe that fails is a product
        finding and must fail loudly — a silent degradation to a lower capability
        set is how a UI ends up offering controls the hardware ignores.

        **The response carries everything the probe measured**, so a client never has
        to re-read the device to render an honest answer. If `messageAuthenticator`
        and `accountingConfigured` lived only on `Nas`, `probeNas` followed by
        `getNas` would be the only complete rendering, and a client that forgot the
        second call would show a device half measured. `NasProbe` says why it is
        shaped the way it is.

        The probe also **updates the stored record** where it measured something, so
        a subsequent `getNas` agrees with it. Where it measured nothing the record is
        left exactly as it was — an unreachable device does not lose what was last
        known about it, and the probe result says `not-measured` rather than
        repeating it.
      responses:
        "200":
          description: Probe completed. May still report the device unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NasProbe" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nas/{nasId}/secret:
    parameters:
      - $ref: "#/components/parameters/NasId"
    post:
      operationId: rotateNasSecret
      x-permission: "nas:manage"
      tags: [nas]
      summary: Generate a new RADIUS shared secret.
      description: |
        **Disruptive.** Where the driver cannot push the new secret
        (`capabilities.rotateSecret == false`) the device stops authenticating until
        an operator enters it by hand. Even where it can, a config apply classified
        `restart` drops every in-flight EAP conversation and the in-memory TLS
        session cache, so every corporate laptop on site re-authenticates.

        The admin UI states both consequences before asking for confirmation.

        **Refused where the driver cannot push *and* the device is currently
        unreachable** — the one combination with no route back. The new value could
        then only be entered by hand, on a device nothing can reach, so rotating
        would take it off the air until someone stands in front of it. Neither
        condition refuses on its own. This is the supported-but-currently-unavailable
        case, so the console disables the control with that reason rather than
        hiding it.
      responses:
        "200":
          description: Rotated. Contains the only copy of the new secret.
          content:
            application/json:
              schema:
                type: object
                required: [sharedSecret, changeClass]
                properties:
                  sharedSecret: { type: string, description: Shown once. }
                  changeClass: { $ref: "#/components/schemas/ChangeClass" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The driver cannot push a secret and the device is unreachable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /nas/{nasId}/coa-timing:
    parameters:
      - $ref: "#/components/parameters/NasId"
    put:
      operationId: updateNasCoaTiming
      x-permission: "nas:manage"
      tags: [network]
      summary: How long Foyer waits for this device to answer a CoA or Disconnect, and how often it asks again.
      description: |
        Per RADIUS client, because the answer is a property of the device and the path
        to it: a MikroTik on the same switch answers in milliseconds, a controller
        across a VPN may not. The value is stored on the device's `clients.conf` row,
        so every access point behind one row shares it — the same rule a shared secret
        follows.

        Takes effect on the next request to the device; nothing is restarted.
        `timeoutMs` outside 200–10 000 or `retries` outside 0–5 is
        `/problems/validation` with `below-minimum` or `above-maximum`. A device whose
        driver does not speak RFC 5176 is `/problems/validation` on `nasId` with
        `incorrect`: it has no CoA to time.

        Audited as `network-settings-changed`, subject `nas`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NasCoaTimingUpdate" }
      responses:
        "200":
          description: The timing as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NasCoaTiming" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  # ────────────────────────────────────────────────────────────── network ──

  /network/settings:
    get:
      operationId: getNetworkSettings
      x-permission: "nas:read"
      tags: [network]
      summary: The portal's public address, the sign-in throttles and the request ceilings.
      description: |
        Every value is the one this process is **using now**, with where it came from:
        `console` (saved here), `environment` (the bootstrap value the deployment
        supplied) or `derived`. A value saved here always wins over the environment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
    put:
      operationId: updateNetworkSettings
      x-permission: "nas:manage"
      tags: [network]
      summary: Change the portal's public address, the sign-in throttles or the request ceilings.
      description: |
        A whole replacement: every member is sent. `portalUrl: null` or
        `venueUrl: null` goes back to the deployment's own value.

        **Takes effect on the next request, with no restart**: the RFC 8908 answer,
        the plain-HTTP redirect, the throttles and the ceilings are all read per
        request from what this operation last saved.

        Refusals, all `/problems/validation`:

        - a URL that is not an absolute `http://` or `https://` address, or that
          carries credentials, is `not-a-web-address`;
        - while a portal certificate is served, `portalUrl` must be `https://` and
          name a host the certificate covers — `certificate-refused` with
          `reason` `portal-url-not-https` or `name-not-covered`, because RFC 8908
          hands the operating system this address and it will refuse any other;
        - a number outside its bound is `below-minimum` or `above-maximum`, with the
          bound; `bounds` in the response carries every one.

        Audited as `network-settings-changed`, with each changed value's old and new
        figure in `params`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkSettingsUpdate" }
      responses:
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /network/portal-certificate:
    put:
      operationId: putPortalCertificate
      x-permission: "nas:manage"
      tags: [network]
      summary: Upload the guest portal's HTTPS certificate and private key.
      description: |
        PEM, the certificate first and then any intermediates, and the private key
        that matches it. Checked before anything is stored: it parses, the key is the
        certificate's, each certificate in the chain is signed by the next, it is
        valid today, and it covers the host of the portal's public address
        (`portalUrl` in the body, when sent, is saved with it in the same write —
        the address and the certificate have to agree, so they can change together).

        **The key is write-only.** It is sealed under the deployment's key-encryption
        key before it is stored, and no operation returns it: the answer says only
        that a key is set. The certificate itself is public — every guest's browser is
        shown it — so its names, dates and fingerprint are returned.

        Served from the next TLS handshake. When the portal was plain HTTP until now,
        the HTTPS listener starts and the plain-HTTP listener begins sending guests to
        it; nothing restarts.

        A refusal is `/problems/validation` with `certificate-refused` on
        `certificatePem`, `privateKeyPem` or `portalUrl` and a `reason`:
        `not-pem`, `key-mismatch`, `expired`, `not-yet-valid`, `chain-broken`,
        `name-not-covered` or `portal-url-not-https`. A deployment with no
        key-encryption key cannot store a private key and answers `not-implemented`.

        Audited as `portal-certificate-changed`, with the fingerprint and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalCertificateUpload" }
      responses:
        "200":
          description: Stored, and what is served now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalCertificateStatus" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    delete:
      operationId: deletePortalCertificate
      x-permission: "nas:manage"
      tags: [network]
      summary: Remove the uploaded portal certificate.
      description: |
        The portal goes back to what the deployment supplies — a certificate file
        when there is one, plain HTTP when there is not — from the next request.
        **There is no HSTS to undo**: the portal never sends it
        (`cmd/foyer/portaltls.go`), so a guest who visited over HTTPS is not locked
        out by this.

        Audited as `portal-certificate-changed` with `removed: true`.
      responses:
        "200":
          description: Removed, and what is served now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalCertificateStatus" }

  /network/radius:
    get:
      operationId: getRadiusServerSettings
      x-permission: "nas:read"
      tags: [network]
      summary: FreeRADIUS's generator settings, and whether the running server has them.
      description: |
        The worker pool size, whether EAP-TLS is on and with which certificate, the
        last automatic sync of the RADIUS client table and the last apply of a
        generated configuration.

        `pendingApply` is true when a generator setting was saved after the last
        successful apply: the running server does not have it yet, and only
        `applyRadiusConfiguration` gives it to it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadiusServerSettings" }
    put:
      operationId: updateRadiusServerSettings
      x-permission: "nas:manage"
      tags: [network]
      summary: Change the worker pool size, or turn EAP-TLS on or off.
      description: |
        Saved, not applied. FreeRADIUS fixes its thread pool and its EAP module at
        start, so these are `restart` changes by nature and the console says so
        before it applies them; see `applyRadiusConfiguration`.

        `maxServers` outside 4–44 is `below-minimum` or `above-maximum`. The
        ceiling is PostgreSQL's connection budget, not a thread limit: every worker
        is an SQL connection, and 44 is what `max_connections = 80` leaves once
        every other login has its pool. Turning
        EAP-TLS on with no certificate uploaded is `/problems/validation` on
        `eapTlsEnabled` with `required`.

        Audited as `network-settings-changed`, subject `radius-server`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadiusServerSettingsUpdate" }
      responses:
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadiusServerSettings" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /network/radius/eap-certificate:
    put:
      operationId: putEapCertificate
      x-permission: "nas:manage"
      tags: [network]
      summary: Upload the EAP-TLS server certificate, its key and the CA that issues client certificates.
      description: |
        The same checks and the same write-only key as `putPortalCertificate`, less
        the name check (a supplicant checks the name against its own profile, not
        against an address Foyer serves), plus `caPem`: the CA that signed the
        supplicants' certificates, which is public.

        Saved, not applied: the certificate reaches FreeRADIUS on the next
        `applyRadiusConfiguration`, which writes it into the generated tree. Audited
        as `network-settings-changed`, subject `radius-server`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EapCertificateUpload" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadiusServerSettings" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /network/radius/sync:
    post:
      operationId: syncRadiusClients
      x-permission: "nas:manage"
      tags: [network]
      summary: Write the client table FreeRADIUS reads from the registered RADIUS clients, now.
      description: |
        **This runs by itself after every change to a RADIUS client** — `createNas`,
        `updateNas`, `deleteNas`, `rotateNasSecret`, `discoverFromController` — so an
        operator never has to. It is an operation as well so that the console can
        retry one that failed, and so that the state can be refreshed after the
        database was changed some other way.

        One transaction: every client is projected or none is. What it did, what it
        could not project and why, and whether the running server needs a restart
        to see it are all in the answer, and the same record is what
        `getRadiusServerSettings` returns as `lastSync`.

        Audited as `radius-clients-synced`.
      responses:
        "200":
          description: The sync ran. Its outcome may still be a refusal; see `outcome`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadiusClientSync" }

  /network/radius/apply:
    post:
      operationId: applyRadiusConfiguration
      x-permission: "nas:manage"
      tags: [network]
      summary: Generate FreeRADIUS's configuration from the saved settings and restart it.
      description: |
        **Disruptive, and the console says so first**: a restart drops every
        in-flight EAP conversation and the in-memory TLS session cache, so every
        802.1X supplicant on site re-authenticates. Guests on the portal are not
        affected beyond the seconds the server is down.

        The tree is handed to the supervisor that ships in Foyer's FreeRADIUS image,
        which checks it with `radiusd -C`, restarts FreeRADIUS on it and waits for it
        to report ready — and on any failure puts the previous configuration back and
        keeps serving. No command is typed or stored anywhere; the answer is the
        supervisor's, and `detail` carries its reason when it refused. Where the
        deployment runs no supervisor, the tree is written and `outcome` is
        `restart-unavailable` — said, never reported as applied. Where it writes no
        tree at all, `outcome` is `not-configured`.

        Audited as `radius-configuration-applied`.
      responses:
        "200":
          description: The apply ran. Its outcome may still be a failure; see `outcome`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadiusApply" }

  /network/coa-timing:
    get:
      operationId: listCoaTiming
      x-permission: "nas:read"
      tags: [network]
      summary: Every device Foyer sends CoA or Disconnect to directly, with its timing.
      description: |
        The devices whose driver speaks RFC 5176 itself — `mikrotik` and `coa`. A
        controller-driven access point is ended through its controller's API, which
        has timing of its own, and is not listed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, defaults, bounds]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NasCoaTiming" }
                  defaults: { $ref: "#/components/schemas/CoaTimingValues" }
                  bounds: { $ref: "#/components/schemas/CoaTimingBounds" }

  # ───────────────────────────────────────────────────────────── vouchers ──

  /voucher-batches:
    get:
      operationId: listVoucherBatches
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: Voucher batches — the unit operators actually work in.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/VoucherBatch" }
    post:
      operationId: createVoucherBatch
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: Generate a batch of vouchers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherBatchCreate" }
      responses:
        "201":
          description: Generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoucherBatch" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /voucher-batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getVoucherBatch
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: One batch.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoucherBatch" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vouchers:
    get:
      operationId: listVouchers
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: Individual vouchers.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: batchId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/VoucherState" }
          style: form
          explode: false
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Voucher" }

  /vouchers/{voucherId}/revoke:
    parameters:
      - name: voucherId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: revokeVoucher
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: Revoke a voucher, and optionally the session using it.
      description: |
        Revoking a voucher that is currently in use does **not** by itself end the
        session — that requires a driver call, and whether it can be made depends on
        the NAS. The response reports what actually happened rather than what was
        intended.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [voucher, sessionEnded]
                properties:
                  voucher: { $ref: "#/components/schemas/Voucher" }
                  sessionEnded:
                    type: boolean
                    description: |
                      False when a session was live but the driver could not end it.
                      The UI must say so rather than implying the guest is offline.
                  failure:
                    $ref: "#/components/schemas/Failure"
                    description: |
                      Present when `sessionEnded` is false **and a driver call was
                      attempted** — `/problems/session-end-failed`. Absent when there
                      was no session to end, which is not a failure and must not be
                      reported as one.

                      `params` carries `nasName` and `nasReachability`, because the
                      operator's next action depends on which of them it is: an
                      access point that is unreachable is a different afternoon from
                      one whose controller credentials expired.
                  driverError:
                    type: string
                    deprecated: true
                    description: |
                      **Superseded by `failure`.**

                      It is a server-composed sentence, so it arrives in the server's
                      language rather than the reader's, and a client that rendered it
                      verbatim would show it in the wrong language. The guards on
                      server-composed text walk *problem documents*, and this string
                      travels in the body of a `200` — which is why `Failure` exists as
                      a schema rather than as a note.

                      Deprecated: neither server sends it, so a client reading it
                      gets `undefined` rather than the wrong language.
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────────────────────────────────────── sessions ──

  /sessions:
    get:
      operationId: listSessions
      x-permission: "sessions:read"
      tags: [sessions]
      summary: Sessions. Read-only, forever.
      description: |
        Backed by `radacct`, which FreeRADIUS owns. There is no write operation here
        and there never will be — an "edit session" affordance can never be built.

        Pagination is cursor-based and deliberately carries no total: `COUNT(*)` on
        an accounting table is not affordable at the sizes this reaches.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: state
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/SessionState" }
          style: form
          explode: false
        - name: nasId
          in: query
          schema: { type: string }
        - name: mac
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Session" }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSession
      x-permission: "sessions:read"
      tags: [sessions]
      summary: One session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/disconnect:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: disconnectSession
      x-permission: "sessions:manage"
      tags: [sessions]
      summary: End a guest's session on the device, and optionally withdraw what let them on.
      description: |
        **An out-of-band action on the device, not a write to the session.** Nothing
        here touches `radacct`: the device ends the session and reports the stop in
        its own accounting, which is how the row comes to read `ended`. A
        disconnect that did not happen therefore leaves the row `online`, which is
        the truth.

        Dispatched through the device's driver and its capability model
        (`docs/rules/nas-drivers.md`):

        - the CoA family (Cisco, Aruba) and MikroTik send an RFC 5176
          **Disconnect-Request** carrying Message-Authenticator, and a NAK is a
          failure carrying its `Error-Cause`, never a success;
        - UniFi asks its **controller** to unauthorize the guest;
        - a device whose driver cannot end a session — **Ruckus** by decision, since
          SmartZone ends captive sessions through its Northbound API and PacketFence
          documents that RADIUS Disconnect fails there, and Omada while it has no
          driver — is refused with `/problems/disconnect-unsupported` **before
          anything is changed**. The console hides the control on that device and
          says why, from `Capabilities.canDeauthGuest`; this refusal is the server
          reading the driver rather than the stored column.

        **Why the two revocations are options, and why they run first.** Ending a
        session does not end the guest's right to one: on the RADIUS path a device
        re-associates and re-authenticates with the same voucher or account within
        seconds, and a disconnect that the next association undoes is a control
        that only looks like one. PacketFence separates the same two things —
        *deauthenticate* ends the session, *unregister* withdraws the access — and
        ClearPass Guest's Active Sessions disconnect leaves the visitor account
        alone. So the operator chooses, and what was chosen is withdrawn **before**
        the device is asked: the other order leaves a window in which the guest is
        back on before the voucher is revoked.

        The answer reports what happened rather than what was intended, on the rule
        `revokeVoucher` set: revocations that succeeded and a disconnect that did
        not is a `200` carrying `failure`.

        Recorded in the audit log as `session-disconnected` whether or not the
        device confirmed it — an attempt that revoked a voucher is a change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionDisconnectRequest" }
      responses:
        "200":
          description: Attempted. The body says what the device and the store actually did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDisconnectResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Nothing was changed. `/problems/session-not-live` — the session has
            already ended. `/problems/disconnect-unsupported` — this device's driver
            cannot end a session; `params` carries `driver` and `nasName`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portal-grants:
    get:
      operationId: listPortalGrants
      x-permission: "sessions:read"
      tags: [sessions]
      summary: Guests the portal let on whose authorization is still open.
      description: |
        The portal's own record of every guest it let on at this venue and has not
        seen end — not revoked, not past its expiry — newest first.

        **Why this exists beside `listSessions`.** A session is a `radacct` row, and
        on a network the controller authorizes with no RADIUS accounting profile —
        UniFi's hotspot with an External Portal and no accounting server — there is
        none: the guest is online and the session list is empty, so there was nothing
        to disconnect. UniFi's Hotspot Manager and Omada's Portal
        Authorization list both hang *unauthorize* on the authorization record for
        exactly this reason, and so does this. A guest who also has a RADIUS session
        appears in both lists.

        `canDisconnect` is the device's driver, read now: a controller can unauthorize
        a guest it authorized; on the RFC 5176 family a guest is a RADIUS session and
        is ended from `disconnectSession`.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/PortalAuthorization" }

  /portal-grants/{grantId}/disconnect:
    parameters:
      - name: grantId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: disconnectPortalGrant
      x-permission: "sessions:manage"
      tags: [sessions]
      summary: Unauthorize a portal guest on its controller, and withdraw the grant.
      description: |
        For a guest the portal let on through a controller: the grant is revoked
        first, the voucher too when asked, and then the controller is asked to
        unauthorize the device — the order `disconnectSession` keeps, for the same
        reason: the other order leaves a window in which the guest is back on before
        the voucher is revoked. The answer reports what happened, on the same shape:
        a controller that refused or did not answer is a `200` carrying `failure`,
        with the grant already withdrawn.

        A device whose guests are not the controller's to unauthorize — the RFC 5176
        family, where a guest is a RADIUS session, and Ruckus and Omada, which Foyer
        does not drive — is refused with `/problems/disconnect-unsupported` before
        anything changes. A grant already revoked or past its expiry is
        `/problems/session-not-live`.

        Audited as `session-disconnected`, subject `portal-grant`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalGrantDisconnectRequest" }
      responses:
        "200":
          description: Attempted. `grantsRevoked` is 1; the body says what the controller did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDisconnectResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Nothing was changed. `/problems/session-not-live` — the authorization is
            already over. `/problems/disconnect-unsupported` — this guest's device is
            not driven through a controller; `params` carries `driver` and `nasName`
            when the device is known.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ───────────────────────────────────────────────────────────── accounts ──

  /accounts:
    get:
      operationId: listAccounts
      x-permission: "accounts:manage"
      tags: [accounts]
      summary: Local accounts.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      x-permission: "accounts:manage"
      tags: [accounts]
      summary: Create a local account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAccount
      x-permission: "accounts:manage"
      tags: [accounts]
      summary: Update an account, including its password and its 802.1X opt-in.
      description: |
        Partial: an omitted member is unchanged.

        **`password` and `eapTtlsPap` travel together, because the second is made
        from the first.** Opting an identity in stores a bcrypt verifier
        (`Account.credentialKind`), which serves RADIUS PAP from a NAS today;
        EAP-TTLS/PAP, which the field is named for, is planned — `internal/raddb`
        does not generate it yet. A verifier can only be made
        from the cleartext, which Foyer never keeps. So `eapTtlsPap: true` on an
        account that is not already opted in requires `password` in the same
        request — refused `required` on `password` otherwise. A new `password` on an
        opted-in account replaces both verifiers, so the portal and the network
        never answer to two different passwords. `eapTtlsPap: false` removes the
        bcrypt verifier and needs nothing else.

        A password longer than 72 bytes cannot be a bcrypt input; with
        `eapTtlsPap` in force it is refused `above-maximum` on `password` with
        `maximumCount: 72` — bytes, and a Vietnamese passphrase spends two or three
        per letter. The 802.1X username is unique across the install, because a
        supplicant sends no site; another venue's opted-in namesake is `duplicate`
        on `eapTtlsPap`.

        A change to either is audited as `account-credentials-changed`, whose
        params say what changed and never carry a value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                enabled: { type: boolean }
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Write-only. A new password for the portal, and for 802.1X where `eapTtlsPap` is in force.
                eapTtlsPap:
                  type: boolean
                  description: Whether this identity may authenticate to the network with its password — RADIUS PAP from a NAS today; EAP-TTLS/PAP is planned and not generated yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    delete:
      operationId: deleteAccount
      x-permission: "accounts:manage"
      tags: [accounts]
      summary: Delete an account.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────── auth ──

  /auth/session:
    get:
      operationId: getAuthSession
      x-permission: public
      security: []
      tags: [auth]
      summary: Who am I.
      description: |
        The console's first call, and **`401` here is a normal answer rather than an
        error**: it means nobody is signed in, which is the state every console starts
        in. Nothing logs it, nothing reports it as a fault, and the client's response
        to it is to route to the sign-in screen — not to render a failure. That is why
        it carries `/problems/not-signed-in` and why that value is a member of
        `ProblemType` rather than a bare status.

        It answers with the operator **and with the permissions that operator has**,
        so a console gates on what this server says rather than on a table compiled
        into the client. See `OperatorPermission` for why that distinction is
        load-bearing rather than tidy.
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/NotSignedIn" }
    post:
      operationId: signIn
      x-permission: public
      security: []
      tags: [auth]
      summary: Sign in.
      description: |
        **`401` says the username or the password is wrong, and never which.** That is
        not a courtesy: an answer that distinguishes the two is a username oracle, and
        it makes "is there an account for this person" a fact anyone can confirm from
        the sign-in form. A **disabled** operator therefore receives exactly the same
        refusal as an unknown one — otherwise disabling an account publishes its
        existence.

        JSON, and deliberately not the portal's form-navigation shape. The `303` in
        `POST /portal/voucher` exists for the iOS Captive Network Assistant, which
        re-checks captivity only after a document navigation; the admin console runs
        on its own listener (`docs/rules/security.md` §7), in an ordinary browser,
        and has none of those constraints. Copying the portal's shape here would be
        carrying a workaround into the one place its cause does not exist.

        On success the server sets the session cookie described by the `sessionCookie`
        security scheme — `httpOnly`, `SameSite`, `secure` — and the body carries the
        CSRF token, because a cookie the client is forbidden to read cannot also be
        the token the client has to echo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: |
            Signed in. `Set-Cookie` carries the session; the body carries the operator,
            the permissions and the CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: The username or the password is wrong, and the answer does not say which.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/SignInRateLimited" }
    delete:
      operationId: signOut
      x-permission: authenticated
      tags: [auth]
      summary: Sign out.
      description: |
        Ends the session and clears the cookie. Answers `204` whether or not there was
        a session to end: "sign me out" has one correct outcome, and a client that has
        just been told `401` by something else must still be able to reach it.
      responses:
        "204": { description: Signed out. }

  /auth/password:
    post:
      operationId: changeOwnPassword
      x-permission: authenticated
      tags: [auth]
      summary: Change your own password.
      description: |
        **Your own, and there is no operation for anybody else's.** That absence is
        deliberate and is recorded on `OperatorUpdate`, which is the schema a
        `password` member would be added to.

        `currentPassword` is required even though the caller already holds a session.
        The session proves the browser was signed in at some point; it does not prove
        the person at the keyboard is the operator, and an unattended console is the
        ordinary case in a café or a hotel back office.

        **This is the one operation that answers while `mustChangePassword` is set**,
        together with `getAuthSession` and `signOut`. It is what clears the flag, so a
        gate that refused it too would be a console with no way out of its own first
        screen.

        **The new password may not be the current one** (`unchanged` on
        `newPassword`). Without that the forced change is a formality an operator
        satisfies by retyping the temporary password they were handed, and the flag
        clears with nothing changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed. }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /auth/setup:
    get:
      operationId: getAdminSetup
      x-permission: public
      security: []
      tags: [auth]
      summary: Whether this install still needs its first administrator.
      description: |
        **Foyer ships no credential** (`docs/rules/security.md` §7). A fresh install
        has no operator at all; the installer (`deploy/first-boot.sh`) opens a one-time
        setup and prints a random **setup code**, and the console's sign-in screen asks
        this question to decide whether to show the *create the administrator* form
        instead of the sign-in form.

        `required: true` from the moment the installer opens the setup until
        `completeAdminSetup` succeeds once, and `false` forever after — including on an
        install that never opened one. `noAdministrator` distinguishes the two `false`
        cases: an install with an administrator answers `false`, and an install whose
        installer never finished answers `true` — with no administrator *and* no open
        code, the sign-in form can never succeed, so the console says so rather than
        showing a form that cannot work. Anonymous, because the person asking has no
        account yet; it discloses nothing an attacker could not learn by trying
        `completeAdminSetup`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSetupState" }
    post:
      operationId: completeAdminSetup
      x-permission: public
      security: []
      tags: [auth]
      summary: Create the first administrator, once, with the installer's setup code.
      description: |
        **The first-access setup, and it closes permanently the first time it
        succeeds.** Creates an enabled `administrator` with the username and the
        password typed here, signs that browser in (the same `Set-Cookie` and body as
        `signIn`), and marks the setup complete in the same transaction — so two
        browsers racing for it produce one administrator and one `409`.

        What the field does: authentik's `initial-setup` flow and
        UniFi's and Omada's first-run wizards let **whoever reaches the page first**
        create the administrator; Jenkins (`initialAdminPassword`), GitLab
        (`initial_root_password`) and Keycloak (a temporary bootstrap admin, or the
        welcome page on loopback only) bind the first access to a secret the
        installer holds. Foyer's console is published on every interface, so a
        first-come setup would hand the RADIUS server to anybody on the venue LAN who
        opens the page before the owner does — the Jenkins shape, therefore: a random
        80-bit `setupCode`, printed by the installer and never stored in clear, as
        OWASP ASVS 4.0 §2.3.1 asks of an initial secret.

        - `setupCode` wrong: `422` `incorrect` on `setupCode`. Case, spaces and
          dashes are ignored, and `O`/`I`/`L` read as `0`/`1`/`1`.
        - The password obeys the same floor as every operator password
          (`PASSWORD_MIN_LENGTH`), `below-minimum` on `password`.
        - Already completed, or never opened: `409` `/problems/setup-complete`,
          whatever the body says — a finished install answers every caller the same.
        - Throttled per client address with the console's sign-in address bucket,
          `429` + `Retry-After`. **Not** per account: there is no account yet, and a
          single shared bucket would let one device keep the owner out of their own
          install. 80 bits at the address budget is out of reach of guessing.

        Audited as `operator-created` by the new administrator, `params.setup: true`.
        The code stops working the moment the setup completes; re-running the
        installer before then prints a fresh code and retires the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetupRequest" }
      responses:
        "200":
          description: |
            The administrator exists and this browser is signed in as it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "409":
          description: The setup is not open — it was completed, or this install never opened one.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/SignInRateLimited" }

  # ─────────────────────────────────────────────────────────── operators ──

  /operators:
    get:
      operationId: listOperators
      x-permission: operators:manage
      tags: [operators]
      summary: The people who can sign in to this console.
      description: |
        **Not site-scoped, and that is the whole distinction from `Account`.** An
        `Account` is a *guest's* identity: it carries `siteId` and it has an
        `argon2id+nt` branch, because a guest identity may be opted in to
        PEAP-MSCHAPv2. An operator works across sites — the site switcher in the
        header is the evidence — and never authenticates over RADIUS, so it never
        needs an NT hash and can be `argon2id` unconditionally
        (`docs/rules/security.md` §1).

        Two objects, therefore, and not one table with a flag. A flag would put a
        password-equivalent NT hash one boolean away from every administrator in the
        deployment.

        **Roles are deployment-wide, not per-site**, and that is stated rather
        than hidden: whether a front-desk person at one café should see another café's
        guests is a deployment question for two venues with separate staff. A site
        scope is an addition to this object, not a redesign of it.
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Operator" }
    post:
      operationId: createOperator
      x-permission: operators:manage
      tags: [operators]
      summary: Create an operator.
      description: |
        The initial password is set here, by the administrator, and handed over in
        person. **That is the only delivery channel this product has**, and it is the
        same fact that keeps a password *reset* out of v1 — see `OperatorUpdate`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /operators/{operatorId}:
    parameters:
      - name: operatorId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateOperator
      x-permission: operators:manage
      tags: [operators]
      summary: Enable, disable, rename or change the role of an operator.
      description: |
        **Refused where it would remove the last enabled administrator** —
        `/problems/last-administrator`, `409`. Disabling that operator, demoting them
        to `staff`, or deleting them all reach the same state: a deployment nobody can
        administer, with no password-reset channel and no recovery short of a shell
        on the host (`foyerctl create-operator`, or `foyerctl open-setup` to reopen
        the first-run setup). The refusal is narrow on purpose and covers only
        what *nobody* can undo; an administrator demoting themselves while another
        administrator exists is allowed, because that other administrator can put it
        back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This would leave the deployment with no enabled administrator.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteOperator
      x-permission: operators:manage
      tags: [operators]
      summary: Delete an operator.
      description: |
        The audit entries this operator wrote **survive**, and they keep naming them:
        `AuditEntry.actorUsername` is denormalised for exactly this moment. A log that
        renders *"deleted operator"* where the name should be is a log that fails on
        the day it is being read for a reason.

        Refused where it would remove the last enabled administrator — see
        `updateOperator`.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This would leave the deployment with no enabled administrator.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ─────────────────────────────────────────────────────────────── audit ──

  /audit:
    get:
      operationId: listAudit
      x-permission: audit:read
      tags: [audit]
      summary: What was changed, by whom, and when.
      description: |
        **Read-only, forever** — the same standing as `radacct`, for a different
        reason. `radacct` is read-only because FreeRADIUS owns it; this is read-only
        because a log an administrator can edit is not a log. There is no create, no
        update and no delete operation here and there must never be one, which is
        asserted in the type system rather than asked for in prose:
        `contract/src/read-only.ts`.

        **Entries do end, by age and only by age.** The `audit` retention category
        (`getRetentionPolicy`, default two years) removes entries older than its
        period in a background sweep; nothing removes one entry, and no operation can.

        What it records is what cannot be undone or what is security-relevant: shared
        secret rotation, controller and access-point registration and deletion,
        walled-garden changes, portal settings and terms changes, operator changes,
        and voucher batch creation and revocation. `AuditKind` is the closed list.

        **Every entry is a kind plus params, never a sentence** — the same decision as
        `AlarmKind` and `ProblemType`: a server that composes text composes it in its
        own language, not the reader's. A log is the worst possible place for that: it is
        read long after the fact, by somebody who was not there, and a confidently
        phrased sentence in the wrong language is indistinguishable from a correct
        one.
      parameters:
        - name: actorId
          in: query
          schema: { type: string }
          description: Entries written by one operator. Their id, not their username — a username can be reused after a deletion.
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on `at`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound on `at`.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }

  # ───────────────────────────────────────────────────────────── privacy ──

  /privacy/retention:
    get:
      operationId: getRetentionPolicy
      x-permission: "privacy:manage"
      tags: [privacy]
      summary: How long each kind of guest data is kept, and what the sweep last did.
      description: |
        One entry per `RetentionCategoryId`, always all of them: a category an
        operator has never changed still has a period, and it is the default. A sweep
        runs every few minutes — in the `maintenance` service when deployed from
        `deploy/`, in the control plane's own process otherwise — and removes what is
        older than each period; `lastSweep` is its own record of the last pass, so an operator can
        see the policy being enforced rather than take it on trust.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
    put:
      operationId: updateRetentionPolicy
      x-permission: "privacy:manage"
      tags: [privacy]
      summary: Change retention periods.
      description: |
        Every change in the body is applied, or none is. `days: null` restores the
        category's default. A period outside the category's bounds is
        `/problems/validation` on `changes.<category>` with `below-minimum` or
        `above-maximum`; there is no undo for a period set too short, because the next
        sweep deletes what it no longer covers.

        Audited as `retention-policy-changed`, with each changed category's old and
        new period in `params`. **The entry is written in the same transaction as the
        change, and a change whose entry cannot be written is not made** — an
        internal problem, and the periods stay as they were.
        The minimums are also held by the database itself, so no caller of any kind
        can store a period below them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicyUpdate" }
      responses:
        "200":
          description: The policy as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /privacy/erasures:
    post:
      operationId: eraseDataSubject
      x-permission: "privacy:manage"
      tags: [privacy]
      summary: Erase every record of one guest, by device MAC, guest account, phone number or e-mail address.
      description: |
        The data subject's right to deletion (Law 91/2025/QH15 Article 4 clause 1 and
        Article 14; GDPR Article 17). Removes every row that names the subject from
        every table `docs/operator/personal-data.md` lists — every spelling of the MAC
        a NAS might have sent, a MAC used as the username under MAC authentication, or
        the account with its verifiers, its grants, the portal sessions bound to them
        and every accounting and sign-in row carrying its username **at the account's
        venue**. A guest account's username is unique per venue, so a namesake at
        another venue is a different guest and keeps their history; a row that cannot
        be attributed to any venue is erased.

        **By phone number** — the identifier a phone guest actually has: every sign-in
        code sent to it, every grant it was verified for with the portal sessions,
        address-book entries and marketing consents bound to those grants, every
        guest-details and marketing-consent row that gives it, and every sign-in
        event, accounting and post-auth row whose username is it — at every venue,
        because a number is one person's wherever they used it. Matched on its
        digits, so `0912 345 678`, `+84 912 345 678` and `84912345678` are one
        number.

        **By e-mail address**: every guest-details and
        marketing-consent row that gives it, compared without regard to case. The
        device's sign-in is not the address's and is found by the device's MAC.

        **The response lists every table searched, including those that held
        nothing.** A report that omitted empty tables could not be told apart from an
        erasure that never looked.

        **The audit log is pseudonymised, not deleted.** Earlier entries about the
        subject are kept — they are the record of what the venue's staff did — and
        every spelling of the identifier in them (the MAC, the username, the account
        id, the number, the address) is replaced by `pseudonym:` and sixteen hex
        digits: a keyed hash, the same for one subject in every entry, not reversible
        without the deployment's key. They are counted under `pseudonymised`, never
        under `removed` or `total`.

        Audited as `data-subject-erased`. **The entry names the subject masked**
        (`••:••:••:••:11:22`, `•••••••678`, `m•••@•••.vn`, or the account id) — an
        audit log that kept the identifier it records erasing would not have erased
        it. **An erasure whose entry cannot be written fails** with an internal
        problem, and Foyer's own tables are left as they were; the
        FreeRADIUS tables are erased in a step before it and are not restored, so run
        the erasure again, and the run that succeeds is the one recorded.

        Idempotent: erasing again removes nothing more and writes another entry. A MAC
        that is not one is `/problems/validation` on `subject.mac`
        (`not-a-mac-address`); a phone number that is not one — not eight to fifteen
        digits with an optional leading `+` and spaces, dots, dashes or brackets — is
        `not-a-phone-number` on `subject.phone`; an e-mail address that is not one is
        `not-an-email-address` on `subject.email`; an unknown account is
        `/problems/not-found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSubjectErasureRequest" }
      responses:
        "200":
          description: Erased. What was removed, table by table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectErasure" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /privacy/maintenance:
    get:
      operationId: getMaintenanceSettings
      x-permission: "privacy:manage"
      tags: [privacy]
      summary: How often Foyer cleans up, and how much one pass may do.
      description: |
        The maintenance Foyer runs by itself (`internal/jobs`) — in the `maintenance`
        service when deployed from `deploy/`, in the control plane's own process
        otherwise: expired
        portal and console sessions, vouchers past their expiry, sessions a rebooted
        access point never closed, the retention sweep and old phone codes. **One
        interval for all of them**, and the ceilings that bound a pass.

        Stored in the database. A change takes effect on the running jobs
        at once — the jobs are woken and wait the new interval from their last run
        — and no restart, environment variable or file is involved. Until an
        operator saves anything the defaults are in force and `isDefault` says so.

        **The per-job timeouts and the jitter are not settings**: each is derived
        from the interval (a pass may run for the interval or one minute, whichever
        is longer, the retention sweep four times that; up to a tenth of the
        interval is added at random), so there is no combination an operator can
        choose in which a healthy pass is cancelled by its own timeout. PacketFence
        exposes a timeout per task; it also documents that one set shorter than the
        task's run silently leaves the task unfinished, which is the case this
        derivation removes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceSettings" }
    put:
      operationId: updateMaintenanceSettings
      x-permission: "privacy:manage"
      tags: [privacy]
      summary: Change the maintenance interval and the per-pass ceilings.
      description: |
        Replaces every value. A value outside its bounds is `/problems/validation`
        on that field with `below-minimum` or `above-maximum`, carrying the figure.
        The bounds are the server's and are reported in `MaintenanceSettings.limits`,
        the way a retention category reports its own — so they are deliberately not
        JSON Schema `minimum`/`maximum` here, whose generic refusal carries no
        figure.

        Audited as `maintenance-settings-changed`, with each changed value's old and
        new figure in `params.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceSettingsUpdate" }
      responses:
        "200":
          description: The settings now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceSettings" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  # ────────────────────────────────────────────────────────── guest data ──

  /sites/{siteId}/guest-data:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getGuestDataSettings
      x-permission: "portal:read"
      tags: [guest-data]
      summary: What this venue asks its guests for at sign-in.
      description: |
        The fields the portal's sign-in forms carry and whether each is required to
        get online, and the marketing consent the venue asks for, with the SHA-256
        of each language's text as it now stands (`versions`). A venue that never
        configured this collects nothing: no fields, consent off.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDataSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGuestDataSettings
      x-permission: "portal:manage"
      tags: [guest-data]
      summary: Change what this venue asks its guests for.
      description: |
        Replaces the whole setting. Takes effect on the next document a guest loads;
        nothing restarts.

        Refused, beyond the schema, on the first rule that fails:

        - `fields` naming one field twice — `duplicate`;
        - marketing consent enabled with no text in any language —
          `marketingConsent.text`, `required`. The guest consents to words, and
          there must be some;
        - marketing consent enabled while neither `phone` nor `email` is collected —
          `fields`, `needs-contact-field`. A consent to be contacted, with nothing
          to contact, is a record of nothing.

        **Every text version is kept.** A consent records the SHA-256 of the exact
        text shown, and the text behind each version stays readable after the venue
        edits it, so a record made under last month's wording still says what the
        guest agreed to. Audited as `guest-data-settings-changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestDataSettingsUpdate" }
      responses:
        "200":
          description: The setting as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDataSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /sites/{siteId}/marketing-consents:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: listMarketingConsents
      x-permission: "privacy:manage"
      tags: [guest-data]
      summary: The marketing consents guests gave at this venue, newest first.
      description: |
        One row per consent a guest **ticked**. A guest who did not tick the box is
        not here and is nowhere else either. Withdrawn consents stay listed, with
        when and by whom, until the `marketingConsents` retention period removes
        them — the venue's evidence that it stopped. Administrators only: this is a
        list of people's contact details.
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MarketingConsentState" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/MarketingConsent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{siteId}/marketing-consents/{consentId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
      - name: consentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: withdrawMarketingConsent
      x-permission: "privacy:manage"
      tags: [guest-data]
      summary: Withdraw a guest's marketing consent on their behalf.
      description: |
        For a guest who asked by phone, by e-mail or at the counter. Idempotent: a
        consent already withdrawn is answered as it stands and is not withdrawn a
        second time. Audited as `marketing-consent-withdrawn`, naming the consent by
        id and never by the guest's contact details.
      responses:
        "200":
          description: The consent, withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingConsent" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────────────────────────────────────── overview ──

  # ────────────────────────────────────────────────────────── diagnostics ──

  /auth-attempts:
    get:
      operationId: listAuthAttempts
      x-permission: "sessions:read"
      tags: [diagnostics]
      summary: Authentication attempts — including the ones that failed.
      description: |
        **The surface that answers "why can't this guest get online?"** A guest who
        cannot get online has no session, so no list of sessions can answer it.

        Three sources are merged here and each is labelled, because they know
        different things and fail in different ways. `AuthAttempt.source` says which
        one an event came from and therefore how much to trust it.

        **This operation is bounded by what the data plane actually records, and the
        bounds are part of the contract rather than a caveat in a footnote.** See
        `macCoverage` below, and `AuthEventKind` for why a RADIUS reject can never
        carry a reason.

        ── the stream is a union of two stores, and the contract has to say so ───

        `radpostauth` carries the stock FreeRADIUS 3.2.x column set **verbatim** —
        `username`, `pass`, `reply`, `calledstationid`, `callingstationid`,
        `authdate`, `class` — and there is no column in it that could hold a source,
        a kind, a voucher id, an account id or `params`. On a portal deployment most
        attempts are `portal` or `driver` events, which a RADIUS table cannot hold.

        So: `source: radius` is read from FreeRADIUS's `radpostauth`, and `portal` and
        `driver` come from a **Foyer-owned event table**, unioned on read and returned
        in one time-ordered page. `radacct` and `radpostauth` stay read-only and
        unextended — that is the project's exit hatch, since the data must stay
        readable by stock FreeRADIUS if Foyer disappears, and it is why the other two
        streams cannot simply be written into it.

        **The enum is not the thing that is too wide.** Each of the three knows
        something the other two cannot, and removing two of them would delete the
        answers this screen exists to give: `radius` is the only one that sees an
        802.1X or MAC-auth attempt at all and can never say *why* a reject happened;
        `portal` is Foyer's own decision, so `voucher-exhausted` versus
        `voucher-expired` — the difference between *here is a new code* and *wait for
        tomorrow's batch* — is knowable only there; `driver` is the controller
        refusing after every check Foyer owns has passed, which is invisible from both
        of the others. This section says **where each one lives**, so that an
        implementer does not assume one table behind one operation and silently drop
        most of the stream.

        Two things follow that a client must not get wrong:

        - **`macCoverage` describes the `radius` half only.** It is defined as whether
          the generated `post-auth` query populates `CallingStationId`; Foyer's own
          events always carry the MAC the driver verified. A console rendering one
          coverage banner over a mixed list is telling the truth about part of it —
          see the note on `macCoverage` itself.
        - **`params` is what keeps `AuthEventKind` a kind rather than a sentence.**
          `radpostauth` has nowhere to put `{ retryAfterSeconds: 300 }`, and the
          moment a server composes that into English it is the mistake this document
          refuses everywhere else, in the worst possible place: a log read long
          afterwards by somebody who was not there.

        Read-only, permanently. `radpostauth` belongs to FreeRADIUS.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Query"
        - name: outcome
          in: query
          schema: { $ref: "#/components/schemas/AuthOutcome" }
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/AuthSource" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items, macCoverage, blindSpots]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuthAttempt" }
                      macCoverage: { $ref: "#/components/schemas/MacCoverage" }
                      blindSpots:
                        type: array
                        items: { $ref: "#/components/schemas/AuthBlindSpot" }
                        description: |
                          **Required, and required to be non-empty in any honest
                          implementation.** The ways of failing to get online that
                          leave no row here at all. An empty result set for a MAC
                          means *we have no record*, and a console that renders that
                          as *nothing went wrong* is the exact failure this document
                          exists to prevent — so the reasons travel with the result
                          rather than living in the client's copy, where a future
                          backend could not correct them.

  # ────────────────────────────────────────────────────── portal settings ──

  /sites/{siteId}/portal:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getPortalSettings
      x-permission: "portal:read"
      tags: [portal-settings]
      summary: What the guest portal shows, as an operator can change it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePortalSettings
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Change the venue name, languages, sign-in methods or terms.
      description: |
        Partial. An omitted field is unchanged; a field sent as `null` where the
        schema allows it is cleared.

        **Refuses an empty `methods` array.** A portal advertising no way to sign in
        is a portal no guest can use, and it fails silently — the welcome page
        renders, the guest reads it, and there is nothing to press. Same for an empty
        `languages`.

        **The server enforces the logo's ceiling**, `413` with
        `/problems/too-large`. `web/tools/check-budget.mjs` is the second gate and
        only sees the built portal; an operator uploading a logo through the console
        never runs it.

        **Terms are never translated here.** `terms.summary` is a per-language map
        the venue authors, and the resolution order in `PortalContext.terms` decides
        what a reader whose language is missing actually sees. There is deliberately
        no operation that generates one language from another: terms are legal text,
        and a machine translation of a legal text is a different legal text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalSettingsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          # `logoDataUri` over `x-max-decoded-bytes`. The same status and the same
          # problem type as `putPortalHeroImage`, because it is the same refusal
          # about the same kind of thing: one problem type answering two different
          # statuses depending on which operation raised it is a discriminator a
          # client has to special-case, which is the whole of what `ProblemType`
          # exists to avoid.
          description: The logo is larger than the budget it is spent from.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/portal/hero-image:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    put:
      operationId: putPortalHeroImage
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Upload the venue image the welcome page shows.
      description: |
        **A linked same-origin asset, not a data URI, and that is a measured
        decision.** A real photograph downscaled to 900 px — the macOS CNA's full
        window width — is 89,697 B at JPEG q70. Base64 inflates it by a third and
        gzip gives back exactly that much, so as a data URI it costs *more than the
        raw file* and lands at 1.75× the entire document budget. Inlined, the guest
        waits for the whole photograph before seeing a word; linked, the document
        renders at 4 kB and the image arrives after.

        `PortalContext.logoDataUri`'s reason for banning links — that an external
        resource must be in the walled garden on every driver — does not apply here:
        the portal's own FQDN is **already required** to be in the garden or the
        portal cannot serve itself (`docs/rules/security.md` §5). The rule is *no
        external origin*, not *no linked asset*.

        **The server enforces the ceiling.** `tools/check-budget.mjs` is the second
        gate and only sees the built tree; an operator uploading through this
        console never touches it.

        Base64 in JSON rather than multipart: the admin console is not
        byte-constrained, and it keeps the payload inside the schema the mock
        validates every response and request against.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroImageUpload" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeroImage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Larger than the per-image budget.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationProblem"
    delete:
      operationId: deletePortalHeroImage
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Remove the venue image.
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{siteId}/portal/phone:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getPhoneSignIn
      x-permission: "portal:read"
      tags: [portal-settings]
      summary: How this venue sends phone sign-in codes.
      description: |
        The provider, the sender and the ceilings. **The provider's credentials are
        never returned** — `credentialsSet` says whether there are any, and that is
        all a console needs to render.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePhoneSignIn
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Configure the SMS or Zalo provider phone sign-in sends codes through.
      description: |
        Replaces the configuration. `apiKey` and `secretKey` are **write-only**:
        omitted means unchanged, and they are required only the first time. They are
        envelope-encrypted at rest under the deployment's key-encryption key, like a
        controller credential, and are never logged or returned.

        `dailyLimit` is the venue's **SMS cost ceiling**: the number of messages this
        site may send per calendar day. There is no default and no way to turn it
        off. When it is reached phone sign-in stops sending and the guest is told to
        ask staff — the other methods keep working.

        Writes a `portal-settings-changed` audit entry. Changing the credentials is
        the security-relevant half of it, and the entry's params say whether they
        changed, never what they are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneSignInUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/portal/phone/abuse-controls:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getPhoneAbuseControls
      x-permission: "portal:read"
      tags: [portal-settings]
      summary: The limits and destination ranges phone sign-in enforces at this venue.
      description: |
        What `requestPhoneCode` and `verifyPhoneCode` enforce: the per-number,
        per-device and per-address limits, the code's lifetime and attempts, and
        which Vietnamese mobile ranges may receive a code. `customised: false` means
        no operator has changed them and the product defaults apply.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneAbuseControls" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePhoneAbuseControls
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Tune phone sign-in's abuse limits, within fixed bounds.
      description: |
        **Tunable within bounds, not switchable off.** These limits are the product's
        defence against SMS toll fraud (`docs/rules/security.md` §9), so every one
        has a ceiling in the schema and in the database, and none has a value of
        *unlimited*. The one most often raised is `perAddressPerHour`: a venue whose
        portal is reached through one NAT, or a cloud-hosted portal behind a proxy,
        presents every guest as one address, and sixty an hour (the default) is then
        sixty guests. The device — the MAC the controller placed on the network — is the
        per-guest key; the address limit is a bound on one host spraying numbers.

        `codeMinutes` stops at ten and `maxAttempts` at ten — NIST SP 800-63B §5.1.3's
        bound for an out-of-band code. `perNumberPerDay` below `perNumberPerHour` is
        refused `below-minimum`, because the smaller of the two would silently be the
        only one in force.

        `mobilePrefixes` narrows the destination allowlist; it cannot widen it past
        Vietnamese mobile ranges. Takes effect on the next code requested — nothing
        restarts. Writes a `portal-settings-changed` audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneAbuseControlsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneAbuseControls" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/portal/phone/test-message:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    post:
      operationId: sendPhoneTestMessage
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Send one message through the saved provider, to prove it delivers.
      description: |
        Sends the venue's `messageTemplate`, with a random six-digit code that is not
        stored and signs nobody in, to the number given, through the provider saved
        on `updatePhoneSignIn`. It is how an operator proves the brandname or Zalo
        template is registered **before** a guest finds out it is not.

        **It is a real message and it is counted.** It passes the same destination
        allowlist and is charged against the same daily ceilings as a guest's code,
        which fail closed exactly as they do for a guest. Every outcome is `200` with
        the outcome named, because *the provider refused it* is the answer the
        operator asked for, not a server error. `providerCode` is the provider's own
        result code on a refusal and nothing else — never its free text, never a key.

        Writes a `portal-settings-changed` audit entry naming the outcome and never
        the number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneTestMessageRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneTestMessageResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /phone-sign-in/spend-cap:
    get:
      operationId: getPhoneSpendCap
      x-permission: "portal:read"
      tags: [portal-settings]
      summary: The deployment-wide daily message cap, across every site.
      description: |
        §9's *hard global spend cap*: messages the whole deployment may send per
        calendar day, on top of each site's own `dailyLimit`. `dailyLimit: null`
        means no deployment-wide cap is set, and the per-site ceilings — each of
        which is mandatory — are the only bound.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSpendCap" }
    put:
      operationId: updatePhoneSpendCap
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Set or clear the deployment-wide daily message cap.
      description: |
        Counted in the same transaction as every code and test message, and failing
        closed the way the per-site ceiling does: a send that cannot be counted is
        not made. The day is the sending site's calendar day (`getSiteTimeZone`).
        Writes a `portal-settings-changed` audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneSpendCapUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSpendCap" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/guest-wifi-key:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getGuestWifiKey
      x-permission: "portal:read"
      tags: [portal-settings]
      summary: Whether the guest network's Wi-Fi password is set, never what it is.
      description: |
        The WPA passphrase of the SSID in `PortalSettings.networkName`, for the
        venue that runs its guest network behind a password as well as the portal.
        It exists for one reader, the voucher slip: its QR code joins an open
        network by default, and without this a slip for a password-protected one
        would print a code no phone could use.

        **Write-only.** This answers `set` and when; the value is never returned
        here. `getVoucherSlipWifi` is the one read that carries it, because
        printing it on a slip is the point.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestWifiKeyStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGuestWifiKey
      x-permission: "portal:manage"
      tags: [portal-settings]
      summary: Set, replace or clear the guest network's Wi-Fi password.
      description: |
        `passphrase: null` clears it, and slips go back to joining an open network.
        A passphrase is WPA's: 8 to 63 printable ASCII characters (IEEE 802.11
        Annex J). Anything else is `not-a-wifi-passphrase` on `passphrase` — a
        phone would refuse it at the network, so a slip carrying it would print a
        password that cannot work.

        Envelope-encrypted at rest under the deployment's key-encryption key, like
        a controller credential; never logged, never returned by this operation.
        Audited as `portal-settings-changed` with `params.fields: [guestWifiKey]`
        and `params.cleared`, never the value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestWifiKeyUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestWifiKeyStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /sites/{siteId}/voucher-slip-wifi:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getVoucherSlipWifi
      x-permission: "vouchers:manage"
      tags: [vouchers]
      summary: What a printed voucher slip needs to join the guest network.
      description: |
        **The one read that returns the guest Wi-Fi password, and it is here on
        purpose.** A slip is handed to every guest with the password on it, so the
        person who can print slips can read it: that is who `vouchers:manage` is.
        The settings read (`getGuestWifiKey`) stays write-only, so the screen that
        changes the password never holds it. `unifi-voucher-site`, the most widely
        deployed UniFi slip printer, takes the same position — its SSID password
        setting exists to be printed.

        `passphrase` is null for an open network, and the slip's QR joins it as
        one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoucherSlipWifi" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ─────────────────────────────────────────────────────────────── garden ──

  /sites/{siteId}/walled-garden:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
    get:
      operationId: getWalledGarden
      x-permission: "garden:read"
      tags: [garden]
      summary: What a guest may reach before authenticating.
      description: |
        Returns the entries **and** which of the site's devices can actually honour
        each one, because a site is not homogeneous: a garden that works on a UniFi
        access point does nothing at all on a driver reporting `GardenKind: none`,
        and the operator has to be told that beside the entry rather than after a
        support call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalledGarden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGardenEntry
      x-permission: "garden:manage"
      tags: [garden]
      summary: Allow one destination before authentication.
      description: |
        **Every entry is unauthenticated egress**, so the narrowest form that works
        is the only acceptable one. `docs/rules/security.md` §5 forbids allowing a
        destination by CDN IP range — modern CDNs host arbitrary customers, so
        "allow the payment provider" becomes "allow a general-purpose HTTPS tunnel".
        An `ip-range` entry is therefore accepted only where no device in the site
        can do FQDN/SNI, and the response says so.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenEntryCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenEntry" }
        "409":
          description: An entry with this value already exists in this site.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /sites/{siteId}/walled-garden/{entryId}:
    parameters:
      - $ref: "#/components/parameters/SiteIdPath"
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteGardenEntry
      x-permission: "garden:manage"
      tags: [garden]
      summary: Stop allowing one destination.
      description: |
        **Refused for an entry whose `origin` is `required`.** Those are the portal's
        own FQDN, its certificate chain's OCSP/CRL endpoints and the RFC 8908
        endpoint: remove one and the portal cannot serve itself, which presents to
        every guest as a network that is simply broken. The console does not render a
        delete control for them at all — this refusal is the second gate, for a client
        that tries anyway.
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This entry is required for the portal to function.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /overview:
    get:
      operationId: getOverview
      x-permission: "authenticated"
      tags: [overview]
      summary: Dashboard figures, each with its own freshness.
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /alarms:
    get:
      operationId: listAlarms
      x-permission: "authenticated"
      tags: [overview]
      summary: Things an operator must act on.
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }

  # ────────────────────────────────────────────────────────────── reports ──

  /exports/sessions:
    get:
      operationId: exportSessions
      x-permission: "reports:export"
      # The longest `[from, to)` this operation answers, read by both servers from
      # here. A quarter: the period a venue reconciles over, and a bound on one stream.
      x-max-range-days: 92
      tags: [reports]
      summary: Every session that started in a range, as CSV.
      description: |
        The rows `listSessions` would page through, **started in `[from, to)`**, in one
        streamed document ordered oldest first. The range is on `startedAt` because
        that is the one timestamp every accounting row has and the one daloRADIUS
        filters its own accounting reports on (`acctstarttime`): a session that began
        before `from` and is still open is in the export that contains its start.

        Read-only, like everything `radacct` backs. **A voucher code never leaves in
        full** (see `exportVouchers`), and for a voucher session the NAS put the code
        in `User-Name` — so `username` on a row whose `identityKind` is `voucher` is
        masked to its last four characters. Every accounting figure travels with the
        freshness of its sample (`freshnessState`, `freshnessSampledAt`,
        `freshnessIntervalSeconds`): a byte count in a spreadsheet is still a sample.
      x-csv-columns:
        - sessionId
        - acctSessionId
        - state
        - startedAt
        - endedAt
        - lastUpdateAt
        - sessionSeconds
        - identityKind
        - username
        - callingStationId
        - macIsRandomised
        - ipAddress
        - nasId
        - nasName
        - apName
        - ssid
        - inputOctets
        - outputOctets
        - inputOctetsTotal
        - outputOctetsTotal
        - countersWrapped
        - terminateCause
        - freshnessState
        - freshnessSampledAt
        - freshnessIntervalSeconds
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/ExportFrom"
        - $ref: "#/components/parameters/ExportTo"
      responses:
        "200": { $ref: "#/components/responses/ExportCsv" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /exports/vouchers:
    get:
      operationId: exportVouchers
      x-permission: "reports:export"
      # The longest `[from, to)` this operation answers, read by both servers from
      # here. A quarter: the period a venue reconciles over, and a bound on one stream.
      x-max-range-days: 92
      tags: [reports]
      summary: Every voucher created or first used in a range, as CSV.
      description: |
        A voucher is in the export when **either** its `createdAt` or its
        `firstUsedAt` falls in `[from, to)`: the question an operator reconciling a
        month asks is *what did we issue and what did we sell*, and a batch printed in
        August and redeemed in September answers the second one in September. Ordered
        by `createdAt`, oldest first.

        **The code is not exported; `codeHint` is its last four characters.** An
        unused code is a bearer credential and an in-use one still opens the network.
        A spreadsheet of them is a sheet of network access that outlives the console's
        session, travels by email and is never revoked. Four characters are what an
        operator needs to match a row to the slip in front of them; printing is the
        path that carries a code in full, and it already exists.
      x-csv-columns:
        - voucherId
        - batchId
        - codeHint
        - state
        - createdAt
        - firstUsedAt
        - expiresAt
        - revokedAt
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/ExportFrom"
        - $ref: "#/components/parameters/ExportTo"
      responses:
        "200": { $ref: "#/components/responses/ExportCsv" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /exports/guests:
    get:
      operationId: exportGuests
      x-permission: "reports:export"
      # The longest `[from, to)` this operation answers, read by both servers from
      # here. A quarter: the period a venue reconciles over, and a bound on one stream.
      x-max-range-days: 92
      tags: [reports]
      summary: Every portal authorization granted in a range, as CSV.
      description: |
        One row per **grant** — a device let on through the portal by a voucher, an
        account or the terms alone — with `grantedAt` in `[from, to)`, oldest first.
        A grant is the only record a guest on the controller-API path leaves at all:
        UniFi's hotspot authorization carries no RADIUS accounting, so a venue whose
        guests arrive that way has no sessions to export.

        **A row is a device, not a person.** `clientMac` is the address the NAS
        reported, and iOS 14+ / Android 10+ present a private one per SSID by default
        (`macIsRandomised`); `docs/rules/security.md` §6 is why the column says so
        rather than calling it an identity. `voucherId` is the voucher's id and never
        its code, for the reason `exportVouchers` gives.

        **Marketing consent is not in this document and must not be added to it.** A
        consent record is a different export with a different lawful basis; one file
        carrying both is how a list of devices becomes a mailing list nobody agreed
        to. It gets its own operation beside this one.
      x-csv-columns:
        - grantId
        - grantedAt
        - method
        - clientMac
        - macIsRandomised
        - accountUsername
        - voucherId
        - expiresAt
        - revokedAt
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/ExportFrom"
        - $ref: "#/components/parameters/ExportTo"
      responses:
        "200": { $ref: "#/components/responses/ExportCsv" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /exports/marketing-consents:
    get:
      operationId: exportMarketingConsents
      x-permission: "reports:export"
      # The longest `[from, to)` this operation answers, read by both servers from
      # here. A quarter, like the three above.
      x-max-range-days: 92
      tags: [reports, guest-data]
      summary: Every marketing consent given or withdrawn in a range, as CSV.
      description: |
        The venue's mailing list, and **only** the guests who ticked the box: a guest
        who did not is in no row of this document, because there is no record of
        them to export. A consent is in the export when it was **given or
        withdrawn** in `[from, to)`, ordered by when it was given, oldest first — so
        last month's export, loaded into a mailing tool, is followed by this month's
        carrying the withdrawals the tool has to honour.

        **A withdrawn row carries no contact details.** Withdrawal clears the name,
        phone number and e-mail address from the record and keeps when, which text
        and by whom; the row is how a mailing tool learns to stop, and
        `consentId` is what it matches on. This is a separate document from
        `exportGuests` on purpose — see there.
      x-csv-columns:
        - consentId
        - consentedAt
        - state
        - withdrawnAt
        - withdrawnBy
        - name
        - phone
        - email
        - lang
        - consentVersion
        - clientMac
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/ExportFrom"
        - $ref: "#/components/parameters/ExportTo"
      responses:
        "200": { $ref: "#/components/responses/ExportCsv" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /trends:
    get:
      operationId: getTrends
      x-permission: "authenticated"
      # Per granularity: 92 daily buckets or 53 weekly ones. Read by both servers.
      x-max-range-days: { day: 92, week: 371 }
      tags: [reports]
      summary: Guests, vouchers redeemed and bytes, per day or per week.
      description: |
        Aggregates over rows that already exist — `radacct`, portal grants and
        vouchers — and nothing that was not recorded. It names nobody, so it is
        `authenticated` for the reason `getOverview` is.

        **Buckets are the site's local days** (`getSiteTimeZone`), the same day
        `vouchersRedeemedToday` counts, and a week starts on Monday (ISO 8601). `from` is floored and `to` is
        ceiled to a bucket boundary, so the answer always covers whole buckets and
        says which in each `start` and `end`. At most 92 daily or 53 weekly buckets.

        **This is not a bandwidth graph, and a client must not draw it as one.** A
        bucket is a day and the interim interval is five minutes at best, so the
        figure is a total rather than a picture of an interval — but the total of a
        bucket holding an open session is still a sample, and it travels with its
        `bytesFreshness` like every other accounting figure. Draw bars, not a line: a
        line claims continuity between two totals that nothing measured.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/ExportFrom"
        - $ref: "#/components/parameters/ExportTo"
        - name: granularity
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TrendGranularity" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trends" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-foyer_admin_session
      description: |
        The admin console's session. **`httpOnly`, `SameSite`, `secure`**
        (`docs/rules/security.md` §9), on a listener separate from the guest
        portal's (§7) — a portal reachable pre-authentication by anyone within radio
        range must not share an origin, or a cookie, with the console that configures
        RADIUS.

        **The `__Host-` prefix is part of the name**, and it is the
        one attribute of this cookie a server cannot get wrong quietly: a user agent
        refuses a cookie so named unless it is `Secure`, has `Path=/` and carries
        **no `Domain`**. That is the separate-listener boundary above, asserted by
        the browser instead of by a deployment note — a sibling host cannot set a
        cookie the console will read, whatever the deployment did with DNS.

        **`web/mock` sets the unprefixed name over plain HTTP, and only there.** It
        is the same, single deviation it already declares for `secure`, and it has to
        be, because `__Host-` *means* `Secure`: a dev server on `http://localhost`
        that sent this name would have its cookie discarded and could not hold a
        session at all. The two follow from one condition in one place, so the mock
        cannot end up sending a prefixed name it has stripped the `Secure` attribute
        off. The Go server sets the prefixed name unconditionally.

        Every operation this scheme applies to can answer **`401` with
        `/problems/not-signed-in`** when there is no session, and **`403` with
        `/problems/forbidden`** when there is one whose role may not do this. Both are
        described here rather than repeated on each operation, because they are
        properties of the scheme: a copy on every operation is many copies of one
        rule, and the copies are what drift.

        A client's handling of `401` is to **route**, not to render an error. See
        `getAuthSession`.
    csrfToken:
      type: apiKey
      in: header
      name: X-Foyer-CSRF
      description: |
        The token from `AuthSession.csrfToken`, echoed on **every state-changing
        request** — `POST`, `PUT`, `PATCH`, `DELETE` — to any operation this document
        declares outside the `portal` tag, **and on every download**: a `GET` whose
        `200` is `text/csv` (the exports). An export writes a `data-exported` audit
        entry and hands personal data out, and a `SameSite=Lax` cookie still rides a
        cross-site top-level `GET`, so a link on any page could make a signed-in
        administrator download one — and be recorded as having done it. A request
        the browser marks `Sec-Fetch-Site: cross-site` or `same-site` is refused
        wherever the token is required, whatever it carries (the guest portal is the
        same site as the console). Both are `403` with `params.required: csrf`.

        Stated as a rule rather than annotated per operation, deliberately. The
        requirement cannot vary by operation: it follows from the method, the media
        type of the answer and whether the operation is guest-facing, all of which
        are already in this document. Every copy of an invariant rule is one more
        place for it to disagree with itself, and `web/mock` asserts the rule covers what it claims
        rather than trusting a list.

        `SameSite` on the session cookie is the first defence and this is the second.
        Neither is sufficient alone: `SameSite=Lax` still permits a top-level `POST`
        navigation in some browsers, and a token that is never checked is a header.

        The guest portal is not in scope here. Its authenticating operations are form
        navigations answered `303` for the Captive Network Assistant, a client that
        cannot be given a token to echo — its defence is `VerifyPresence` and a
        MAC-bound grant (`docs/rules/security.md` §4), not a header.

  parameters:
    SiteId:
      name: siteId
      in: query
      required: true
      schema: { type: string }
      description: Every admin screen is scoped to one site.
    NasId:
      name: nasId
      in: path
      required: true
      schema: { type: string }
    SiteIdPath:
      name: siteId
      in: path
      required: true
      schema: { type: string }
    Query:
      name: q
      in: query
      schema: { type: string }
      description: Free-text match across every identifying field at once. No scope selector.
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    ExportFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: |
        Inclusive lower bound. An export or a trend is **always bounded**: a
        request with no range is refused rather than answered with everything, and
        a range longer than the operation allows is refused `range-too-long` with
        the figure in `fieldParams.to.maxDays`.
    ExportTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: Exclusive upper bound. Must be after `from` (`range-inverted`).

  responses:
    PortalRedirect:
      description: |
        Always a redirect, never a rendered body. `Location` points at the connected
        page on success and back at the form on failure, carrying a machine-readable
        reason the server re-renders into human copy.

        **There is no `content` here and that is the whole of the response's body:
        none.** A `303` a Captive Network Assistant might render is a `303` that has
        stopped being a navigation. What a server's HTTP stack puts in `Content-Type`
        beside an empty body therefore describes nothing and a client must not read
        it — measured: `@hono/node-server` defaults every bodyless answer
        it serves to `text/plain; charset=UTF-8`, so `web/mock` sends one and the Go
        binary sends none. That difference is in the adapter, not in either handler,
        and it is not this response's to settle.
      headers:
        Location:
          description: |
            **A root-relative path — a leading `/`, then something that is not `/`
            or `\`.** The `pattern` is the normative statement; this paragraph says
            why it is worth one.

            A captive portal is reached over plain HTTP, on an SSID the guest has
            no route off yet, at whatever address the NAS redirected them to. An
            absolute `Location` therefore does not *carry* a scheme and a host — it
            **picks** them, on the one screen where the guest has just typed a
            credential, and any deployment where the server's idea of its own origin
            is not the browser's idea sends them somewhere outside the walled garden
            with no diagnosis. Root-relative inherits both from the request, which is
            the only way to be right in every topology: behind a TLS terminator, on a
            LAN address, through a dev proxy, or served directly.

            The pattern refuses more than an absolute URL: `//host` is
            protocol-relative and picks a host too, `/\host` is the same thing in the
            spelling several browsers accept, and anchoring both ends means a value
            carrying a line terminator cannot match at all — a `Location` is a header,
            and the portal's is built from client-supplied language and reason values
            (`docs/rules/security.md` §4).
          required: true
          schema:
            type: string
            pattern: '^/([^/\\].*)?$'
        Cache-Control:
          required: true
          schema: { type: string, const: "no-store" }
    NotSignedIn:
      description: |
        No session, or one that has expired. **A normal answer rather than an error**
        — the state every console starts in. The client routes to sign-in; nothing
        logs it as a fault.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: The request was well-formed but a field was not acceptable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: |
        **The body was larger than this listener reads, and it was not read.**
        `/problems/too-large` on the field `body`, with `bytes` and `limitBytes`
        in `params.fieldParams.body` as `x-fault-params` requires. `bytes` is the
        declared `Content-Length` when there was one and `limitBytes + 1` when the
        body was streamed, because a server that stopped reading does not know how
        much more there was.

        The ceiling is per listener: 16 KiB on the guest portal, which is reachable
        by every device in radio range before any of them has authenticated, and
        1 MiB on the console. One operation has its own, `putPortalHeroImage`,
        derived from `HeroImageUpload.dataBase64`'s `x-max-decoded-bytes` as the
        base64 length of the largest accepted photograph plus 64 KiB of envelope,
        so that the contract's figure is the only one. Without a ceiling the request
        validator would read the whole body into memory before looking at it.

        **The console's figures are for a signed-in operator.** A request with no
        session, and every request to a public operation (`signIn`), is held to the
        portal's 16 KiB on every operation. A body is decoded before the caller is
        looked at, and the decoded form of a body of small values is tens of times
        its size, so a megabyte an anonymous caller could send was not a bound on
        memory.

        Declared where a client has a branch for it (`signIn`) and answered wherever
        a body is sent. The guest portal's form operations are `303` by rule and a
        guest's browser never sends 16 KiB, so a `413` there answers a hand-made
        request, the same standing as `acceptTerms`'s `404`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SignInRateLimited:
      description: |
        **Too many sign-in attempts, from this address or against this account.**
        `/problems/rate-limited`, with `params.retryAfterSeconds` and the same
        figure in `Retry-After`, so the console can say when rather than just no.

        Two independent token buckets, per client address and per username, and an
        attempt has to fit in both. That is the shape authentik's reputation policy
        has, and not Keycloak's per-user-only lockout, whose documented gap is that
        one address can walk a username list. A bucket rather than a lockout: it
        refills, so holding somebody's account shut costs an attacker a steady
        stream of requests, and the owner's next attempt after the interval works.

        **On the console, the per-username bucket is split by device** (OWASP,
        *Slow Down Online Guessing Attacks with Device Cookies*). A successful
        `signIn` sets a signed `__Host-foyer_device` cookie naming the username; a
        later attempt for that username carrying it spends from that device's own
        bucket, and every other attempt spends from the username's shared one. So a
        stranger who empties the shared bucket — which anyone who can reach the
        console can do — refuses strangers, not the owner at the browser they used
        before. A success clears only the bucket it spent. The portal keeps one
        bucket per username: a captive-portal mini-browser's cookie jar does not
        survive the sheet closing, so a device cookie there would never be sent.

        **Checked before the password is**, which is the point: every attempt is a
        64 MiB argon2id computation, and the refusal is what keeps a flood from
        spending the appliance's memory. The answer is the same whether or not the
        username exists, so it is not an account oracle.
      headers:
        Retry-After:
          required: true
          description: Whole seconds, rounded up. Never zero.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ExportCsv:
      description: |
        **RFC 4180 CSV, UTF-8 with a byte-order mark, CRLF line endings, streamed.**
        The first record is the header, and it is exactly the operation's
        `x-csv-columns` in that order — both servers read the list from this document
        rather than keeping their own, so a column cannot be added on one side.

        The byte-order mark is there because Excel reads a CSV without one in the
        system code page, and Vietnamese venue names and guest names such as
        *Cà Phê Sữa* open as mojibake without it.

        **Every field is double-quoted**, header and empty cells included, with an
        embedded `"` doubled. A spreadsheet whose list separator is `;` therefore
        cannot split a value such as `a;=cmd|…` into a second cell that begins with a
        formula.

        **Formula injection is neutralised in every cell** (OWASP, *CSV Injection*).
        A cell whose first significant character is `=`, `+`, `-`, `@`, a tab, a
        carriage return, a line feed, one of the full-width `＝ ＋ － ＠`, one of the
        small-form `﹦ ﹢ ﹣ ﹫` or the minus sign `−` is prefixed with a single quote,
        so a spreadsheet shows it as text instead of evaluating it. "Significant"
        skips leading Unicode spaces (NBSP included) and format characters (a
        byte-order mark, a zero-width space), which spreadsheets look past too. Most of
        these columns are values a stranger chose — a username, a MAC a NAS relayed,
        an SSID — and the spreadsheet is opened by the person with the most access.
        **The one exception is a cell that is wholly a decimal number**, such as a
        negative `sessionSeconds` from a skewed NAS clock: `-12` cannot be a formula,
        and quoting it would turn the one anomaly worth sorting on into text.

        An empty cell is an absent value (`null`), never zero. Timestamps are RFC 3339
        in UTC with second precision; booleans are `true` / `false`.

        **A document that stops early is not a shorter export.** If the server fails
        after the first byte it aborts the connection rather than ending the body, so
        a client sees a failed download and never a complete-looking file with rows
        missing.
      headers:
        Content-Disposition:
          required: true
          description: |
            `attachment; filename="foyer-<dataset>-<siteId>-<from>-<to>.csv"`, dates
            as `YYYYMMDD` in UTC. The name is built from the site id and two dates
            only, never from free text.
          schema: { type: string }
        Cache-Control:
          required: true
          schema: { type: string, const: "no-store" }
      content:
        text/csv:
          schema: { type: string }

  schemas:
    Language:
      type: string
      enum: [vi, en]
      default: en

    ProblemType:
      type: string
      format: uri-reference
      description: |
        **The failure, not a sentence about it.** The client renders the copy from
        its own catalogue; the server sends the type and its params.

        This is `AlarmKind`'s decision applied to refusals, using the mechanism
        RFC 9457 already provides rather than inventing a parallel field. It is an
        enum rather than an open string because a client catalogue keyed on an open
        string is a `Record<string, Copy>`, which **proves nothing**: a missing entry
        is a runtime hole. Keyed on this enum it is a `Record<ProblemType, Copy>` and a
        missing entry is a compile error, exactly as it is for `AlarmKind`.

        `uri-reference`, not `uri`, and the difference is load-bearing rather than
        pedantic: these are **identifiers, not addresses**. RFC 9457 permits a
        relative reference and nothing dereferences them, so `/problems/validation`
        is the honest spelling — `format: uri` rejects it, and every refusal the
        validating mock sends would then fail validation and answer 500.

        ── what may and may not be added here ────────────────────────────────

        **Every value must be reachable by driving the server.** A value nothing can
        produce is a catalogue entry that can never be shown to be right — a check
        that only looks like one. `web/mock` drives one request per value and computes the expected set from
        this enum, so adding a value here fails the mock suite until something can
        emit it.

        **`/problems/validation` is deliberately not split**, even though it is the
        most frequent of them. The discrimination it needs is per *field*, not per
        request: the same request refuses `venueName` for being blank and `value` for
        not being a hostname. So the page-level entry stays generic and the
        field-level catalogue is keyed on `(type, field)` — see `FieldFault`, which
        is the third part of that key where one field has more than one way to fail.

        **`PrintSetTooLarge` is deliberately absent, and this is where that is
        recorded** so it is not rediscovered as an omission. The admin console's
        batch-print loop has a bound of 100 pages of 200 vouchers; hitting it throws
        a client-only `Error` subclass (`admin/src/screens/Vouchers.tsx`). It is not
        in this enum for two reasons, and the second is the decisive one:

          - **No server participates in it.** Every one of those 100 requests
            answered `200`. There is nothing for a server to send, so nothing here
            would describe a wire value.
          - **It could never be proven.** The condition needs 20 000 unused vouchers
            in one batch and the create dialog caps a batch at 2 000, so no drive
            against the mock can reach it — the one property every other value in
            this enum has. A value that cannot be driven is the vacuous catalogue
            entry this enum exists to prevent.

          The client owns that sentence already and no contract is needed for it. If
          the contract ever gains a *print the whole batch* operation, its refusal
          would be server-sent and would earn a value here on that day.
      enum:
        # ── sent by a server ────────────────────────────────────────────────
        - /problems/validation
        - /problems/not-found
        - /problems/duplicate
        # One venue per install. Distinct from
        # `duplicate` on purpose: nothing collided. The deployment is refusing a
        # second venue because FreeRADIUS's client namespace is flat and two venues
        # sharing a private-range NAS address could never both be projected, so the
        # sentence a client renders is about installing again rather than about
        # choosing another name.
        - /problems/one-site-per-install
        - /problems/too-large
        - /problems/garden-entry-required
        - /problems/controller-in-use
        - /problems/controller-unreachable
        - /problems/needs-controller
        - /problems/rotation-refused
        - /problems/device-not-verified
        - /problems/method-not-offered
        - /problems/no-grant
        - /problems/internal
        - /problems/session-end-failed
        - /problems/session-not-live
        - /problems/disconnect-unsupported
        # ── the console's own authentication ────────────────────────────────
        # `not-signed-in` is a *normal* answer and the client's response to it is to
        # route, not to render a refusal — it is in this enum so that routing is keyed
        # on the same discriminator as everything else, rather than on a bare 401 that
        # a client has to special-case outside the catalogue.
        - /problems/not-signed-in
        # Never says whether it was the username or the password, and a disabled
        # operator gets this one too — see `signIn`.
        - /problems/bad-credentials
        # Too many attempts from this address or against this account; carries
        # `retryAfterSeconds`. Never says which of the two, and is answered before
        # the password is looked at. See `SignInRateLimited`.
        - /problems/rate-limited
        # A session whose role may not do this. Distinct from `not-signed-in` because
        # the client's answer is different: signing in again does not help.
        - /problems/forbidden
        # Refusing to leave the deployment with nobody who can administer it. There is
        # no password-reset channel, so this state has no recovery short of a shell on
        # the host (`foyerctl create-operator`, or `foyerctl open-setup`).
        - /problems/last-administrator
        # The operator is signed in on a temporary password somebody else set
        # (`foyerctl create-operator --must-change-password`). Every operation but
        # changing it is refused until it is changed. Distinct from `forbidden`,
        # which signing in again does not help: this one has exactly one action that
        # clears it, and the client's answer is to route to the change-password
        # screen rather than to render a refusal.
        - /problems/password-change-required
        # `completeAdminSetup` when there is no setup open: it was completed, or the
        # installer never opened one. With an administrator the client's answer is the
        # sign-in form; with none, `getAdminSetup` says so and it names the dead end.
        - /problems/setup-complete
        # ── synthesised by the client ───────────────────────────────────────
        - /problems/unreachable
      x-client-synthesised:
        # The exemption from "every value must be reachable by driving the server",
        # written where the rule is rather than in the test that enforces it.
        #
        # `/problems/unreachable` is what a client puts on screen when the request
        # never arrived — DNS failed, the radio dropped, `fetch` rejected. There is
        # no response, so no server can send it, and a sweep that demanded one would
        # be demanding the impossible. Listing it here rather than in the test is the
        # point: the mock computes its expected set as `enum − x-client-synthesised`,
        # so exempting a *new* value is a visible edit to this document and not a
        # line quietly added to a test file. Anything here that the server does send
        # fails the same sweep, so the list cannot become a place to hide a value.
        - /problems/unreachable

    FieldFault:
      type: string
      description: |
        **Why one field was refused** — the third part of the `(type, field)` key,
        and it exists because that pair is not unique.

        Measured, not assumed: `/problems/validation` refuses `value` on the walled
        garden three different ways (blank, not a hostname, not a CIDR range) and
        `username` on an account two (blank, taken). A catalogue keyed on
        `(type, field)` alone would silently render one of those sentences for all
        three, which is the same class of wrong answer as rendering the server's
        Vietnamese: confidently phrased and about a different failure.

        Carried in `Problem.params.fields`, keyed by exactly the same field names as
        `errors`. `errors` keeps the *prose*, which stays the fallback for a pair
        this client does not know; this carries the *kind*, which is what a client
        with copy renders from.

        **The two key sets are the same set.** A fault with no `errors` entry is a
        field the client cannot mark; an `errors` entry with no fault is a field the
        client can only describe in the server's language. `web/mock` is asserted on
        the equality rather than on either half, because either half alone passes for
        a server that has drifted.
      enum:
        - required
        - duplicate
        - too-large
        - below-minimum
        - not-a-data-uri
        - not-a-hostname
        - not-a-cidr
        # `ipAddress` on `createNas`: neither an address nor a range. Not `not-a-cidr`
        # — that one refuses a walled-garden field that must be a *range*, and its copy
        # ("Enter a range, for example 192.0.2.0/24") would tell an operator who typed
        # `10.20.0.two` that a single address is unacceptable, which is the opposite of
        # true. The same argument `not-an-origin` makes against `not-a-hostname`.
        - not-an-ip-address
        # `baseUrl` on a controller: a URL that carries a path, a query or credentials
        # where only a scheme and a host may go. Not `not-a-hostname` — that one is
        # the walled garden refusing a *hostname* field something that is not one,
        # and a client whose copy for it says "enter a hostname, for example
        # payments.example.com" would be answering a different question here.
        - not-an-origin
        - unsupported-image-format
        - needs-controller
        - required-with-click-through
        - needs-phone-provider
        - missing-code-placeholder
        - not-a-link
        - link-before-sign-in
        - ends-before-start
        # `currentPassword` on `changeOwnPassword`. Not `/problems/bad-credentials`:
        # that one refuses to say *which* of two things was wrong because it answers an
        # unauthenticated stranger, and this one is talking to somebody already signed
        # in about the field they just typed. Different question, different copy.
        - incorrect
        # `newPassword` equal to `currentPassword`. A refusal rather than a no-op,
        # because a change that silently changed nothing reads as success.
        - unchanged
        # `subject.mac` on `eraseDataSubject`: not twelve hex digits in a spelling a
        # NAS sends. Not `not-an-ip-address` or `not-a-hostname` — a different question.
        - not-a-mac-address
        # `subject.phone` on `eraseDataSubject`: not eight to fifteen digits (E.164's
        # ceiling) with an optional leading `+` and spaces, dots, dashes or brackets.
        - not-a-phone-number
        # `subject.email` on `eraseDataSubject`: not one `@` with something on each
        # side, a dot in the domain and no whitespace, or longer than 254 characters.
        - not-an-email-address
        # A retention period longer than its category allows. The mirror of
        # `below-minimum`, and it carries its figure the same way.
        - above-maximum
        # `to` on an export or a trend: not after `from`. An empty range is refused
        # rather than answered with a header and no rows, which reads as "nothing
        # happened" about a question nobody asked.
        - range-inverted
        # `to` on an export or a trend: the range is longer than the operation
        # allows. The figure is `maxDays`, because the sentence has a number in it.
        - range-too-long
        # `fields` on `updateGuestDataSettings`: marketing consent asked for while
        # neither a phone number nor an e-mail address is collected.
        - needs-contact-field
        # A URL setting on the `network` tag that is not an absolute http:// or
        # https:// address, or carries credentials. Not `not-an-origin` — a portal
        # address has a path — and not `not-a-link`, which also takes `tel:`.
        - not-a-web-address
        # A certificate, key or portal address `putPortalCertificate` (or
        # `updateNetworkSettings`) refused. One fault with the reason as a figure,
        # because the seven reasons are one question — "can this be served?" — and
        # the screen that uploads it carries the sentence for each.
        - certificate-refused
        # `timeZone` on `updateSiteTimeZone`: a name the server's zone database
        # does not know.
        - not-a-time-zone
        # `passphrase` on `updateGuestWifiKey`: not 8–63 printable ASCII characters,
        # which is every WPA passphrase there is. One fault for length and alphabet,
        # because the sentence that fixes either is the same sentence.
        - not-a-wifi-passphrase
      x-fault-params:
        # ── the faults whose sentence contains a figure ──────────────────────
        #
        # The client owns the sentence and the server supplies the facts in it. For
        # most faults there are no facts — *Required.* and *Already taken.* are whole
        # sentences on their own — but two of them are a sentence **with a number in
        # it**, and a number is precisely the thing a client cannot know.
        #
        # Without the figure, a refused five-character password renders *"At least
        # 0."*: `below-minimum` is in the enum and its copy reads `minimumCount`, so a
        # refusal with nowhere to put the number compiles, mounts an alert with text,
        # and says something wrong. A client constant such as `PASSWORD_MIN_LENGTH`
        # is right for one field and leaves the hole open for every other.
        #
        # So this is the declaration that a fault **needs** a figure, and
        # `Problem.params.fieldParams` is where the figure goes. It is machine-read
        # rather than prose: `web/mock` computes its expected set from this map and
        # asserts that every drive emitting one of these faults carries every key
        # named here, so adding a fault with params and no emission fails the suite.
        # `FAULT_PARAMS` in `contract/src/index.ts` mirrors it as a type, and a test
        # holds the two together.
        #
        # A fault absent from this map takes no params, and that is a claim as much as
        # a silence: it says the client's whole sentence is knowable without the
        # server. Everything currently absent has been read against
        # `admin/src/i18n/` one at a time — the refusal copy is in `core.ts`.
        below-minimum: [minimumCount]
        above-maximum: [maximumCount]
        too-large: [bytes, limitBytes]
        range-too-long: [maxDays]
        certificate-refused: [reason]

    Problem:
      type: object
      description: |
        RFC 9457.

        **`type` is the discriminator, and a client with copy for it must prefer its
        own.** The server cannot know the reader's language when it refuses a
        request, so `title` and `detail` are the *server's* wording and a fallback
        for a `type` the client does not recognise. Composing them in the server's
        language and rendering them verbatim would show Vietnamese to an
        English-speaking operator.

        **`params` is what makes that possible rather than merely required.** Without
        it a refusal that needs a number — *nine access points came from this
        controller*, *this is 140 kB against a 100 kB limit* — has nowhere to put the
        number except `detail`, which is the field the client must not render. So the
        client would reach for `detail` on precisely the refusals an operator most
        needs to understand, and the fallback would quietly become the real path.
        `Alarm.params` exists for the same reason and settled the same argument.

        **`title` stays required, and `detail` does not survive a server that knows
        its client.** They are not the same kind of thing: `title` is a short label
        and the only thing a console meeting a `type` it predates can render, so it
        is the fallback of last resort; `detail` is a composed sentence and is
        therefore where the drift and the wrong language live. A conforming server
        sends `detail` only for a `type` it expects clients not to know. `web/mock`
        is asserted to send none at all, with one named exception that is not a
        product answer — see the guard in `web/mock/src/server.test.ts`.
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        title:
          type: string
          description: |
            A short label, in the server's language. **Fallback only**, for a `type`
            the client does not recognise — never preferred over the catalogue.
        status: { type: integer }
        detail:
          type: string
          description: |
            A human sentence, in the server's language. **Fallback only**, and the
            one a conforming server omits once its clients implement the `type`: a
            server that always sends text is a server whose clients never implement
            the kind. Never a stack trace, an internal path, or a database error.
        params:
          type: object
          additionalProperties: true
          description: |
            Structured values the client interpolates into its own copy — the count,
            the byte figure, the name of the thing. Never a sentence.
          properties:
            fields:
              type: object
              additionalProperties: { $ref: "#/components/schemas/FieldFault" }
              description: |
                For `/problems/validation` and `/problems/too-large`: the same keys as
                `errors`, carrying why each field was refused rather than a sentence
                about it.
            fieldParams:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
              description: |
                **The facts in one field's sentence**, keyed by the same field names as
                `fields` — `{ newPassword: { minimumCount: 12 } }`.

                `params` next to it is the *page's* facts, and the difference is not
                pedantry. A refusal marks more than one field at a time — the mock
                refuses `username` for being taken and `password` for being too short
                in one response — so a figure belonging to one field has no unambiguous
                home at the top level. Two fields refused `too-large` against different
                limits would collide there silently, and the collision would look
                exactly like a correct answer.

                Which faults need an entry is declared by `x-fault-params` on
                `FieldFault`, not left to a client to discover by rendering *"At least
                0."* A fault that takes no params has no entry here; a fault that takes
                params and arrives without them is a server bug, and `web/mock` fails
                on it.

                **Subset, not equal.** `fields` and `errors` must have identical key
                sets — that pair is asserted — but this one carries a key only for the
                fields whose fault names params. A client reads it as
                `fieldParams[field] ?? {}`, merged over `params`, so a server that has
                not been updated degrades to today's behaviour rather than to a
                crash.
        errors:
          type: object
          additionalProperties: { type: string }
          description: |
            Field name to human message. **The keys are the load-bearing half** — they
            are what tells a client which inputs to mark — and they stay. The values
            are prose and follow the same fallback rule as `detail`, for a
            `(type, field, fault)` triple the client has no copy for.

    Failure:
      type: object
      description: |
        A failure reported **inside a successful response**, rather than as one.

        `revokeVoucher` is the case that forced it: revoking a voucher succeeds, and
        ending the session it was being used for is a separate driver call that can
        fail on its own. The operation did what it was asked; something it attempted
        afterwards did not. That is a `200` carrying a failure, not a `4xx`.

        Two shapes were possible and this is the narrower one. Embedding a whole
        `Problem` would have meant inventing a `status` for a thing that has no
        status — writing `200` into a problem document is false, and writing `502` in
        the body of a `200` is worse. So this is `Problem`'s discriminating core with
        the HTTP-shaped members removed, keyed on **the same `ProblemType` enum**, so
        there is one catalogue and one keyspace rather than two that drift.
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        params:
          type: object
          additionalProperties: true
          description: Structured values the client interpolates into its own copy.
        detail:
          type: string
          description: |
            Fallback only, for a `type` the client does not recognise. Same rule as
            `Problem.detail`, and `web/mock` is asserted not to send it.

    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, "null"]
          description: |
            Null when there is no further page. There is deliberately no total —
            see `listSessions`.

    ChangeClass:
      type: string
      enum: [none, sql-only, restart]
      description: |
        What applying this change actually does to the running server. `sql-only` is
        a plain database write with no config churn. `restart` drops every in-flight
        EAP conversation and the in-memory TLS session cache. The operator is shown
        which one they are about to trigger, before they trigger it.

    # ── network: transport and RADIUS-plane settings ───────────────────────

    NetworkSettingSource:
      type: string
      enum: [console, environment, derived, unset]
      description: |
        Where the value in use came from. `console` was saved by an operator and
        wins over everything; `environment` is the deployment's bootstrap value;
        `derived` was worked out from the listener's own address; `unset` is no value
        at all, which only an optional setting may be.

    NetworkUrlSetting:
      type: object
      required: [value, source]
      properties:
        value: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/NetworkSettingSource" }

    SignInThrottle:
      type: object
      description: |
        A token bucket: `burst` attempts back to back, then one more every
        `intervalMs`. Two buckets per surface, per address and per account, and an
        attempt must fit in both (`internal/ratelimit`).
      required: [burst, intervalMs]
      properties:
        burst: { type: integer }
        intervalMs: { type: integer }

    SignInThrottles:
      type: object
      description: |
        The four sign-in buckets. A venue that NATs its guest network puts every guest
        behind one address, so `portalAddress` is the one such a venue raises; the
        per-account bucket is the one that bounds guessing. **`portalAccount` is
        counted per account and per source address**, so a stranger guessing at a
        guest's account from one address cannot lock that guest out from another; a
        guest network NATed behind one address shares one bucket per account.
      required: [consoleAddress, consoleAccount, portalAddress, portalAccount]
      properties:
        consoleAddress: { $ref: "#/components/schemas/SignInThrottle" }
        consoleAccount: { $ref: "#/components/schemas/SignInThrottle" }
        portalAddress: { $ref: "#/components/schemas/SignInThrottle" }
        portalAccount: { $ref: "#/components/schemas/SignInThrottle" }

    BodyCeilings:
      type: object
      description: |
        The most this process reads of one request, per surface, in bytes.
        `anonymousBytes` is what a console caller with no session may send, and every
        public operation. `putPortalHeroImage` keeps its own ceiling, derived from the
        contract, and is not one of these.

        **The maxima are the server's memory, not a constant**: a body
        costs many times its length to decode, so `NetworkSettingBounds` offers at
        most what the control plane's memory plan can decode — 7 MiB for the console
        in the shipped container — and a value saved on a larger one is held to it.
        A body is weighed by its shape once read: one that could not be decoded
        within the server's budget is refused `413` even under its ceiling.
      required: [portalBytes, consoleBytes, anonymousBytes, headerBytes]
      properties:
        portalBytes: { type: integer }
        consoleBytes: { type: integer }
        anonymousBytes: { type: integer }
        headerBytes: { type: integer }

    NetworkBound:
      type: object
      required: [minimum, maximum, default]
      properties:
        minimum: { type: integer }
        maximum: { type: integer }
        default: { type: integer }

    NetworkSettingBounds:
      type: object
      description: |
        Every numeric setting's bound and default, sent so no client has to compile
        them in. The minimums are what keeps a sign-in form from being opened to
        unlimited guessing; the maximums are what keeps one request from being a way
        to spend the appliance's memory.
      required: [throttleBurst, throttleIntervalMs, portalBytes, consoleBytes, anonymousBytes, headerBytes]
      properties:
        throttleBurst: { $ref: "#/components/schemas/NetworkBound" }
        throttleIntervalMs: { $ref: "#/components/schemas/NetworkBound" }
        portalBytes: { $ref: "#/components/schemas/NetworkBound" }
        consoleBytes: { $ref: "#/components/schemas/NetworkBound" }
        anonymousBytes: { $ref: "#/components/schemas/NetworkBound" }
        headerBytes: { $ref: "#/components/schemas/NetworkBound" }

    NetworkSettingDefaults:
      type: object
      description: |
        What every throttle and ceiling ships as, member by member. `bounds` carries one
        `default` per *kind* of figure, and the four throttles do not share one — the
        console's per-account bucket and the portal's per-address bucket differ by two
        orders of magnitude — so a console offering "reset to default" on one throttle
        reads the figure here rather than compiling it in.
      required: [throttles, bodyCeilings]
      properties:
        throttles: { $ref: "#/components/schemas/SignInThrottles" }
        bodyCeilings: { $ref: "#/components/schemas/BodyCeilings" }

    CoaTimingBounds:
      type: object
      description: |
        The range `updateNasCoaTiming` accepts for each figure, and its default, sent so
        the console states and enforces the server's range rather than one of its own.
      required: [timeoutMs, retries]
      properties:
        timeoutMs: { $ref: "#/components/schemas/NetworkBound" }
        retries: { $ref: "#/components/schemas/NetworkBound" }

    NetworkSettings:
      type: object
      required: [portalUrl, venueUrl, throttles, bodyCeilings, bounds, defaults, portalCertificate, updatedAt, updatedBy]
      properties:
        # RFC 8908's `user-portal-url`: where a guest's browser reaches the portal.
        # With a certificate served it must be `https://` and a name it covers.
        portalUrl: { $ref: "#/components/schemas/NetworkUrlSetting" }
        # RFC 8908's `venue-info-url`. Optional.
        venueUrl: { $ref: "#/components/schemas/NetworkUrlSetting" }
        throttles: { $ref: "#/components/schemas/SignInThrottles" }
        bodyCeilings: { $ref: "#/components/schemas/BodyCeilings" }
        bounds: { $ref: "#/components/schemas/NetworkSettingBounds" }
        defaults: { $ref: "#/components/schemas/NetworkSettingDefaults" }
        portalCertificate: { $ref: "#/components/schemas/PortalCertificateStatus" }
        updatedAt: { type: [string, "null"], format: date-time }
        updatedBy: { type: [string, "null"] }

    NetworkSettingsUpdate:
      type: object
      required: [portalUrl, venueUrl, throttles, bodyCeilings]
      properties:
        portalUrl:
          type: [string, "null"]
          description: Null goes back to the deployment's own value.
        venueUrl:
          type: [string, "null"]
          description: Null goes back to the deployment's own value, which may be none.
        throttles: { $ref: "#/components/schemas/SignInThrottles" }
        bodyCeilings: { $ref: "#/components/schemas/BodyCeilings" }

    PortalCertificateState:
      type: string
      enum: [none, served, not-served]
      description: |
        `served` is what guests' browsers are shown now. `not-served` is a certificate
        that is stored and cannot be used as things stand — `notServedReason` says
        why — and the portal is answering plain HTTP meanwhile. `none` is plain HTTP
        because no certificate exists.

        `notServedReason: not-yet-valid` is a certificate whose validity starts
        later than now — one from the deployment's certificate files, or any
        certificate on a host whose clock was stepped back. It is served from the
        moment it is valid, without a restart.

    PortalCertificateStatus:
      type: object
      description: |
        The portal certificate, described. **Never the private key** — `keySet` is the
        whole of what is said about it.
      required: [state, source, keySet]
      properties:
        state: { $ref: "#/components/schemas/PortalCertificateState" }
        source:
          type: string
          enum: [console, environment, none]
        notServedReason:
          type: string
          enum: [portal-url-not-https, name-not-covered, expired, not-yet-valid, listener-failed]
        keySet: { type: boolean }
        subject: { type: string }
        issuer: { type: string }
        dnsNames: { type: array, items: { type: string } }
        ipAddresses: { type: array, items: { type: string } }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        fingerprintSha256:
          type: string
          description: Of the leaf certificate, lower-case hex.
        chainLength: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    PortalCertificateUpload:
      type: object
      required: [certificatePem, privateKeyPem]
      properties:
        certificatePem: { type: string, maxLength: 65536 }
        privateKeyPem:
          type: string
          maxLength: 16384
          writeOnly: true
          description: Sealed before it is stored. Never returned.
        portalUrl:
          type: string
          description: |
            Saved with the certificate in the same write, when sent: the portal's
            address must be a name the certificate covers, so the two may have to
            change together.

    EapCertificateUpload:
      type: object
      required: [certificatePem, privateKeyPem, caPem]
      properties:
        certificatePem: { type: string, maxLength: 65536 }
        privateKeyPem:
          type: string
          maxLength: 16384
          writeOnly: true
          description: Sealed before it is stored. Never returned.
        caPem:
          type: string
          maxLength: 65536
          description: The CA that issued the supplicants' client certificates.

    EapCertificateStatus:
      type: object
      required: [keySet]
      properties:
        keySet: { type: boolean }
        subject: { type: string }
        issuer: { type: string }
        caSubject: { type: string }
        notAfter: { type: string, format: date-time }
        fingerprintSha256: { type: string }
        updatedAt: { type: string, format: date-time }

    RadiusServerSettings:
      type: object
      required: [maxServers, maxServersBound, eapTlsEnabled, eapCertificate, pendingApply, applyAvailable]
      properties:
        maxServers:
          type: integer
          description: |
            FreeRADIUS worker threads. Also the size of its SQL and Policy API
            connection pools, so a worker never waits on a pool instead of answering
            Status-Server. Every worker can hold a database connection, so raising
            this raises what PostgreSQL has to admit.
        maxServersBound: { $ref: "#/components/schemas/NetworkBound" }
        eapTlsEnabled: { type: boolean }
        eapCertificate: { $ref: "#/components/schemas/EapCertificateStatus" }
        pendingApply:
          type: boolean
          description: A generator setting changed after the last successful apply.
        applyAvailable:
          type: boolean
          description: |
            This deployment writes FreeRADIUS's tree from this process and FreeRADIUS's
            supervisor has announced itself. False means `applyRadiusConfiguration`
            would answer `not-configured` or `restart-unavailable`, and the console
            says which before it is pressed.
        # Absent until the first sync, and until the first apply.
        lastSync: { $ref: "#/components/schemas/RadiusClientSync" }
        lastApply: { $ref: "#/components/schemas/RadiusApply" }

    RadiusServerSettingsUpdate:
      type: object
      required: [maxServers, eapTlsEnabled]
      properties:
        maxServers: { type: integer }
        eapTlsEnabled: { type: boolean }

    RadiusSyncTrigger:
      type: string
      enum: [nas-created, nas-updated, nas-deleted, nas-secret-rotated, controller-discovery, operator, startup]

    RadiusClientSkip:
      type: object
      required: [nasName, reason]
      properties:
        nasName: { type: string }
        reason: { type: string }

    RadiusClientSync:
      type: object
      description: |
        One sync of the client table FreeRADIUS reads. `refused` is a cross-tenant
        address conflict or a missing key-encryption key, and nothing was written;
        `failed` is anything else, and nothing was written either.
      required: [at, trigger, outcome, inserted, updated, unchanged, removed, skipped, reasons]
      properties:
        at: { type: string, format: date-time }
        trigger: { $ref: "#/components/schemas/RadiusSyncTrigger" }
        outcome:
          type: string
          enum: [synced, refused, failed]
        inserted: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        removed: { type: array, items: { type: string } }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/RadiusClientSkip" }
        # Whether the running server needs a restart to see this, against the
        # startup snapshot. Absent when no snapshot exists, so nothing recorded
        # what the running server loaded — said, not guessed.
        changeClass: { $ref: "#/components/schemas/ChangeClass" }
        reasons: { type: array, items: { type: string } }
        actorUsername: { type: string }

    RadiusApply:
      type: object
      required: [at, outcome]
      properties:
        at: { type: string, format: date-time }
        outcome:
          type: string
          enum: [applied, restart-unavailable, not-configured, failed]
        restarted:
          type: boolean
          description: |
            FreeRADIUS was restarted by this apply. `applied` with `false` is the
            configuration FreeRADIUS was already running, which happens when the
            control plane regenerates an unchanged tree at start; an operator's
            apply always restarts, because it may be asking FreeRADIUS to re-read its
            client table.
        detail:
          type: string
          description: |
            One line from FreeRADIUS's supervisor: why a `failed` apply failed — what
            `radiusd -C` refused, or what FreeRADIUS said before it did not start —
            and whether the previous configuration is running again. Never carries a
            line naming a password or a secret.
        actorUsername: { type: string }

    CoaTimingValues:
      type: object
      required: [timeoutMs, retries]
      properties:
        timeoutMs:
          type: integer
          description: How long one attempt waits for an answer. The total wait is timeoutMs × (retries + 1).
        retries:
          type: integer
          description: How many times the request is sent again after the first, over UDP.

    NasCoaTiming:
      type: object
      required: [nasId, siteId, name, driver, timeoutMs, retries, source]
      properties:
        nasId: { type: string }
        siteId: { type: string }
        name: { type: string }
        driver: { $ref: "#/components/schemas/NasDriverKind" }
        timeoutMs: { type: integer }
        retries: { type: integer }
        source:
          type: string
          enum: [console, default]

    NasCoaTimingUpdate:
      type: object
      description: Both null goes back to the defaults.
      required: [timeoutMs, retries]
      properties:
        timeoutMs: { type: [integer, "null"] }
        retries: { type: [integer, "null"] }

    # ── freshness ──────────────────────────────────────────────────────────

    Freshness:
      type: object
      description: |
        **The most important object in this document.** Any counter derived from
        RADIUS accounting travels with one of these, and the UI is not permitted to
        render the number without also rendering the freshness.

        Byte and time counters advance only on Interim-Update or Stop.
        `Acct-Interim-Interval` has a widely-implemented 300-second floor, so
        best-case sampling is five minutes — a worst-case overshoot of roughly
        3.7 GB on a 100 Mbps link. Many NAS send no interim updates unless asked,
        and on the controller-API path there is no Access-Accept in which to ask.
      required: [state]
      properties:
        state:
          type: string
          enum: [live, sampled, stale, absent]
          description: |
            `live` — the value is authoritative right now (NAS-enforced, not sampled).
            `sampled` — last updated within the requested interval.
            `stale` — no update within 2× the requested interval. A fault.
            `absent` — this NAS sends no accounting at all. **Never means "unlimited".**
        sampledAt:
          type: [string, "null"]
          format: date-time
        intervalSeconds:
          type: [integer, "null"]
          description: The requested `Acct-Interim-Interval`. Rendered next to the number.

    # ── nas ────────────────────────────────────────────────────────────────

    GardenKind:
      type: string
      enum: [none, ip-range, fqdn-sni]
      description: |
        Three-valued on purpose. An IP-range-only garden is materially weaker than
        FQDN/SNI, because modern CDNs host arbitrary customers and "allow the OAuth
        provider" degrades into "allow a general-purpose HTTPS tunnel". The admin UI
        says so rather than treating the two as equivalent.

    Capabilities:
      type: object
      description: |
        Load-bearing, not documentation. The admin UI **hides** controls the driver
        cannot honour — it never shows a field that silently does nothing.
      required:
        [liveReauthorize, walledGarden, hardQuota, bandwidthLimits, dynamicVlan, rotateSecret, canDeauthGuest]
      properties:
        canDeauthGuest:
          type: boolean
          description: |
            The driver can end a guest's session from Foyer — `disconnectSession`.
            False ⇒ the console shows no disconnect control on this device's
            sessions and says why. Named as `internal/nas` names it, so the evidence
            fact keyed `canDeauthGuest` on `getNasEvidence` is about this value.

            **Written by a probe, like every member here**, and false until one ran.
            The server does not trust it on the way back in: `disconnectSession`
            asks the driver itself and refuses with `/problems/disconnect-unsupported`
            where the two disagree.
        liveReauthorize:
          type: boolean
          description: Change limits without disconnecting. False ⇒ no "apply now" control exists.
        walledGarden: { $ref: "#/components/schemas/GardenKind" }
        hardQuota:
          type: boolean
          description: |
            The NAS enforces quota itself. True ⇒ delegate to it and treat `radacct`
            as reporting. False ⇒ quota is sampled and the UI says so.
        bandwidthLimits: { type: boolean }
        dynamicVlan: { type: boolean }
        rotateSecret: { type: boolean }

    NasDriverKind:
      type: string
      enum: [unifi, mikrotik, coa, ruckus, omada]

    CoaVendor:
      type: string
      description: |
        **Which member of the CoA family a `driver: coa` device is.**

        `NasDriverKind` has one member for two vendors, and they are two different
        implementations because they identify a session differently: Cisco IOS-XE by
        a `Cisco-AVPair audit-session-id` VSA, Aruba by `Calling-Station-Id` in its
        own spelling. A MAC in the wrong spelling identifies no session — which a
        careful NAS answers with `Error-Cause 503` and a careless one answers by
        **ignoring the request and ACKing it**. `docs/rules/testing.md`: *"ACKing
        a CoA is trivial; faithfully rejecting one is not."* So the lab cannot catch
        a wrong guess, and nothing else in the product can either.

        **This is a separate field rather than two more members of `NasDriverKind`,
        and the reason is the one case that matters.** Splitting the enum into
        `cisco` and `aruba` would leave *nobody said* with nowhere to live — every
        row already stored as `coa` would have to be rewritten to one vendor or the
        other by a migration that has no way to know which, which is precisely the
        guess this field exists to prevent. A nullable field beside `driver: coa`
        keeps **unset** representable, so the server can **refuse** it by name
        instead of defaulting to a vendor and reporting success on a no-op.

        Nothing here is measured. No Cisco or Aruba device has been near this
        project; `internal/nas` records every capability of both as UNVERIFIED and
        only the wire encodings as DOCUMENTED, read from FreeRADIUS's own
        dictionaries. This field decides **which** unverified driver is built, never
        that it works.
      enum: [cisco, aruba]

    NasReachability:
      type: string
      enum: [ok, unreachable, credentials-expired, unknown]

    NasSource:
      type: string
      enum: [discovered, manual]
      description: |
        `discovered` — read from a controller, and re-read on every discovery run. Its
        name, model and address belong to the controller; editing them here would be
        overwritten and is not offered.
        `manual` — registered by hand, for a driver with no controller. The operator
        owns every field.

    Nas:
      type: object
      description: |
        **A device Foyer speaks RADIUS to** — which for a controller deployment means
        an access point, discovered rather than typed.

        Three things could be fused here, and are kept apart: the controller an
        operator possesses, the `clients.conf` entry, and the radio a guest stands
        under. `Controller` carries the first; the remaining two stay together here because for the
        vendors in scope they are the same physical device addressed two ways — by
        **MAC** in the redirect, by **IP** in `clients.conf`. Where a controller
        proxies RADIUS on behalf of its access points, `radiusVia` says so.
      required:
        [id, siteId, name, driver, source, capabilities, reachability, enabled, secretSet, messageAuthenticator]
      properties:
        id: { type: string }
        siteId: { type: string }
        controllerId:
          type: [string, "null"]
          description: Null for a driver with no controller, and only then.
        source: { $ref: "#/components/schemas/NasSource" }
        mac:
          type: [string, "null"]
          description: |
            **The identifier the NAS redirect actually carries.** UniFi sends
            `ap=94:2a:6f:d0:30:57`; Omada sends `apMac`. Without it a redirect cannot
            be resolved to a device at all, which is why it is discovered from the
            controller rather than typed.
        radiusVia:
          type: string
          enum: [self, controller]
          default: self
          description: |
            Which address this device's Access-Requests arrive from.

            `self` — its own, so it needs its own `clients.conf` entry. The default,
            and what UniFi does.
            `controller` — proxied, so **one** entry covers the whole cluster. Aruba
            documents `dynamic-radius-proxy` as *"an alternative to adding all APs as
            NAS clients"*; it is an operator toggle, so identical hardware yields one
            client or twelve and Foyer cannot see which. Getting it wrong is silent —
            requests arrive from an address matching no client and are discarded.
        sharedSecretId:
          type: [string, "null"]
          description: |
            Which secret this device presents. **Many devices share one**, because the
            secret lives in a controller-level RADIUS profile. A secret per access
            point would tell the operator to "enter it on the device", which UniFi
            hardware has no field for.
        name: { type: string }
        description: { type: string }
        driver: { $ref: "#/components/schemas/NasDriverKind" }
        coaVendor:
          oneOf:
            - $ref: "#/components/schemas/CoaVendor"
            - type: "null"
          description: |
            Which CoA vendor this device is. **Read only where `driver` is `coa`**,
            in the same way `coaPort` is read only where CoA is spoken at all.

            **Null on a `coa` device means nobody has said**, and that device cannot
            be driven: the server refuses to build a driver for it rather than
            picking a vendor, because the wrong choice is answered with an ACK and no
            effect. It is null for every other driver, and a row that says otherwise
            is a row nothing reads.
        model: { type: [string, "null"] }
        firmware: { type: [string, "null"] }
        ipAddress: { type: [string, "null"] }
        nasIdentifier: { type: [string, "null"] }
        coaPort:
          type: [integer, "null"]
          description: |
            Per-NAS, not a constant. 3799 is common; Cisco frequently uses 1700.
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        reachability: { $ref: "#/components/schemas/NasReachability" }
        enabled: { type: boolean }
        secretSet:
          type: boolean
          description: |
            Whether a shared secret exists. **The secret itself is never returned by
            any operation.** This is the only thing the UI is told about it.
        secretLastUsedAt:
          type: [string, "null"]
          format: date-time
          description: What makes a write-only secret manageable.
        messageAuthenticator:
          type: string
          enum: [enforced, refused, unknown]
          description: |
            Whether this device accepts `require_message_authenticator = yes`.
            `refused` is a loud per-NAS warning in the UI, never a silent downgrade —
            it means the device is exposed to BlastRADIUS (CVE-2024-3596).

            **The last answer, not a current one.** `unknown` means nothing has ever
            established it. Any other value survives the device going away, so a
            screen that presents this as freshly measured is presenting an old
            measurement as a new one — `NasProbe.messageAuthenticator` is the field
            that can say a probe did not measure it.
        accountingConfigured:
          type: boolean
          description: |
            On the controller-API path there is no Access-Accept, so `radacct` rows
            exist only if the operator separately attached an accounting profile.
            False means every session figure for this NAS will be `absent`.

            Two-valued because a record has to answer the question the console asks
            of it. `NasProbe.accounting` is three-valued, because a probe that
            reached nothing has not shown this device to be silent.
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        createdAt: { type: string, format: date-time }

    NasCreate:
      type: object
      description: |
        **`ipAddress` is required here.**

        This operation creates a `clients.conf` row, and FreeRADIUS matches an
        incoming packet to a client **by its source address** — there is no other key.
        A row with no address is a client the server discards every Access-Request
        from without a reply, which is why `radius_clients.address` is `inet NOT
        NULL`; and `nasname` is one flat global namespace, so the value can be neither
        synthesised nor defaulted (`docs/rules/database.md`).

        Optional here and `NOT NULL` there would meet where they always meet: an
        omitted `ipAddress` would reach the database and come back as
        `/problems/internal` — a `500` for a field the operator simply did not fill
        in. The read model's
        `Nas.ipAddress` stays nullable and is a different fact — it is the **access
        point's** address, and an access point discovered behind a controller need not
        have one.
      required: [siteId, name, driver, ipAddress]
      properties:
        siteId: { type: string }
        name: { type: string }
        description: { type: string }
        driver: { $ref: "#/components/schemas/NasDriverKind" }
        ipAddress:
          type: string
          description: |
            One address or a range: `192.0.2.10` or `192.0.2.0/24`, v4 or v6. A range
            because `radius_clients.address` is `inet` rather than `cidr` — Aruba's
            dynamic-radius-proxy toggle decides which of the two an operator needs and
            Foyer cannot see that toggle.

            Refused `required` when blank and `not-an-ip-address` when it is neither,
            rather than being handed to the database to reject.
        nasIdentifier: { type: string }
        coaPort: { type: integer }
        coaVendor:
          $ref: "#/components/schemas/CoaVendor"
          description: |
            **Required when `driver` is `coa`, and refused as `required` when it is
            missing.** Not expressible as `required` here, because it is required for
            exactly one of the five drivers; `DRIVER_SHAPES` in
            `web/contract/src/index.ts` carries which, so the form and the server
            read the same table rather than two copies of it.

            The refusal is at registration **and** again where the driver is built.
            Two gates for one fact on purpose: this one stops the row being created,
            and the other covers every row that already exists — a `coa` row
            predating this field has no vendor and never will until somebody says.

            Ignored for every other driver. It says which of two RFC 5176 dialects
            to speak, and a device that does not speak CoA has no use for one.

    EvidenceStanding:
      type: string
      enum: [measured, documented, unverified]
      description: |
        **The same three words `docs/protocol-reality.md` uses**, and deliberately the
        same three rather than a client-friendly pair. The distinction between
        *measured* and *documented* is the one that matters most: a citation says
        what a vendor wrote down, and only a measurement says what a device did.

        `unverified` is not *wrong* and not *unsupported*. It is *not known to be
        known*, which is why the console renders it `neutral` and never `positive`
        and never `warning`.

    EvidenceFact:
      type: object
      description: One thing Foyer believes about a driver, and how it came to.
      required: [subject, evidence, note]
      properties:
        subject:
          type: string
          description: |
            The capability name, or the RADIUS attribute name — `LiveReauthorize`,
            `Cisco-AVPair`, `Mikrotik-Rate-Limit`. Rendered verbatim: these are the
            names in the vendor's documentation and in FreeRADIUS's dictionaries,
            and an operator searching for one wants the string they will find there.
        evidence: { $ref: "#/components/schemas/EvidenceStanding" }
        note:
          type: string
          description: |
            **Required, and it carries the citation or the experiment.** For a
            `documented` or `measured` fact it says where the fact came from; for an
            `unverified` one it names **the measurement that would settle it** —
            because, in `internal/nas`'s own words, an unverified fact with no named
            measurement is a guess wearing a label.

            `NasProbe.unverified` carries only capability *names*; without this
            field a client could render no more than a generic *believed, not
            measured* under each, and the one thing an operator can act on — what
            would have to be done to find out — would never leave the Go source.

    DriverEvidence:
      type: object
      required: [profile, capabilities, attributes]
      properties:
        profile:
          type: string
          enum: [resolved, vendor-not-chosen]
          description: |
            `vendor-not-chosen` is a `coa` row with no `coaVendor`: Foyer can build
            no profile for it, so both lists below are empty and the emptiness has a
            reason beside it. An explicit named state rather than an absent field —
            the register `Freshness.state: absent` established for this document,
            and for the same reason: a client that saw only the empty lists would
            render *this driver sends nothing*.
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/EvidenceFact" }
          description: |
            One per capability the driver reports. **Required and possibly empty**,
            for the reason `NasProbe.warnings` is: an absent array arrives as
            `undefined`, a component reads that as *nothing to show*, and *we did not
            look* becomes *there was nothing wrong*.
        attributes:
          type: array
          items: { $ref: "#/components/schemas/EvidenceFact" }
          description: |
            One per RADIUS attribute this device's vendor profile can emit, with how
            the **encoding** is known. It answers a different question from
            `capabilities` and a client must not merge them: the encodings are
            `documented` while the capabilities are `unverified`, and that
            disagreement is the honest description of every CoA driver Foyer ships.

    ProbeWarningKind:
      type: string
      description: |
        **A kind, not a sentence** — the decision `AlarmKind` and `AuthEventKind`
        already carry, applied here because a probe warning is read by an operator
        deciding whether to trust a device, which is the worst place for the server
        to have composed English.

        The list is closed and every value is produced by driving `web/mock`. Each
        one is a condition a shipped driver actually reports:

        `access-point-unconfirmed` — the driver cannot check the access point the
        NAS redirect claimed. `docs/rules/security.md` §4 asks for MAC **and** AP
        **and** site **and** still-unauthorized. On UniFi the client object's
        `uplinkDeviceId`, resolved through the site's device list, is what the AP is
        compared against, so the UniFi probe raises this when that cannot work: no
        API key, a device list that does not answer, or a site with no devices.
        It must reach the screen: a registration that renders a green tick over it
        is telling an operator a check happened.

        `version-below-floor` — the controller is below the documented floor for the
        API this driver needs. Params: `version`, `minimumVersion`. The second is
        what turns a verdict into an instruction, the same argument
        `ControllerProbe.minimumVersion` makes.

        `capabilities-unverified` — at least one capability value in this answer is
        believed rather than measured. It duplicates nothing: `unverified` names
        *which*, and this is what makes the condition renderable beside the other
        warnings rather than only inside a capability table. Params: `count`.

        **There is deliberately no `certificate-verification-disabled`, and the
        reason is a decision made elsewhere in this document.** A driver reached with
        TLS verification off is a real warning and `internal/nas` has one — but
        `TlsMode` offers only `verify` and `trust-on-first-use`, on the stated
        grounds that *"Foyer will not offer that"*. So the condition cannot arise
        through this API, no drive of `web/mock` can produce it, and a kind nothing
        emits is a catalogue entry that can never be shown to render correctly. It
        gets added the day a mode that produces it does.
      enum:
        - access-point-unconfirmed
        - version-below-floor
        - capabilities-unverified

    ProbeWarning:
      type: object
      description: |
        One condition the operator must see that does **not** make the device
        unusable. Same shape as `Alarm`, for the same reason: the client owns the
        sentence and the server supplies the facts in it.
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ProbeWarningKind" }
        params:
          type: object
          additionalProperties: true
          description: Structured values the client interpolates into its own copy.
        detail:
          type: string
          description: |
            **Optional fallback, for a `kind` an older client does not recognise**,
            and ignored by a client that has copy for the kind. Same rule as
            `Alarm.detail`, including the reason it exists in spite of rather than
            because of: two sources for one sentence is how they drift.

    NasProbe:
      type: object
      description: |
        **What one probe established — including the things it could not.**

        It carries all four of the findings that most change what Foyer can do with
        a device, including that it refuses `require_message_authenticator` and is
        therefore exposed to BlastRADIUS (CVE-2024-3596), and that no session data
        will ever arrive from it. Both are measured by the probe; if they were
        readable only on `Nas`, a client would have to issue `probeNas` and then
        `getNas` to render an honest answer, and one that did not know to would
        render a device it had half measured.

        **The alternative was to answer with the updated `Nas` beside the probe
        result, and it was rejected.** `Nas` is what was *last known*. Pairing it
        with a probe that reached nothing puts a `messageAuthenticator` measured
        weeks ago next to `reachability: unreachable` — the exact lie this object
        exists to prevent — and it would make `POST /nas/{nasId}/probe` a second
        source of truth for a record that grows for reasons unrelated to probing.
        `Nas` keeps both fields: they are the **record**, these are the
        **measurement**, and only a measurement can say it did not happen.

        **A probe that did not reach the device measured nothing.** Every field added
        here can say that, in the register `Freshness.state: absent` already
        established for this document — an explicit named state rather than an
        omitted field. Two reasons it is a required three-valued string and not an
        optional or nullable one:

        - A client that ignores the state renders *not measured* rather than
          coercing `null`/absent into `false`.
        - The Go implementation of this contract uses `encoding/json`, where
          `omitempty` on an optional boolean silently drops `false` — turning *no
          accounting profile is attached* into *we did not look*. The one value that
          must never be inferable is the one that would vanish.

        `capabilities` **cannot** express it, and that is the remaining gap: when
        `reachability` is anything but `ok` the capabilities here are the stored
        record rather than a measurement, and a client must gate on `reachability`
        before presenting them as measured. Making it nullable would close the gap
        and needs a coordinated client change.
      required:
        [reachability, capabilities, messageAuthenticator, accounting, checks, warnings, unverified]
      properties:
        reachability: { $ref: "#/components/schemas/NasReachability" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ProbeWarning" }
          description: |
            **Required, and empty is a claim rather than a silence.** The driver
            layer produces these; an adapter that dropped them would let a
            registration screen render a green tick over conditions the probe had
            already found.

            Required rather than optional for the reason `countersWrapped` is: an
            absent array arrives as `undefined`, a component reads that as *nothing
            to show*, and *we did not look* becomes *there was nothing wrong*. An
            empty array says the probe looked.
        unverified:
          type: array
          items: { type: string }
          description: |
            **The capability values in this answer that are believed rather than
            measured**, named by their property in `Capabilities` — so a screen can
            mark the individual value rather than the object. A name that is not a
            property of `Capabilities` is a finding, not a value to render;
            `web/mock` asserts the membership against the schema rather than against
            a list typed here.

            `docs/rules/nas-drivers.md` makes a capability decide whether a
            control **exists at all**, which is what makes an unmeasured one worse
            than a missing one: the control is drawn, the operator uses it, and
            nothing said the value behind it was a guess. Required and possibly
            empty, for the same reason as `warnings`.
        messageAuthenticator:
          type: string
          enum: [enforced, refused, not-measured]
          description: |
            What this probe found, which is not what `Nas.messageAuthenticator`
            holds. There the third value is `unknown`, meaning *never established*.
            Here it is `not-measured`, meaning *this probe did not establish it* —
            deliberately a different word, because it is compatible with the stored
            record still reading `enforced` from the last time anything reached the
            device. `refused` is a loud per-NAS warning that never clears on its own.
        accounting:
          type: string
          enum: [configured, missing, not-measured]
          description: |
            Whether an accounting profile is attached — the measurement behind
            `Nas.accountingConfigured`. `missing` means every session figure for this
            NAS will be `absent` forever: on the controller-API path there is no
            Access-Accept in which to ask for interim updates, so nothing the server
            emits later can repair it. `not-measured` is not `missing`; a device
            nothing could reach has not been shown to be silent.
        checks:
          type: array
          items:
            type: object
            required: [name, result]
            properties:
              name: { type: string }
              result: { type: string, enum: [pass, fail, skip] }
              detail: { type: string }

    # ── controllers ────────────────────────────────────────────────────────

    ControllerVendor:
      type: string
      enum: [unifi, omada, ruckus]
      description: |
        Only the vendors whose captive-portal authorization goes through a management
        plane. MikroTik and the CoA family have **no controller** — the device is its
        own, and its record is a `Nas` registered by hand.

        Which of the two a vendor is follows from its **driver shape**, and that table
        is **deliberately not a schema in this document**: it follows from the vendor's
        API rather than from the deployment, so it is identical everywhere and a server
        sending it would be telling a client something the client already knows and
        could then disagree with. `Capabilities` is the opposite — measured per device,
        and therefore on the wire. The table is `DRIVER_SHAPES` in
        `web/contract/src/index.ts`.

        **A cross-reference in prose names the file it lives in.** A bare type name in
        an OpenAPI description reads as a reference to a schema in this document, and
        it is copied verbatim into `src/generated/types.ts` and into
        `internal/api/gen/server.gen.go`, where a reader has even less to go on. No
        `$ref` resolver will ever check it; the guard that does sits beside the orphan
        check in `web/mock/src/validate.test.ts`.

    ControllerAuthMode:
      type: string
      enum: [api-key, local-admin, hotspot-operator]
      description: |
        Which credential this controller takes, because they are not interchangeable
        and the wrong one fails in a way that reads as "the password is wrong".

        `api-key` — UniFi's official integration API, `X-API-KEY`, generated in
        Network → Control Plane → Integrations. **Requires Network Application
        9.1.105 or newer**; older consoles have no such screen.

        `local-admin` — a UniFi **local** administrator's username and password, for
        the legacy private API that every shipped integration still uses. A UI
        account with two-factor on it will not work here.

        `hotspot-operator` — Omada, and the one that catches everybody: TP-Link is
        explicit that this account is *"the operator-added in the hotspot manager
        interface, rather than the account and password for the controller
        account"*. An operator who types their controller admin credentials gets a
        failure that says nothing about why.

    TlsMode:
      type: string
      enum: [verify, trust-on-first-use]
      description: |
        `verify` — a certificate chaining to a public root.

        `trust-on-first-use` — pin whatever the controller presents now and refuse a
        change later. **Controllers ship self-signed certificates**, and every shipped
        integration answers that by disabling verification entirely: PacketFence sets
        `verify_hostname => 0`, TP-Link's own sample sets `CURLOPT_SSL_VERIFYPEER =
        FALSE`. Foyer will not offer that. Pinning is the same one-click experience
        for the operator and is not silently equivalent to no TLS at all — a form
        with no TLS choice fails on first contact for most deployments, and a form
        whose only choice is "ignore certificates" teaches the wrong habit on a box
        holding a network's credentials.

    Controller:
      type: object
      description: |
        The management plane an operator possesses.
      required:
        [id, name, vendor, baseUrl, authMode, tlsMode, credentialSet, reachability, vendorSites]
      properties:
        id: { type: string }
        name: { type: string }
        vendor: { $ref: "#/components/schemas/ControllerVendor" }
        baseUrl:
          type: string
          description: |
            Scheme, host and port as the operator's browser sees them. The path is
            not asked for: whether this is a UniFi OS console (`/proxy/network`, 443)
            or a standalone controller (8443) is **probed, not typed** — PacketFence
            establishes it by asking for `/proxy/network/status` and reading the
            status code, and an operator should not have to know which they own.
        controllerId:
          type: [string, "null"]
          description: |
            Omada only: the 32-character identifier that appears in the controller's
            own URL. It cannot be derived or guessed, so it has to be asked for — and
            the friendly form of the question is *paste your controller's address
            bar*, from which it is extracted.
        authMode: { $ref: "#/components/schemas/ControllerAuthMode" }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        credentialSet:
          type: boolean
          description: |
            Whether a credential exists. **The credential itself is never returned by
            any operation** — it is a password to somebody's network, and the same
            write-only rule applies as to a RADIUS shared secret.
        certificateFingerprint:
          type: [string, "null"]
          description: What `trust-on-first-use` pinned. A change here is a refusal, not a prompt.
        reachability: { $ref: "#/components/schemas/NasReachability" }
        version:
          type: [string, "null"]
          description: As reported by the controller. Null until a probe has reached it.
        versionSupported:
          type: [boolean, "null"]
          description: |
            Whether that version can do what this driver needs. **Null means not
            established**, and is not the same as false — the third value exists for
            the reason every other three-valued field in this document does.
        vendorSites:
          type: array
          description: |
            The controller's **own** sites, as it reports them. A controller manages
            many and the authorization path is scoped to one, so the operator picks
            from this list rather than typing a name they would have to go and look
            up. Empty until a probe has read it.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              boundSiteId:
                type: [string, "null"]
                description: The Foyer site this vendor site has been adopted into, if any.
        lastContactAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ControllerCreate:
      type: object
      required: [name, vendor, baseUrl, authMode, tlsMode]
      properties:
        name: { type: string }
        vendor: { $ref: "#/components/schemas/ControllerVendor" }
        baseUrl: { type: string }
        controllerId: { type: string }
        authMode: { $ref: "#/components/schemas/ControllerAuthMode" }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        apiKey:
          type: string
          description: For `api-key`. Write-only; never returned.
        username:
          type: string
          description: For `local-admin` and `hotspot-operator`.
        password:
          type: string
          description: Write-only; never returned.

    ControllerUpdate:
      type: object
      properties:
        name: { type: string }
        baseUrl: { type: string }
        controllerId: { type: [string, "null"] }
        tlsMode: { $ref: "#/components/schemas/TlsMode" }
        apiKey: { type: string }
        username: { type: string }
        password: { type: string }

    ControllerProbe:
      type: object
      description: |
        What one probe established about a controller — **including what it could
        not**, in the register `NasProbe` set for this document.
      required: [reachability, checks, warnings, unverified]
      properties:
        reachability: { $ref: "#/components/schemas/NasReachability" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ProbeWarning" }
          description: |
            See `NasProbe.warnings`. This is the surface where the driver layer
            produces them — the UniFi probe appends `access-point-unconfirmed` when
            it cannot resolve a client's `uplinkDeviceId` to an access point (no API
            key, no device list, or an empty site).
        unverified:
          type: array
          items: { type: string }
          description: See `NasProbe.unverified`.
        version: { type: [string, "null"] }
        versionSupported: { type: [boolean, "null"] }
        minimumVersion:
          type: [string, "null"]
          description: |
            What this driver needs, so a version failure states the target rather than
            just the verdict. An operator told "unsupported" has to go and find out
            what would be supported; one told "9.1.105 or newer" is already fixing it.
        flavour:
          type: [string, "null"]
          description: |
            What the probe found the controller to be — a UniFi OS console versus a
            standalone controller, say. Probed rather than asked, and reported so the
            operator can see it guessed right.
        vendorSites:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        certificateFingerprint: { type: [string, "null"] }
        checks:
          type: array
          items:
            type: object
            required: [kind, result]
            properties:
              kind:
                type: string
                enum:
                  [reachable, tls, credential, version, sites, guest-authorization, presence-check]
                description: |
                  A kind, not a sentence — the same decision as `AlarmKind`. The last
                  two matter most: `guest-authorization` is what Foyer is here for,
                  and `presence-check` is the one `docs/rules/security.md` §4 makes
                  mandatory before any grant. A driver that cannot do the second
                  cannot honestly ship, whatever else passes.
              result: { type: string, enum: [pass, fail, skip] }
              detail: { type: string }

    DiscoveryResult:
      type: object
      description: |
        What one discovery run reconciled. **Counted, not just listed**, because the
        number an operator checks against reality is "twelve access points" and a list
        of twelve names is not the same reassurance.
      required: [adopted, updated, missing, sharedSecretId]
      properties:
        adopted:
          type: integer
          description: Access points the controller reported that Foyer had not seen.
        updated:
          type: integer
          description: Already known, and re-read.
        missing:
          type: integer
          description: |
            Known to Foyer and **not** reported by the controller this time. Marked,
            never deleted: an access point that dropped off for ten minutes is not the
            same fact as one an operator removed, and deleting on absence would drop
            its `clients.conf` entry the first time a controller answered slowly.
        sharedSecretId:
          type: string
          description: |
            The one secret every device adopted here presents. Not a simplification:
            the secret lives in a controller-level RADIUS profile, so `clients.conf`
            is N addresses against one secret.
        accessPointIds:
          type: array
          items: { type: string }

    # ── vouchers ───────────────────────────────────────────────────────────

    VoucherState:
      type: string
      enum: [unused, in-use, exhausted, expired, revoked]

    ExpiryMode:
      type: string
      enum: [from-creation, from-first-use]
      description: |
        The two behave differently and a guest cannot infer which applies. Printed
        vouchers state it in words rather than showing a bare date.

    VoucherBatch:
      type: object
      required: [id, siteId, label, count, createdAt, plan, expiryMode]
      properties:
        id: { type: string }
        siteId: { type: string }
        label: { type: string }
        count: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        plan: { $ref: "#/components/schemas/Plan" }
        expiryMode: { $ref: "#/components/schemas/ExpiryMode" }
        expiresAt: { type: [string, "null"], format: date-time }
        counts:
          type: object
          description: How the batch has actually been used.
          properties:
            unused: { type: integer }
            inUse: { type: integer }
            exhausted: { type: integer }
            expired: { type: integer }
            revoked: { type: integer }

    PlanRequest:
      type: object
      description: |
        What an operator asks for. **Deliberately not `Plan`**, and the missing member
        is `enforcedBy`.

        A client cannot know it. Whether a limit is enforced by the access point,
        sampled from accounting, or enforced by nothing at all follows from the
        capabilities of the devices in the site — and for a voucher batch there is no
        single device, because a batch is redeemable anywhere in it. A client that
        sent `enforcedBy: "nas"` as a literal would be asserting a fact about hardware
        it has not looked at.

        The server derives it, from the **weakest** enabled device in the site: a
        guest who lands on the one access point that cannot apply a rate has an
        unenforced rate, whatever the other eleven do. Same rule as
        `WalledGarden.effectiveKind`, and for the same reason.

        **Used by `AccountCreate` as well as `VoucherBatchCreate`.**
        A guest account is bound to a single site and is redeemable on any device in
        it, so it has exactly the voucher batch's problem and takes the same answer.
      properties:
        name: { type: string }
        nameLang: { $ref: "#/components/schemas/Language" }
        durationMinutes: { type: [integer, "null"] }
        dataAllowanceMb: { type: [integer, "null"] }
        downKbps: { type: [integer, "null"] }
        upKbps: { type: [integer, "null"] }

    VoucherBatchCreate:
      type: object
      required: [siteId, label, count, plan, expiryMode]
      properties:
        siteId: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 1, maximum: 2000 }
        plan: { $ref: "#/components/schemas/PlanRequest" }
        expiryMode: { $ref: "#/components/schemas/ExpiryMode" }
        validForHours: { type: integer, minimum: 1 }

    Voucher:
      type: object
      required: [id, batchId, code, state]
      properties:
        id: { type: string }
        batchId: { type: string }
        code:
          type: string
          description: |
            Immutable. Generated from an alphabet excluding `0 O 1 I L`, because it
            is typed by hand on a phone from a thermal receipt. Transported without
            separators; the UI groups it for display and the portal strips grouping
            before validating.
          pattern: "^[A-HJ-KM-NP-Z2-9]{12}$"
          example: ABCDEFGHJKMN
        state: { $ref: "#/components/schemas/VoucherState" }
        createdAt: { type: string, format: date-time }
        firstUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        currentSessionId: { type: [string, "null"] }

    Plan:
      type: object
      description: What a guest is granted. Not what they have used.
      required: [enforcedBy]
      properties:
        name: { type: string }
        nameLang:
          $ref: "#/components/schemas/Language"
          description: |
            The language `name` is written in.

            `name` is venue-authored text, like `PortalContext.terms.summary`, and it
            reaches a guest inside a document whose `lang` may be something else — a
            Vietnamese plan name on an English page is the ordinary case for a
            Vietnamese venue, not an edge one. The portal renders venue text verbatim and never
            translates it, so the only thing it can do honestly is mark it, and this
            is what it marks it with. Without the tag a screen reader pronounces
            `Nhân viên` in English and a browser's translation offer does not fire.

            Unkeyed, unlike `terms.summary`, because a plan has one name. A venue is
            expected to say what language it wrote its price list in, not to translate
            it. Absent means "assume the document's language", which is the right
            default for the deployment that has only ever had one.
        durationMinutes: { type: [integer, "null"] }
        dataAllowanceMb:
          type: [integer, "null"]
          description: |
            An allowance, not a balance. Whether it is enforced at all depends on
            `Capabilities.hardQuota`; where it is not, it is a sampled backstop.
        downKbps: { type: [integer, "null"] }
        upKbps: { type: [integer, "null"] }
        enforcedBy:
          type: string
          enum: [nas, foyer-sampled, unenforced]
          description: |
            `nas` — the access point enforces it and the figure is authoritative.
            `foyer-sampled` — enforced from accounting, with overshoot.
            `unenforced` — the plan states a limit nothing is enforcing. The UI must
            not present this as a cap.

            **Required, and server-derived.** Optional, it would arrive as
            `undefined` and a panel rendering a limit would have no enforcement
            statement to make — an absent enforcer reading as no caveat. And it is
            not the client's to send: see `PlanRequest`.

    # ── sessions ───────────────────────────────────────────────────────────

    SessionState:
      type: string
      enum: [online, ended, orphaned, unknown]
      description: |
        `orphaned` — no `Acct-Stop` and no update well past the interval, typically a
        NAS that rebooted. Left alone it stays "online" forever. It is shown as what
        it is, not as a healthy row.
        `unknown` — no accounting data at all. **Never rendered as "unlimited".**

        ── the derivation, because "well past the interval" is not a rule ─────────

        The values alone are not enough: two implementations need a rule they can
        both compute, or they write the same silence into two different fields.

        Evaluated in this order, and the order is part of the rule:

        1. `Acct-Stop` seen → **`ended`**.
        2. No accounting for this session at all, ever → **`unknown`**. Decided
           before any arithmetic, because a session nothing has ever reported on has
           no silence to measure: there is no `Acct-Interim-Interval` to be late
           against and no sample to be old. This is the controller-API path with no
           accounting profile attached — there is no Access-Accept in which to ask
           for interim updates, so nothing that happens later repairs it.
        3. Open, and nothing heard for more than **`2 × max(interval, 300 s)`** →
           **`orphaned`**, where *heard* is the later of the last interim update and
           the session start, and `interval` is the `Acct-Interim-Interval` this NAS
           was asked for (300 where it is unknown).
        4. Otherwise → **`online`**.

        Twice and not once, because a single missed Interim-Update is a lost UDP
        packet. The 300-second floor is not decoration: `Acct-Interim-Interval` has a
        widely-implemented five-minute floor, so a NAS claiming ten seconds is not
        evidence that ten seconds of silence means anything.

        **`orphaned` is a display state, not a closure.** The stale-session reaper
        closes a session at **four** of its own intervals, deliberately a different
        number: one closed the instant it is marked is one no operator ever sees, and
        *"sessions keep going orphaned on that access point"* is the signal that a NAS
        is misbehaving. Reaping at the display threshold removes the symptom and keeps
        the disease.

        ── what this makes of `freshness`, which is not what it looks like ────────

        `Freshness.stale` is **`2 × interval` with no floor**. So for an open session
        the two rules are the same rule, differing only by the floor, and two
        consequences follow that a client must not be written against a guess about:

        - **`online` with `freshness.state: stale` is reachable only where the NAS
          asked for an interval below 300 seconds** — 60 s requested, 200 s of
          silence, stale against the request and not yet orphaned against the floor.
          It is a real case and it is the *narrow* one; it is not the general shape of
          a session whose updates stopped.
        - **`orphaned` with `freshness.state: sampled` is reachable too**, where the
          interval is unknown: the state rule coalesces it to 300 and the freshness
          rule has nothing to compare against.

        The two fields are still not interchangeable, but the difference is what they
        are *about* rather than a second threshold: `state` is a claim about the
        **session**, `freshness` is a claim about the **figures beside it**, and
        `docs/rules/frontend.md` requires the second to travel with every
        accounting number whatever the first says. "Sampled 40 days ago" beside an
        orphaned row is the requirement working, not a contradiction.

    Session:
      type: object
      # `countersWrapped` is required, unlike the octet counters themselves. A server
      # that cannot say whether a byte figure has wrapped cannot be trusted with the
      # byte figure, and an optional boolean would arrive as `undefined` — which a
      # component reads as "no", which is the bug this field exists to prevent.
      required:
        [id, siteId, nasId, state, callingStationId, startedAt, freshness, countersWrapped]
      properties:
        id: { type: string }
        acctSessionId:
          type: string
          description: |
            Not reliably unique across NAS — non-unique values are observed in the
            field, not hypothetical. Never used alone as a key.
        siteId: { type: string }
        nasId: { type: string }
        nasName: { type: string }
        state: { $ref: "#/components/schemas/SessionState" }
        callingStationId:
          type: string
          description: |
            The client MAC. Weak identity: 802.11 addresses are cleartext regardless
            of WPA2/WPA3, and iOS 14+/Android 10+ present a rotating per-SSID private
            address by default.
        macIsRandomised:
          type: boolean
          description: |
            The locally-administered bit is set. The UI shows this rather than
            presenting the address as a device identity.
        # There is deliberately no `hostname`, and it must not be re-added.
        #
        # `docs/protocol-reality.md` is unambiguous: "Client hostname / OS — **Not
        # available.** Would require DHCP fingerprinting, which is out of scope."
        # `docs/rules/frontend.md` allows only what has been measured to exist.
        #
        # A field documented as "usually null" is not a small inaccuracy: anyone
        # who sees one device name concludes Foyer can show device names, and every
        # screen designed after that assumes a column that will be empty on real
        # hardware. Leaving it out of the contract rather than merely out of the
        # render is what prevents that.
        #
        # What would reopen it is a measured producer, not a request: DHCP
        # fingerprinting is out of scope (that is NAC territory), so it would have to
        # be a `radacct` column a real NAS actually populates, recorded in
        # `docs/protocol-reality.md`.
        username: { type: [string, "null"] }
        identityKind: { type: string, enum: [voucher, account, mac-auth, dot1x, unknown] }
        voucherId: { type: [string, "null"] }
        ipAddress: { type: [string, "null"] }
        apName: { type: [string, "null"] }
        ssid: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        lastUpdateAt: { type: [string, "null"], format: date-time }
        terminateCause: { type: [string, "null"] }
        freshness:
          allOf:
            - $ref: "#/components/schemas/Freshness"
          description: |
            **About the figures, not about the session.** `state` above answers *is
            this still open*; this answers *how old is the number you are about to
            render*, and it travels with every accounting figure regardless of the
            answer to the first. See `SessionState` for how the two thresholds relate
            and for the two combinations that look contradictory and are not.
        inputOctets:
          type: [integer, "null"]
          description: |
            `Acct-Input-Octets` exactly as the NAS last reported it, never corrected
            in place. The reported value is the evidence; a silently repaired counter
            would make the anomaly below unprovable from the API.
        outputOctets:
          type: [integer, "null"]
          description: |
            `Acct-Output-Octets` exactly as the NAS last reported it. See
            `inputOctets`.
        countersWrapped:
          type: boolean
          description: |
            Foyer has seen this session's reported octet counter go **down** between
            two accounting records, with no restart in between.

            `Acct-Input-Octets` and `Acct-Output-Octets` are 32-bit (RFC 2866
            §5.3–5.4). `Acct-Input-Gigawords`/`Acct-Output-Gigawords` (RFC 2869
            §5.1–5.2) exist to carry the high-order word, and a NAS that omits them
            reports a total that drops by 4 294 967 296 every 4 GiB. The session
            appears to run backwards.

            **The UI cannot comply with its own rule without this field.**
            `docs/protocol-reality.md` requires a shrinking total to be "shown as the
            anomaly it is, never clamped to zero and never quietly hidden" — and
            without a field saying which of the two a smaller number is, a counter
            that wrapped would render as a plain fact on a healthy access point.
            A component that draws a byte figure branches on this; one that draws a
            delta, a rate or a "remaining" **must**.

            Sticky for the life of the session: once a counter has wrapped, every
            figure derived from it stays a floor, including the ones taken after the
            next clean interim update.

            Derivable from `radacct` alone, which is why it is here and not a
            capability of the NAS: it needs two consecutive reads and nothing else.
            Note that the *absence* of Gigawords cannot be established from `radacct`
            — the stock schema stores an integer that defaults to zero, so "sent as
            zero" and "never sent" are the same row — which is exactly why this is
            keyed on an observed decrease rather than on a claim about the device.
        inputOctetsTotal:
          type: [integer, "null"]
          description: |
            `inputOctets` plus 4 294 967 296 for every wrap Foyer has observed. Equal
            to `inputOctets` while `countersWrapped` is false, `null` wherever
            `inputOctets` is null.

            **A lower bound, not a total, once `countersWrapped` is true.** Two wraps
            between two accounting records are indistinguishable from one, and at the
            300-second interim floor 4 GiB in one interval is 114 Mbps — reachable on
            the gigabit uplink a hotel actually has. Render it as "at least", or
            render the reported counter with the anomaly beside it; never as a
            measurement.

            The arithmetic is on this side of the wire on purpose. The standing rule
            is that nothing subtracts two byte counters without handling the wrap, and
            a rule that every client re-implements is a rule one client gets wrong.
        outputOctetsTotal:
          type: [integer, "null"]
          description: |
            `outputOctets` plus 4 294 967 296 per observed wrap. See
            `inputOctetsTotal`, including the reason it is a lower bound.
        sessionSeconds:
          type: [integer, "null"]
          description: |
            May be negative when the NAS and server clocks disagree. Observed in real
            deployments. The UI renders the anomaly rather than a nonsense duration.
        plan: { $ref: "#/components/schemas/Plan" }

    # ── accounts ───────────────────────────────────────────────────────────

    Account:
      type: object
      required: [id, siteId, username, enabled, createdAt, credentialKind]
      properties:
        id: { type: string }
        siteId: { type: string }
        username: { type: string }
        displayName: { type: [string, "null"] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
        credentialKind:
          type: string
          enum: [argon2id, argon2id+nt, argon2id+bcrypt, argon2id+nt+bcrypt]
          description: |
            **Every verifier stored for this identity, named by its scheme**, and
            computed from whether a row exists in each opt-in table rather than
            from a flag. A flag can be wrong; a `LEFT JOIN` cannot.

            `argon2id` is the only kind a portal or admin account may have, and it
            is the verifier the portal and the console always authenticate against.

            `argon2id+nt` additionally stores an NT hash in a separate,
            envelope-encrypted table, and exists solely for identities explicitly
            opted in to PEAP-MSCHAPv2. An NT hash is password-equivalent — it is the
            sole input to the MSCHAPv2 response, so a stolen hash authenticates
            directly. The UI states this at the point of opt-in.

            `argon2id+bcrypt` additionally stores a **bcrypt** verifier, for an
            identity explicitly opted in to **network authentication by password**
            (RADIUS PAP from a NAS today; EAP-TTLS/PAP is planned). The scheme
            is named here because **naming it is the price**: `rlm_pap` in FreeRADIUS 3.2.10
            has no argon2 scheme and libxcrypt answers its failure token for
            `$argon2id$` — measured — so an identity that authenticates to the
            network over 802.1X does so against a verifier that is **not
            argon2id**. A console that renders this as "argon2" is telling an
            operator something the data plane cannot do.

            The two opt-ins are independent, so `argon2id+nt+bcrypt` is
            representable. It is not reachable through this API today —
            `internal/raddb` refuses by name to generate PEAP-MSCHAPv2 — and it is
            in the enum because the schema can hold it and an enum that cannot
            express a state the database can is a client that crashes on real data.

            Unlike the NT hash, a bcrypt verifier is **one-way**: reading it does
            not authenticate. That is the entire reason it may live somewhere
            `rlm_sql` can read, and the reason NAS PAP is served from it — and
            EAP-TTLS/PAP is planned on it — where PEAP-MSCHAPv2 is refused.
        plan: { $ref: "#/components/schemas/Plan" }

    AccountCreate:
      type: object
      required: [siteId, username, password]
      properties:
        siteId: { type: string }
        username: { type: string }
        displayName: { type: string }
        password: { type: string, format: password }
        eapTtlsPap:
          type: boolean
          default: false
          description: |
            Also store the bcrypt verifier that lets this identity authenticate to
            the network with its password — RADIUS PAP from a NAS today;
            EAP-TTLS/PAP is planned and not generated yet. Off by default and per identity;
            the refusals are `updateAccount`'s, and the account is not created when
            one of them applies.
        plan:
          $ref: "#/components/schemas/PlanRequest"
          description: |
            `PlanRequest`, for the reason `PlanRequest` gives: `enforcedBy` is not the
            client's to send.

            It is deliberately not `Plan`, and the reason is worse than *permitting*
            the field. `Plan` makes `enforcedBy` **required**, so an operator who
            wanted to give a guest account a data allowance would have to assert who
            would enforce it. A client could then state `nas` on an account in a site
            whose weakest access point cannot cap a quota, and the console would
            render that allowance as an authoritative cap that nothing on the network
            applies.

            An account is bound to one site, so the derivation is the site's — the same
            weakest-device rule, from the same function.

    # ── operators, and the console's own authentication ────────────────────

    OperatorRole:
      type: string
      enum: [administrator, staff]
      description: |
        Two, and the line between them is the one the product already has: the person
        at the counter prints vouchers, the person who runs the network configures
        RADIUS.

        A role is **not** what a client gates on. It is what a *server* derives
        permissions from, and the derivation is v1's and may change — per-site staff
        is the obvious next question. `AuthSession.permissions` is the answer a client
        reads. See `OperatorPermission`.

    OperatorPermission:
      type: string
      description: |
        **What this operator may do, sent by the server, so no client has to compile
        in a table of what a role means.**

        This is `Capabilities` again, one layer up. A NAS capability is on the wire
        because it is measured per device and a client that guessed would offer a
        control the hardware refuses; a permission is on the wire because it is
        decided by the server and a client that guessed would offer a control the
        server refuses — the same defect, with a `403` instead of a dead radio.

        The v1 derivation from `OperatorRole` is a single table in
        `contract/src/index.ts` (`ROLE_PERMISSIONS`), for the same reason
        `DRIVER_SHAPES` lives there and not here: it follows from a product decision,
        is identical in every deployment, and is what the *server* implements. What
        the client reads is `AuthSession.permissions`, always — so a deployment that
        later scopes a role per site, or adds a third role, does not need every
        console in the field to be upgraded before it can gate correctly.

        ── why the set is not a CRUD matrix ─────────────────────────────────

        `:read` and `:manage` are split **only where the two roles actually differ**.
        Staff may read the access points, the walled garden and the portal settings
        and may change none of them; they may do everything on vouchers, guest
        accounts and sessions that an administrator can. A split neither role uses
        would be a distinction the product does not have, and a value nothing ever
        withholds is a gate that has never been closed.

        That staff can *read* the network configuration is the narrow reading, and it
        is deliberate: a console where a staff member cannot see that shared secrets
        exist is a console where they cannot tell an administrator that one needs
        rotating (`docs/rules/frontend.md` — ask whether the role makes the action
        impossible or merely somebody else's).

        **`sessions:manage` is the one split both roles hold, and it is held on
        purpose rather than by oversight** (it guards `disconnectSession`). Ending a guest's session is counter work — the field
        gives it to the front desk: ClearPass Guest's Active Sessions disconnect is
        an operator-profile privilege, and UniFi's hotspot operator unauthorizes
        guests — so staff keep it. It is not folded into `sessions:read` because a
        permission named *read* must never reach a control that throws a device off
        the network: the name is what a `403` carries in `params.required`, what an
        audit reader sees, and the first thing a per-site role would have to split.

        Every operation in this document declares the permission it requires, as
        `x-permission`; `public` and `authenticated` are the two values that are not
        permissions. `web/mock` computes its expected sets from both this enum and
        those annotations, so a permission no operation requires — or an operation
        that declares none — fails the suite.
      enum:
        - "sessions:read"
        - "sessions:manage"
        - "vouchers:manage"
        - "accounts:manage"
        - "nas:read"
        - "nas:manage"
        - "garden:read"
        - "garden:manage"
        - "portal:read"
        - "portal:manage"
        - "operators:manage"
        - "audit:read"
        # Retention periods and data-subject erasure. Administrators only: an erasure
        # cannot be undone, and a period set too short deletes history.
        - "privacy:manage"
        # Administrators only. A bulk, offline copy of personal data is a different
        # act from reading a page of it: it outlives the session, it is not
        # site-switched, and it cannot be recalled. Staff read every session on
        # screen; they do not take the table home. See the `reports` tag.
        - "reports:export"

    Operator:
      type: object
      description: |
        A person who signs in to the admin console. **Deployment-wide, never
        site-scoped** — see `listOperators` for why that is the load-bearing
        difference from `Account` rather than an inconsistency to tidy up.

        There is no credential member of any kind, in either direction. An operator is
        always argon2id (`docs/rules/security.md` §1), which is a fact about the
        store rather than something a client chooses, so — unlike `Account` — there is
        not even a `credentialKind` to render.
      required: [id, username, role, enabled, createdAt]
      properties:
        id: { type: string }
        username:
          type: string
          description: |
            **Immutable.** The audit log denormalises it at the moment an entry is
            written, so renaming an operator would leave one person under two names
            across a log that is read chronologically. `displayName` is the field that
            changes when somebody's name does.
        displayName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/OperatorRole" }
        enabled:
          type: boolean
          description: |
            A disabled operator cannot sign in and is refused with exactly the same
            `401` as an unknown username — see `signIn`. Disabling is the reversible
            half of deletion and is what an administrator reaches for when somebody
            leaves.
        createdAt: { type: string, format: date-time }
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          description: Null for an operator who has never signed in. Not a derived figure a client may send.

    OperatorRequest:
      type: object
      description: |
        What a client may send when creating an operator. **`role` and `enabled` are
        in it; `createdAt` and `lastLoginAt` are not** — the same reason `PlanRequest`
        exists rather than `Plan`: a client states an intent, never a derived fact. A
        console that sent `lastLoginAt` would be asserting something only the server
        can know, and the server would have to ignore it, which is a field that lies
        about who owns it.

        `password` is here and is the initial credential, handed over in person. It is
        write-only in the truest sense: nothing in this document ever returns one.
      required: [username, role, password]
      properties:
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/OperatorRole" }
        enabled:
          type: boolean
          default: true
          description: Absent means enabled. Creating an operator who cannot sign in is legitimate but is not the default.
        password: { type: string, format: password }

    OperatorUpdate:
      type: object
      description: |
        Enable, disable, rename, change role. Nothing else, and `username` is absent
        because it is immutable — see `Operator.username`.

        **There is deliberately no `password` member, and it must not be added.** This
        is where resetting *somebody else's* password would live, and its absence is a
        decision rather than an omission — recorded here so it is not helpfully
        restored by somebody who only sees a missing feature:

          - **A reset needs a delivery channel and this product has none.** Email is
            not configured, SMS is not built, and a one-time link needs an origin the
            operator can reach and a token store that does not exist. The alternative
            — the administrator types a new password and reads it out — is a
            credential travelling over whatever channel is to hand, chosen under time
            pressure, for an account that can rotate a RADIUS shared secret.
          - **The recovery path already exists and is honest.** An administrator
            disables the account and creates another. That is one more row and a
            conversation, and it leaves an audit entry naming who did it, which a
            silent reset does not.
          - **Creating an operator *does* set a password, and that is not the same
            thing.** A password set at creation is handed to somebody standing there
            for an account that has never been used; a reset takes a working account
            away from its owner and hands it to whoever asked.

        What would reopen it is a configured delivery channel — an SMTP sender the
        deployment owns, or a first-party one-time-link flow with a token store — not
        a request for the button.

        The screen says all of this where an administrator would look for the control,
        so that nobody adds a reset button that silently does nothing.
      properties:
        displayName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/OperatorRole" }
        enabled: { type: boolean }

    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    AdminSetupState:
      type: object
      required: [required, noAdministrator]
      properties:
        required:
          type: boolean
          description: |
            The installer opened the first-access setup and nobody has completed it.
            The console shows the setup form instead of the sign-in form.
        noAdministrator:
          type: boolean
          default: false
          description: |
            **No enabled administrator exists and no setup is open**: the install
            never finished — the installer's setup step did not run, or its
            `console_setup` row was lost with a restore. There is nothing to sign
            in to, so the console must not offer the sign-in form: it says what is
            wrong and what to do instead. `false` (the default) on every install
            with an administrator, and whenever `required` is true. Disclosing it
            costs nothing — it is one bit of the state `completeAdminSetup` already
            reports as `setup-complete`, and it names the only state in which the
            installation is unreachable.

    AdminSetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          description: The code the installer printed. Case, spaces and dashes are ignored.
        username: { type: string }
        password: { type: string, format: password }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    AuthSession:
      type: object
      description: |
        Who is signed in, what they may do, and the token they must echo.

        `permissions` travels with the operator rather than being looked up from
        `role`, because the server is the authority on both — see
        `OperatorPermission`.
      required: [operator, permissions, csrfToken, mustChangePassword]
      properties:
        operator: { $ref: "#/components/schemas/Operator" }
        mustChangePassword:
          type: boolean
          description: |
            **This operator is signed in on a temporary password somebody else set,
            and the server refuses everything else until they choose their own.**

            Foyer ships no credential: the first administrator is created by
            `completeAdminSetup` with a password of their own choosing, so a fresh
            install never sets this. It is set only by
            `foyerctl create-operator --must-change-password` — the host-side recovery
            path, for an operator whose password was issued by somebody else — and it
            is `required` rather than optional because a client that cannot see the
            state cannot route to it, and a client that treats it as absent renders a
            console the server will refuse every call from.

            **It is not advice to the client.** While it is `true` the server answers
            `/problems/password-change-required` to every operation except this one,
            `signOut` and `changeOwnPassword` — so a script or a stale tab cannot walk
            past the screen a browser would have shown. A forced change enforced only
            in a client is a suggestion with a redirect in front of it.

            It goes `false` when `changeOwnPassword` succeeds, and it can never be set
            through the API: a *server* deciding an operator's password must change is
            a different feature — expiry policy — with different consequences.
        permissions:
          type: array
          items: { $ref: "#/components/schemas/OperatorPermission" }
          description: |
            Exactly what this operator may do. A client gates every control on
            membership here and on nothing else. The array is closed over
            `OperatorPermission`, so a client catalogue keyed on it is a
            `Record<OperatorPermission, …>` and a missing case is a compile error —
            the same argument as `ProblemType` and `AlarmKind`.
        csrfToken:
          type: string
          description: |
            Echoed in `X-Foyer-CSRF` on every state-changing request. **In the body
            rather than in a readable cookie**, because the session cookie is
            `httpOnly` and a token the client cannot read is a token the client
            cannot send. See the `csrfToken` security scheme for where it is required.

    SessionDisconnectRequest:
      type: object
      additionalProperties: false
      description: |
        What else to withdraw beside the session. Both default to `false`: a
        disconnect on its own is the reversible act, and withdrawing a guest's paid
        access is a second decision an operator has to make on purpose.
      properties:
        revokeGrant:
          type: boolean
          default: false
          description: |
            Revoke every open portal grant for this session's device at this venue,
            so the portal reports `revoked` rather than `connected`.
        revokeVoucher:
          type: boolean
          default: false
          # A body option with a permission of its own: set to anything but
          # false, the caller must also hold this. `web/mock` enforces every
          # property-level x-permission generically; the Go handler checks it
          # and internal/api's TestBodyOptionPermissionsMatchTheContract ties
          # the two together.
          x-permission: "vouchers:manage"
          description: |
            Revoke the voucher this session was admitted with, when one can be
            identified — through a portal grant for the device, or a RADIUS
            `User-Name` that is a voucher code at this venue. No voucher is not a
            failure: `voucherRevoked` answers `false` and nothing else changes.

            **Needs `vouchers:manage` as well as `sessions:manage`.** It is the
            same act as `revokeVoucher`, and an option on another operation must
            not be a way round that operation's permission. A caller without it
            who sets this is refused with `403` `params.required: vouchers:manage`
            before anything is changed or sent. Both roles hold both today; the
            check is what keeps that true of a role added later.

    PortalAuthorization:
      type: object
      description: |
        One open portal grant — a guest the portal let on whose authorization has not
        been revoked and has not expired. `listPortalGrants` says why these are
        listed apart from sessions.
      required: [id, siteId, clientMac, method, grantedAt, canDisconnect]
      properties:
        id: { type: string }
        siteId: { type: string }
        clientMac:
          type: string
          description: The device's MAC as the portal confirmed it with the controller. Often a per-SSID private address.
        apMac: { type: string }
        method: { $ref: "#/components/schemas/PortalMethod" }
        planName: { type: string }
        grantedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Absent for a grant with no time limit.
        voucherId: { type: string }
        deviceName:
          type: string
          description: The controller that authorized the guest, or the device it arrived through.
        canDisconnect:
          type: boolean
          description: |
            The device's driver can unauthorize this guest — a controller. False on the
            RFC 5176 family, whose guests are RADIUS sessions, and on a device Foyer
            does not drive; the console says which instead of offering the control.

    PortalGrantDisconnectRequest:
      type: object
      properties:
        revokeVoucher:
          type: boolean
          default: false
          x-permission: "vouchers:manage"
          description: |
            Revoke the voucher this grant was made for, when it was a voucher's. Needs
            `vouchers:manage` as well as `sessions:manage`, for the reason
            `SessionDisconnectRequest.revokeVoucher` gives.

    SessionDisconnectResult:
      type: object
      required: [disconnected, grantsRevoked, voucherRevoked]
      properties:
        disconnected:
          type: boolean
          description: |
            The device **confirmed** it ended the session — a Disconnect-ACK, or a
            controller that answered the unauthorize with success. False when it
            refused, did not answer, or could not be reached; `failure` says which.
            The UI must not imply the guest is offline when this is false.
        failure:
          $ref: "#/components/schemas/Failure"
          description: |
            Present exactly when `disconnected` is false:
            `/problems/session-end-failed`, with `nasName` and `nasReachability` as
            `revokeVoucher` carries them, plus `cause` — `refused` (with the RFC
            5176 `errorCause` when the NAK carried one), `no-answer`,
            `bad-secret`, or `error`.
        grantsRevoked:
          type: integer
          minimum: 0
          description: How many portal grants this call revoked. Zero when not asked.
        voucherRevoked:
          type: boolean
          description: This call revoked a voucher. False when not asked or when none was found.
        voucher:
          $ref: "#/components/schemas/Voucher"
          description: The voucher as it stands after revocation, when one was revoked.

    # ── the audit log ──────────────────────────────────────────────────────

    AuditKind:
      type: string
      description: |
        **The change, not a sentence about it.** The client renders the copy from its
        own catalogue; the server sends the kind, the subject and the params.

        The list is what cannot be undone or what is security-relevant. It is closed,
        and every value is produced by driving `web/mock` — the same rule
        `ProblemType` carries, for the same reason: a kind nothing emits is a
        catalogue entry that can never be shown to render correctly.

        **Operator sign-in and sign-out are deliberately not here.** They are events
        rather than changes, they arrive at a rate nothing else in this list does, and
        a log that is mostly sign-ins is a log in which the shared-secret rotation is
        hard to find. What would add them is a place to put them — a separate
        authentication-events surface, which `listAuthAttempts` already is for guests
        and is not yet for operators.

        **Several members exist because, without them, a server would have nothing
        legal to write and would leave the change unrecorded rather than
        mislabelled** — the right call, and a hole in the log all the same:

        - `controller-updated` — `updateController` replaces the stored credential,
          the base URL or the TLS mode. That is the most security-relevant change
          this surface can make: a controller whose API key was swapped is a
          controller somebody else may now be driving. It is neither a registration
          nor a deletion.
        - `controller-discovery-run` — one discovery reconciliation, whose subject is
          the **controller** and not any one device. `nas-registered` was the only
          near-enough value and it is the wrong one twice over: it would claim one
          entry for what may be nine adoptions, and it would name a device as the
          subject of a change made to a controller. Its `params` carry the counts
          (`adopted`, `updated`, `missing`) so the entry says what the run did.
        - `site-created` — `createSite`, **the oldest entry any real deployment
          has**. A venue's name is the one fact about a deployment only the operator
          has, and a log that records every later change to it must also say where
          it came from. `nas-registered` is the near-enough value this rule refuses —
          a *device* as the subject of a change that made a *venue*.
        - `session-disconnected` — an operator asked a device to end a guest's
          session. The subject is the **session** (`name` is the client MAC, the
          identifier the operator acted on), and it is recorded whether or not the
          device confirmed, because `params` also records what was withdrawn:
          `disconnected`, `grantsRevoked`, `voucherRevoked`, `voucherId`, `nasId`.
          `voucher-revoked` is not written beside it — one operator action is one
          entry, and its `params` say that a voucher went with it.
      enum:
        - site-created
        - nas-secret-rotated
        - nas-registered
        - nas-deleted
        - controller-registered
        - controller-updated
        - controller-discovery-run
        - controller-deleted
        - garden-entry-added
        - garden-entry-removed
        - portal-settings-changed
        - portal-terms-changed
        - operator-created
        - operator-updated
        - operator-deleted
        - operator-password-changed
        - voucher-batch-created
        - voucher-revoked
        # Data retention and erasure. Both are the deployment's (siteId null):
        # retention periods and an erasure apply to every venue.
        - retention-policy-changed
        - data-subject-erased
        # `exportSessions`, `exportVouchers`, `exportGuests`. A read, and the only
        # read in this list: it is here because it is the one read that produces a
        # copy the log cannot follow. Subject is the site whose rows left; `params`
        # carry `dataset`, `from` and `to`, never a row.
        - data-exported
        - session-disconnected
        # Guest data and marketing consent. The settings change is the venue's (siteId set); the
        # withdrawal names the consent by id and never by the guest's details.
        - guest-data-settings-changed
        - marketing-consent-withdrawn
        # The `network` tag. Deployment-wide (siteId null).
        # A settings write names each changed value's old and new figure; a
        # certificate change names the fingerprint and expiry, never the key.
        - network-settings-changed
        - portal-certificate-changed
        - radius-clients-synced
        - radius-configuration-applied
        # Settings an operator sets in the console. A site's calendar is the
        # venue's (siteId set); the deployment-wide SMS cap is the deployment's.
        - site-time-zone-changed
        - phone-spend-cap-changed
        # The maintenance settings are the deployment's (siteId null); `params.changed` carries each
        # moved value's `from` and `to`.
        - maintenance-settings-changed
        # A guest account's password or 802.1X opt-in, on `createAccount` (opted in
        # at creation) or `updateAccount`. Security-relevant to the *network*, which
        # is the test this list applies: it decides whether an identity can
        # authenticate to the network by password (NAS PAP today, EAP-TTLS/PAP
        # planned), against a verifier that is not argon2id.
        # `params`: `passwordChanged`, `eapTtlsPap` (the state now in force). Never
        # a value.
        - account-credentials-changed

    AuditSubject:
      type: object
      description: |
        What the entry is about, named well enough to render after the thing itself is
        gone. `name` is denormalised for the same reason `actorUsername` is: the
        access point whose secret was rotated in March may not exist in June, and the
        entry still has to say which one it was.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [nas, controller, site, garden-entry, voucher-batch, voucher, operator,
                 retention-policy, data-subject, session, marketing-consent,
                 network-settings, radius-server, phone-spend-cap, maintenance-settings, account,
                 portal-grant]
        id: { type: string }
        name: { type: string }

    AuditEntry:
      type: object
      description: |
        One recorded change. Read-only, forever — see `listAudit`.
      required: [id, at, actorId, actorUsername, kind]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actorUsername:
          type: string
          description: |
            **Denormalised on purpose, and this is the member that makes the log
            survivable.** An entry has to outlive the operator it names — people
            leave, and their accounts are deleted — and a log that renders *"deleted
            operator"* where the name should be is a log that fails exactly when it is
            being read for a reason. Joining to `operators` at read time is the
            obvious implementation and the wrong one.

            `actorId` is kept beside it so filtering by actor still works across a
            username that was reused after a deletion.
        kind: { $ref: "#/components/schemas/AuditKind" }
        params:
          type: object
          additionalProperties: true
          description: |
            Structured values the client interpolates into its own copy — the number
            of entries removed, the fields that changed, the reachability of the
            device. Never a sentence.
        siteId:
          type: [string, "null"]
          description: |
            Null for a change that is not a site's — an operator was created, and
            operators are deployment-wide. Not every recorded change belongs to a
            site, and forcing one would be inventing a fact.

            **Which of the two a change is follows from its `kind`, not from the
            operator's current venue**, because a null that answered both questions
            at once would leave a reader unable to tell *this change had no venue*
            from *nobody recorded the venue*. Reading it per kind is what makes the
            null meaningful:

            - **The deployment's**, always null: `controller-registered`,
              `controller-updated`, `controller-deleted`, `operator-created`,
              `operator-updated`, `operator-deleted`, `operator-password-changed`,
              `retention-policy-changed`, `data-subject-erased`.
              A controller's vendor-site binding is per controller, so one can feed
              several venues and naming one would be the invented fact above; and
              there is no per-site operator role in this product.
            - **A venue's**, always a site: every other kind, `site-created`
              included — the venue it created — and `controller-discovery-run`,
              whose request names the venue its adoptions land in.

            A client must not derive a filter from this: `listAudit` takes no
            `siteId` parameter and deliberately takes none, because a good half of
            the entries have none and filtering the screen by the header's site
            switcher would hide exactly the ones an administrator opens it for. The
            member is a **column**, and the console renders it as one.
        subject: { $ref: "#/components/schemas/AuditSubject" }
        title:
          type: string
          description: |
            **Optional fallback, for a `kind` an older console does not recognise**,
            and the same rule as `Alarm.title`: a client that has copy for the kind
            must ignore this. Two sources for one sentence is how they drift. `web/mock`
            is asserted to send neither this nor `detail`.
        detail:
          type: string
          description: Optional fallback. Same rule as `title`.

    # ── privacy ────────────────────────────────────────────────────────────

    RetentionCategoryId:
      type: string
      description: |
        **A kind of guest data with a period of its own.** Closed, like `AuditKind`:
        each is code in `internal/store/privacy.go` naming the tables it sweeps and
        the column that dates a row, and a test holds this list to that one. A later
        feature that stores personal data adds a member here and a category there.

        - `accounting` — FreeRADIUS session records (`radacct`), by when the session
          ended. An open session is never removed.
        - `authAttempts` — sign-in attempts, both streams `listAuthAttempts` reads.
        - `portalGrants` — what the portal granted each device, by when it ended.
        - `audit` — the audit log, by when the change was made.
        - `guestAccounts` — guest accounts not used since the cutoff. Defaults to
          keep-until-deleted (`days: 0`).
        - `marketingConsents` — marketing consents guests gave, by when they
          were withdrawn, or by when they were given for one still active: a
          consent is not a licence forever, and two years is the refresh interval
          the UK ICO's guidance names. The details a guest gave **without**
          consenting live with the grant and go with `portalGrants`.
      enum: [accounting, authAttempts, portalGrants, audit, guestAccounts, marketingConsents]

    RetentionSweep:
      type: object
      description: The sweep's own record of its last pass over one category.
      required: [at, removed, failed]
      properties:
        at: { type: string, format: date-time }
        cutoff:
          type: [string, "null"]
          format: date-time
          description: |
            What was older than this was removed. Null when the category keeps
            everything (`days: 0`).
        removed: { type: integer, minimum: 0 }
        failed:
          type: boolean
          description: |
            The pass failed part-way. The reason is in the control plane's log and
            deliberately not here: a database error can quote a value from the row it
            failed on.

    RetentionCategoryPolicy:
      type: object
      required: [category, days, defaultDays, minimumDays, maximumDays, isDefault, tables]
      properties:
        category: { $ref: "#/components/schemas/RetentionCategoryId" }
        days:
          type: integer
          minimum: 0
          description: The period in force. `0` means kept until erased or deleted, and only a category whose `minimumDays` is 0 has it.
        defaultDays: { type: integer, minimum: 0 }
        minimumDays: { type: integer, minimum: 0 }
        maximumDays: { type: integer, minimum: 1 }
        isDefault: { type: boolean }
        tables:
          type: array
          items: { type: string }
          description: The database tables this category removes rows from, for an operator writing their own retention policy.
        lastSweep:
          oneOf:
            - $ref: "#/components/schemas/RetentionSweep"
            - type: "null"
          description: Null until the sweep has first run on this deployment.

    RetentionPolicy:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/RetentionCategoryPolicy" }

    RetentionPolicyChange:
      type: object
      required: [category, days]
      properties:
        category: { $ref: "#/components/schemas/RetentionCategoryId" }
        days:
          type: [integer, "null"]
          description: The new period in days, or null to restore the default.

    RetentionPolicyUpdate:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RetentionPolicyChange" }

    MaintenanceSettingsValues:
      type: object
      description: |
        The four operator settings of the control plane's own maintenance.
      required: [intervalSeconds, staleAfterMissedUpdates, staleCeilingPerPass, retentionBatchSize]
      properties:
        intervalSeconds:
          type: integer
          description: |
            How long every maintenance job waits between the end of one pass and the
            start of the next. Default 300: five minutes is the floor of
            Acct-Interim-Interval, so nothing these jobs clean changes meaning faster.
        staleAfterMissedUpdates:
          type: integer
          description: |
            How many of a session's own accounting updates must go missing before the
            stale-session reaper closes it — the session that an access point which
            rebooted will never send an Acct-Stop for. Counted against the session's
            reporting interval, never less than five minutes. Default 4, so twenty
            minutes of silence.

            **The minimum is 3, not 2**: the console marks a session *orphaned*
            after two, and a reaper that closes at the display threshold closes
            every session before any operator sees it orphaned — and "sessions keep
            going orphaned on that access point" is how a misbehaving one is found.
        staleCeilingPerPass:
          type: integer
          description: |
            The most sessions one reaper pass may close. A pass that would close more
            closes **none** and fails, loudly, every cycle until somebody looks: a
            site-wide outage and a fault in the arithmetic produce the same result,
            and the sessions are already over, so waiting costs nothing. Default 200.
            It cannot be switched off from here.
        retentionBatchSize:
          type: integer
          description: |
            How many rows one retention DELETE removes before the sweep loops.
            Default 500. Smaller holds locks for less time on a busy `radacct`;
            larger finishes a first sweep over a year of history sooner.

    MaintenanceSettingLimit:
      type: object
      required: [minimum, maximum, default]
      properties:
        minimum: { type: integer }
        maximum: { type: integer }
        default: { type: integer }

    MaintenanceSettings:
      type: object
      description: |
        The settings in force, their bounds and their defaults. `isDefault` is true
        until an operator first saves.
      required: [intervalSeconds, staleAfterMissedUpdates, staleCeilingPerPass, retentionBatchSize,
                 isDefault, updatedAt, updatedBy, limits]
      properties:
        intervalSeconds: { type: integer, description: "See `MaintenanceSettingsValues`." }
        staleAfterMissedUpdates: { type: integer, description: "See `MaintenanceSettingsValues`." }
        staleCeilingPerPass: { type: integer, description: "See `MaintenanceSettingsValues`." }
        retentionBatchSize: { type: integer, description: "See `MaintenanceSettingsValues`." }
        isDefault: { type: boolean }
        updatedAt: { type: [string, "null"], format: date-time }
        updatedBy:
          type: [string, "null"]
          description: The username of the operator who last saved, denormalised for the audit log's reason.
        limits:
          type: object
          required: [intervalSeconds, staleAfterMissedUpdates, staleCeilingPerPass, retentionBatchSize]
          properties:
            intervalSeconds: { $ref: "#/components/schemas/MaintenanceSettingLimit" }
            staleAfterMissedUpdates: { $ref: "#/components/schemas/MaintenanceSettingLimit" }
            staleCeilingPerPass: { $ref: "#/components/schemas/MaintenanceSettingLimit" }
            retentionBatchSize: { $ref: "#/components/schemas/MaintenanceSettingLimit" }

    MaintenanceSettingsUpdate:
      $ref: "#/components/schemas/MaintenanceSettingsValues"

    DataSubjectKind:
      type: string
      description: |
        What identifies the person. `mac` is a device; on a modern phone that is a
        private address chosen for this one network, so ask the guest for the address
        their phone shows **for this network**. `account` is a guest account an
        operator created. `phone` is a phone number — what a guest who signed in by
        SMS, or gave a number on the sign-in form, can tell you about themselves.
        `email` is an e-mail address a guest gave on the sign-in form or with a
        marketing consent.
      enum: [mac, account, phone, email]

    DataSubjectErasureRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/DataSubjectKind" }
            mac:
              type: string
              description: Required when `kind` is `mac`. Any spelling a NAS sends — `AA-BB-CC-00-11-22`, `aa:bb:cc:00:11:22`, `aabb.cc00.1122`, `aabbcc001122`.
            accountId:
              type: string
              description: Required when `kind` is `account`.
            phone:
              type: string
              maxLength: 32
              description: |
                Required when `kind` is `phone`. Any spelling — `0912 345 678`,
                `+84 912 345 678`, `84912345678`.
            email:
              type: string
              maxLength: 320
              description: Required when `kind` is `email`. Compared without regard to case.

    ErasedTable:
      type: object
      required: [table, rows]
      properties:
        table: { type: string }
        rows: { type: integer, minimum: 0 }

    DataSubjectErasure:
      type: object
      required: [id, at, subject, removed, pseudonymised, total]
      properties:
        id:
          type: string
          description: The audit entry's subject id, so the receipt and the log entry can be matched.
        at: { type: string, format: date-time }
        subject:
          type: object
          required: [kind, masked]
          properties:
            kind: { $ref: "#/components/schemas/DataSubjectKind" }
            masked:
              type: string
              description: The subject as the audit log names it — never the full MAC.
        removed:
          type: array
          description: Every table searched, including those that held nothing.
          items: { $ref: "#/components/schemas/ErasedTable" }
        pseudonymised:
          type: array
          description: |
            Tables whose rows were kept with the subject's identifier replaced by a
            pseudonym — `audit_log` — and how many rows each. Not counted in `total`.
          items: { $ref: "#/components/schemas/ErasedTable" }
        total: { type: integer, minimum: 0 }

    # ── overview ───────────────────────────────────────────────────────────

    Site:
      type: object
      required: [id, name, environment]
      properties:
        id: { type: string }
        name: { type: string }
        environment:
          type: string
          enum: [live, lab]
          description: |
            Colour encodes danger of the current context, not goodness of the
            environment: the live site is the one that carries a warning badge.

    SiteTimeZone:
      type: object
      description: |
        The calendar a site counts its days in. Every site has one: a site created
        without an explicit setting has `Asia/Ho_Chi_Minh`, the product default.
      required: [siteId, timeZone]
      properties:
        siteId: { type: string }
        timeZone:
          type: string
          description: An IANA zone name, for example `Asia/Ho_Chi_Minh`.
          example: Asia/Ho_Chi_Minh
        updatedAt:
          type: [string, "null"]
          format: date-time

    SiteTimeZoneUpdate:
      type: object
      required: [timeZone]
      properties:
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: An IANA zone name. `Local` is refused — it names the server's clock, not a place.

    SiteCreate:
      type: object
      description: |
        **`name` is the venue's name and there is no default for it.** That is the
        reason `createSite` exists at all rather than a migration seeding a row: the
        one fact needed to make the first site is the one fact only the operator has.

        `id` is not accepted. A site id reaches `radius_clients`, `access_points`,
        `portal_settings`, `walled_garden_entries`, `vouchers` and every `audit_log`
        row, and an operator-chosen one is a permanent identifier typed once into a
        first-run form. The readable fixture ids (`site-hcm`, `site-lab`) are fixtures.

        **`environment` is not accepted either, and that is the narrow reading rather
        than an omission.** What this operation exists for is the *first* site, and a first
        site is a venue: `live`, which is what `sites.environment` already defaults to.
        `lab` marks a site an operator may point at fake gear; there is no
        `updateSite`, no console screen that sets it, and `docs/rules/frontend.md`
        is explicit that designing for a screen which does not exist is where wasted
        frontend work concentrates. Adding it later is a backward-compatible optional
        field — removing a value the console had been sending would not be.

        It also has no honest refusal today. A value outside the two members would
        need a `FieldFault`, and the closest existing one renders as *"Required."*
        beside a filled-in select — exactly the defect `fault.coaVendor` exists to
        prevent. A field whose only wrong answer produces a misleading sentence is a field
        to leave out until it has a screen and a fault of its own.
      required: [name]
      properties:
        name: { type: string }

    Metric:
      type: object
      description: |
        A figure and how old it is — and **the freshness is derived over exactly the
        rows the value counts.**

        That sentence is the whole of it, and it is written here because two servers
        each restating it in their own language will disagree. A server that counted
        `online` sessions and `orphaned` ones as two separate figures and took
        **one** sample time over both would report a venue whose guests had all been
        heard from thirty seconds ago as forty days stale, on the strength of a
        single abandoned session that figure does not contain. The number would be
        seconds old and the sentence beside it — which a client is required to
        render — forty days wrong.

        A figure whose rows are sampled from accounting therefore answers:

        1. **Nothing counted → `live`, dated now.** There is no sample behind a
           figure with no rows in it, and zero is what the server knows at that
           instant. Never `sampled` with a null `sampledAt`, which names a sample
           and then declines to date it.
        2. **Otherwise `sampledAt` is the oldest of the counted rows**, never the
           newest. A count is only as current as its least current row, and
           reporting the freshest flatters it into looking live.
        3. **`stale` when that sample is older than twice `intervalSeconds`**, which
           for a counted figure is the 300-second `Acct-Interim-Interval` floor
           rather than any one NAS's request — so the verdict is reachable by a
           reader from the two numbers rendered beside it.

        A NAS that asked for a shorter interval and is late against its own promise
        is a *per-session* fault. It travels on that session's own `Freshness`,
        where there is deliberately no floor, and it is not what these three clauses
        measure.

      required: [value, freshness]
      properties:
        value: { type: [number, "null"] }
        freshness: { $ref: "#/components/schemas/Freshness" }

    Overview:
      type: object
      description: |
        The dashboard's six figures. Three are `Metric`s and three are bare
        integers, and which is which is a statement about what each one can say.

        `clientsOnline` counts sessions in state `online` — **not** open sessions —
        so its freshness is derived over those rows and no others. `orphanedSessions`
        counts the rest of the open ones, and it is the figure that carries the
        uncertainty an orphan represents: a row nothing has been heard from may still
        be associated, so `clientsOnline` may be an undercount. That is said once,
        here, by a separate figure — never by ageing the timestamp of a figure the
        row is not in.

        ### `orphanedSessions` is a `Metric`, and its freshness is not `clientsOnline`'s

        As a bare integer, the one figure whose entire meaning is *these sessions
        have not been heard from* could not say when any of them was last heard
        from.

        `Metric`'s rule is one rule and it applies here unchanged — **the freshness
        is derived over exactly the rows the value counts** — but the *reason* the
        sample is old is not the same reason, and that difference is the whole of
        this decision. On `clientsOnline` an old sample is an artefact of the
        instrument and a warning that the number may be wrong. Here it is the
        subject. Nothing about *forty days since the oldest of these was heard from*
        makes the count of them less true, and a client that renders the two the same
        way is saying something false about one of them.

        So the three clauses land like this:

        1. **No orphans → `live`, dated now.** Unchanged, and for the same reason:
           there is no sample behind a figure with no rows in it.
        2. **`sampledAt` is the oldest of the counted orphans.** Unchanged, and it
           is the entire point of widening the field. *The oldest of these was last
           heard from forty days ago* is the one sentence worth carrying about an
           orphan count: it separates one access point that rebooted ten minutes ago
           from rows that nothing has reaped since July, and those are different
           faults with different repairs.
        3. **`intervalSeconds` is `null`, and `state` is `stale` whenever the count
           is non-zero.** Both halves are deliberate and neither is a copy.

        **On `intervalSeconds`:** there is no cadence to declare. A row joins this
        set when it has been silent for `2 × max(its own interval, 300 s)`, so the
        set mixes rows judged at ten minutes with rows judged at two hours, and no
        single number is true of all of them. `clientsOnline` publishes the
        300-second floor because that floor is what turns its age into a verdict;
        here the verdict is decided by membership before the figure exists. Quoting
        an interval anyway would have the console print *every 5 minutes* beside a
        set of rows defined by nothing arriving.

        **On `state`:** `stale` is literally true of every counted row — no update
        within twice its interval, which is what put it in the set — and it names a
        real fault, the one `sessions-orphaned` raises. It is therefore the honest
        value, and a generic client rendering it says something true. But **it is
        redundant with the value**, since it is `stale` exactly when the count is
        non-zero, and that is stated here rather than hidden: **the state is not the
        information on this figure, the timestamp is.**

        Two obligations follow for a client, and they are the reason this paragraph
        is long:

        - **Do not render `clientsOnline`'s stale sentence here.** *"These figures
          are old"* is false — the count is exact at the instant it is computed. The
          sentence that is true is *the oldest of these was last heard from N ago*.
        - **Do not spend the badge on it.** A verdict that never varies against a
          number already on the card is one an operator learns to skip.

        `vouchersRedeemedToday` is a count of rows in a table nobody has to sample.
        It is the one figure here that may honestly say `live` with nothing behind
        it to date.
      required: [clientsOnline, vouchersRedeemedToday, nasTotal, nasUnhealthy, alarmCount]
      properties:
        clientsOnline: { $ref: "#/components/schemas/Metric" }
        vouchersRedeemedToday: { $ref: "#/components/schemas/Metric" }
        nasTotal: { type: integer }
        nasUnhealthy: { type: integer }
        orphanedSessions: { $ref: "#/components/schemas/Metric" }
        alarmCount: { type: integer }

    AlarmLevel:
      type: string
      enum: [info, negative, caution-minor, caution-major, warning, urgent]
      description: |
        Keyed on what the operator must do, not on how bad it sounds.
        `urgent` — must act now. `warning` — should act, optional.
        `caution-major` — a threshold has been breached.
        `caution-minor` — a fault requiring correction, not yet service-affecting.
        `negative` — a bad outcome that requires nothing.

    AlarmKind:
      type: string
      description: |
        **The alarm, not a sentence about it.** The client renders the copy from its
        own catalogue; the server sends the kind and its params.

        There are no `title` and `detail` sentences, because a server-composed sentence
        is in the server's language: the dashboard — the first thing anyone opens —
        would greet an operator in a language they had not chosen. Three consequences,
        and the third is the structural one: the same sentence would live in two
        places and drift; a server cannot know the reader's language at the time it
        raises an alarm; and client-side translation would be impossible by
        construction.

        **`controller-version-unsupported` is not a reachability alarm and must not be
        worded as one.** The controller answers, the credential is accepted, and what
        is missing is Foyer's confidence that this driver can drive *that version*. On
        the controller-API vendors that is the entire authorization path — UniFi's
        captive-portal authorization has no RADIUS equivalent — so RADIUS keeps
        answering, every access point under it stays reachable, and no guest can be
        let on. Nothing else in this enum covers it, which is why it exists: without
        it the state would show on one column of one screen and behind a dialog nobody
        opens unless they already suspect it.

        Its `params` are `controllerName`, `vendor`, `version` and `minimumVersion`.
        The last is the one that turns a verdict into an instruction, for the reason
        `ControllerProbe.minimumVersion` already gives: an operator told
        *unsupported* has to go and find out what would be supported, and one told
        *9.1.105 or newer* is already fixing it.
      enum:
        - nas-unreachable
        - nas-credentials-expired
        - nas-message-authenticator-refused
        - nas-no-walled-garden
        - nas-no-accounting
        - controller-version-unsupported
        - sessions-orphaned
        - sessions-stale

    Alarm:
      type: object
      required: [id, level, kind]
      properties:
        id: { type: string }
        level: { $ref: "#/components/schemas/AlarmLevel" }
        kind: { $ref: "#/components/schemas/AlarmKind" }
        params:
          type: object
          additionalProperties: true
          description: Structured values the client interpolates into its own copy.
        title:
          type: string
          description: |
            **Optional fallback, for a `kind` an older client does not recognise.**
            Kept so a newer backend can still say something useful to a console that
            predates the kind — and only rendered in that case. A client that has copy
            for the kind must ignore this: two sources for one sentence is how they
            drift, which is the defect this field exists in spite of rather than
            because of.
        detail:
          type: string
          description: Optional fallback. Same rule as `title`.
        subject:
          type: object
          properties:
            kind: { type: string, enum: [nas, controller, session, voucher, account, site] }
            id: { type: string }
            name: { type: string }
        raisedAt: { type: string, format: date-time }

    # ── reports ────────────────────────────────────────────────────────────

    TrendGranularity:
      type: string
      enum: [day, week]
      default: day

    Trends:
      type: object
      description: |
        Per-bucket totals over `[buckets[0].start, buckets[-1].end)`, oldest first,
        with **every bucket present** — a day nothing happened on is a zero, and a
        missing bar would read as a day nobody measured.
      required: [granularity, buckets]
      properties:
        granularity: { $ref: "#/components/schemas/TrendGranularity" }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/TrendBucket" }

    TrendBucket:
      type: object
      required: [start, end, guestDevices, vouchersRedeemed, bytes, bytesLowerBound, bytesFreshness]
      properties:
        start: { type: string, format: date-time }
        end:
          type: string
          format: date-time
          description: Exclusive.
        guestDevices:
          type: integer
          description: |
            **Distinct client devices, not people.** A MAC counts once per bucket if
            it started an accounting session or was granted through the portal in
            it — the union, because the controller-API path leaves grants and no
            accounting while an 802.1X network leaves accounting and no grants.
            A phone presenting a private address per SSID is one device per SSID,
            and a phone that rotated its address mid-week is two in that week.
        vouchersRedeemed:
          type: integer
          description: |
            Vouchers whose `firstUsedAt` falls in the bucket — the rule
            `vouchersRedeemedToday` counts by, over a longer window. A table nobody
            has to sample, so it carries no freshness.
        bytes:
          type: integer
          format: int64
          description: |
            `inputOctetsTotal + outputOctetsTotal` over the accounting sessions that
            **started** in the bucket. `radacct` keeps a session's latest counter and
            no history, so a session is attributed whole to the bucket it began in;
            a guest who stayed past midnight is counted on the day they arrived.

            Sessions that never reported a counter contribute nothing, and on the
            controller-API path there is no accounting at all — so this is a floor on
            the bytes the venue carried, never a meter of them.
        bytesLowerBound:
          type: boolean
          description: |
            At least one counted session has `countersWrapped`, so its total is a
            lower bound (see `Session.inputOctetsTotal`) and so is this. Render it as
            "at least".
        bytesFreshness:
          allOf:
            - $ref: "#/components/schemas/Freshness"
          description: |
            `Metric`'s three clauses, over the rows this bucket's `bytes` counts that
            are **still open** — a closed session's counter is its final report and
            has no sample age. No open row → `live`, dated now. Otherwise `sampledAt`
            is the oldest `lastUpdateAt` (or `startedAt`) among them, `intervalSeconds`
            is the 300-second floor, and `stale` past twice that. An orphaned session
            keeps its bucket `stale` until it is reaped, which is true.

    # ── diagnostics ────────────────────────────────────────────────────────

    AuthSource:
      type: string
      enum: [radius, portal, driver]
      description: |
        Which layer produced this event, and therefore what it is capable of
        knowing.

        `radius` — a `radpostauth` row written by FreeRADIUS. Says an attempt
        happened and whether it was accepted. **Cannot say why it was rejected**, and
        no amount of product work changes that: the stock table has no reason column
        and the reject is decided inside an EAP or PAP exchange Go never sees.

        `portal` — Foyer's own decision on a voucher or a local account. Foyer made
        it, so Foyer knows exactly why.

        `driver` — the NAS driver: presence verification and the authorization call
        itself. A guest can pass every check Foyer owns and still not reach the
        internet because the controller refused, and that failure is invisible from
        both of the other two sources.

    AuthOutcome:
      type: string
      enum: [accepted, rejected]

    AuthEventKind:
      type: string
      description: |
        **A kind, not a sentence.** The client renders the copy from its own
        catalogue; the server sends the kind and its params. This is the same
        decision as for `Alarm` and `Problem` — an event stream is the worst
        possible place to discover that the server has been composing English.

        Note what is deliberately absent: there is **no `radius-reject-because-*`**.
        A `radpostauth` row records `Access-Reject` and nothing else, so inventing a
        reason for it would be the API asserting something it did not observe.

        **`authorize-failed` is the one an operator is most likely to be looking
        for.** Every check Foyer owns passed, the
        voucher was spent, the grant exists — and the controller did not let the
        device on. It is the only record of that anywhere: the audit log cannot hold
        it (an audit entry requires an `actorId`, and the actor here is a guest with
        a voucher, not an operator making a change), and no `radacct` row will ever
        exist for a device that never got on.

        Its `params` say which of two failures it was, because they need different
        people to do different things:

        - `failure: "unreachable"` — nothing answered. The controller is down, or the
          route to it is. `attempts` carries how many times it was asked.
        - `failure: "refused"` — it answered and said no, with `status` carrying the
          HTTP status it answered. `401` and `403` are an expired or revoked API key
          and are an operator's job; `404` is usually the wrong vendor site id.

        **Never the controller's response body and never the URL it was reached at.**
        A controller error body is attacker-influenced text and a controller URL can
        carry a credential in its query string; neither belongs in a log read months
        later by somebody who was not there.
      enum:
        - radius-accept
        - radius-reject
        - voucher-unknown
        - voucher-expired
        - voucher-exhausted
        - voucher-revoked
        - account-unknown
        - account-disabled
        - account-bad-password
        - rate-limited
        - presence-unverified
        - authorize-failed
        - grant-created

    AuthAttempt:
      type: object
      description: |
        One authentication event, from whichever layer saw it.

        **Nothing in this object is ever a credential.** The stock FreeRADIUS 3.2.x
        `post-auth` query inserts `'%{%{User-Password}:-%{Chap-Password}}'` into
        `radpostauth.pass` — the guest's submitted cleartext password, on every
        attempt, accepted or rejected. Foyer generates that query and **must not emit
        the `pass` column at all**; this schema has no field it could be returned in,
        which is the second gate rather than the only one. The same rule the portal
        already enforces on the username echo applies here
        (`docs/rules/security.md`, and the named test in `web/e2e`).
      required: [id, at, source, kind, outcome, siteId]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/AuthSource" }
        kind: { $ref: "#/components/schemas/AuthEventKind" }
        outcome: { $ref: "#/components/schemas/AuthOutcome" }
        siteId: { type: string }
        callingStationId:
          type: [string, "null"]
          description: |
            The client MAC. **Nullable, and it is null more often than anyone
            expects**: the stock `post-auth` query populates only `username`, `pass`,
            `reply` and `authdate`, leaving `CallingStationId` empty even though the
            column exists. Foyer's generated query must populate it, because it is
            the only identifier a café operator has when a guest is standing in front
            of them. Where it is null the row cannot be found by MAC search, and
            `macCoverage` on the envelope is what tells the console to say so.
        calledStationId:
          type: [string, "null"]
          description: Usually the AP MAC and SSID. Same nullability, same cause.
        username:
          type: [string, "null"]
          description: |
            The identity offered, never the credential. For MAC authentication this
            is the MAC; for a local account the username; for 802.1X the **inner**
            identity only (`docs/rules/security.md` §8).
        nasId:
          type: [string, "null"]
          description: |
            Resolved where Foyer can. Null is common and is not an error — a request
            from a source address matching no registered client is exactly the
            symptom of the most common real fault, and it must survive into the UI
            rather than being dropped for failing to join.
        voucherId: { type: [string, "null"] }
        accountId: { type: [string, "null"] }
        params:
          type: object
          additionalProperties: true
          description: Structured values the client interpolates into its own copy.
        detail:
          type: string
          description: |
            Optional server-composed fallback, for a `kind` the client does not
            recognise. A newer backend can still say something useful to an older
            console. Never rendered when the client knows the kind.

    MacCoverage:
      type: string
      enum: [recorded, not-recorded, unknown]
      description: |
        Whether this deployment records the client MAC on authentication attempts at
        all — that is, whether the generated `post-auth` query populates
        `CallingStationId`.

        **Three-valued, and required, for the reason `NasProbe` is.** A console that
        searches by MAC and finds nothing has learned one of two completely different
        things: *this guest never tried*, or *we do not write that column*. Collapsing
        them into an empty list is how an operator concludes a guest is lying.
        `unknown` is a deployment whose data plane has not been inspected — not a
        deployment that records nothing.

        **It covers `source: radius` and nothing else.** The other two streams are
        Foyer's own and always carry the MAC the driver verified, so a `not-recorded`
        deployment still has the address on every `portal` and `driver` row in the
        same list. A console that renders this as one banner over a mixed page is
        stating something true about part of it; the wording has to carry that
        qualifier, and the per-row case inside a `recorded` deployment already has its
        own copy. See `listAuthAttempts`.

    AuthBlindSpot:
      type: object
      description: |
        A way of failing to get online that produces **no row in this stream at
        all**, described so the console can say it out loud on an empty result.

        These are not hypothetical and they are not rare: a wrong shared secret is
        the single most common real cause of *nobody can get online*, and FreeRADIUS
        answers it by dropping the packet. There is no `radpostauth` row, no session,
        and nothing in this API — so the only honest empty state is one that lists
        what it cannot see.
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - shared-secret-mismatch
            - unknown-radius-client
            - never-associated
            - no-radius-configured
            - before-retention
          description: |
            `shared-secret-mismatch` — the device answered but the secret does not
            match, so the packet is discarded before any row is written.
            `unknown-radius-client` — a request from a source address in no
            `clients.conf` entry. On a controller deployment this is the ordinary
            symptom of a newly adopted access point.
            `never-associated` — the guest never reached the access point; nothing
            downstream of the radio ever saw them.
            `no-radius-configured` — a controller-API deployment with no RADIUS at
            all, where this whole stream is empty by design and that is correct.
            `before-retention` — older than what is kept.
        params:
          type: object
          additionalProperties: true

    # ── portal settings ────────────────────────────────────────────────────

    PortalMethod:
      type: string
      enum: [voucher, account, click-through, phone]
      description: |
        Voucher, local account, click-through and phone.

        `phone` sends a six-digit code to a Vietnamese mobile number and needs
        `getPhoneSignIn` configured first; `updatePortalSettings` refuses it otherwise
        with `needs-phone-provider`.

        Social login is out — the CNA keeps no cookies and cannot open windows, which
        is exactly what an OAuth redirect flow needs.

        `click-through` is terms-only access: no credential and no personal data. It
        is the cheapest mode to offer and the one most venues actually want, and it
        is the only one where the consent *is* the authentication — which is why the
        button lives beneath the terms rather than in the list of ways to sign in.

    HeroImage:
      type: object
      description: |
        The venue image as it will actually be served: a same-origin path, and the
        byte count a guest pays for it **on every portal launch**, because Android
        calls `clearCache(true)` each time and the CNA has no persistent store.
      required: [url, bytes, contentType]
      properties:
        url:
          type: string
          description: |
            Same-origin, root-relative. Never an absolute URL — the portal must render
            before the client has internet.
          pattern: "^/[^\\s]*$"
        bytes:
          type: integer
          description: Transfer size. Already-compressed formats are not compressed again.
        contentType: { type: string }
        uploadedAt: { type: string, format: date-time }

    HeroImageUpload:
      type: object
      required: [filename, contentType, dataBase64]
      properties:
        filename: { type: string }
        contentType:
          type: string
          enum: ["image/jpeg", "image/png", "image/webp"]
          description: |
            No SVG. An SVG is a document that can carry script and external
            references, and this one renders on a pre-authentication page — the two
            worst properties to combine. A raster format cannot do either.
        dataBase64:
          type: string
          # ── the byte ceiling, declared once and read by every implementation ──
          #
          # **This is the authority. Nothing may restate it.**
          #
          # Two implementations holding two numbers is the failure this prevents: a
          # console that accepts a photograph and a CI gate that rejects it produces
          # an operator who has done nothing wrong and a build that is red.
          # `tools/check-budget.mjs` enforces the ceiling on the built tree and is
          # the *second* gate; an operator uploading through the console never runs
          # it, so a server more generous than the gate refuses nothing and defers
          # the refusal to CI, after the operator has already succeeded.
          #
          # Declared as an extension rather than as `maxLength` because the ceiling
          # is on the **decoded** bytes: base64 inflates by a third, so a length
          # applied to this string would be a third more generous than the figure
          # that matters, which is the bytes a guest's phone waits for.
          #
          # Go reads this out of the embedded specification (`gen.GetSpecJSON`)
          # rather than copying it, and `web/mock` asserts `IMAGE_MAX_BYTES` against
          # it. `docs/rules/database.md`: derive the stand-in from what it stands
          # in for — a second hand-maintained copy is how two figures drift apart.
          x-max-decoded-bytes: 5242880
          description: |
            The image, base64-encoded. **The ceiling is on the decoded bytes and is
            5 242 880 (5 MiB)** — declared machine-readably beside this field as
            `x-max-decoded-bytes` so that no implementation has to restate it.

            **A deliberate trade, against the measurement below:**
            a 5 MiB photograph is paid by a guest on an unauthenticated link, on
            every portal launch — Android clears the cache each time — and the CNA
            window it never renders in is 900 × 512. It is stored and served as
            submitted; nothing downscales it. The 89,697 B figure below is the
            cost a venue *should* pay, kept so the next reader knows what was
            traded away.

            It traces to a measurement rather than a preference: a real photograph
            downscaled to 900 px, the macOS CNA's full window width, is 89,697 B at
            JPEG q70 (`docs/protocol-reality.md`). The headroom above that is what a
            less compressible image gets; the ceiling is what stops the welcome page
            waiting.

    PortalSettings:
      type: object
      description: |
        **The writable twin of `PortalContext`.** Every field a guest sees — the
        venue name, the logo, the terms and the sign-in methods — is set here.

        `PortalContext` stays as it is and remains the guest-facing read: it is
        resolved, language-negotiated and served pre-authentication, and it must not
        grow admin-shaped fields. This is the operator's view of the same facts.
      required: [siteId, venueName, languages, methods, terms, design]
      properties:
        siteId: { type: string }
        portalUrl:
          type: [string, "null"]
          description: |
            Where this site's portal is actually served, so the console can show an
            operator what a guest sees.

            **Sent by the server because only the server knows it.** The admin and the
            portal are separate listeners by requirement (`docs/rules/security.md`
            §7) and the portal's hostname is a deployment fact — an origin the console
            constructs or hardcodes is right in development and wrong everywhere else,
            which is the worst place for a preview to be wrong because the preview is
            the thing an operator trusts instead of testing.
        venueName: { type: string }
        networkName:
          type: [string, "null"]
          description: The SSID as the guest sees it printed, not as the NAS reports it.
        logoDataUri:
          type: [string, "null"]
          description: |
            **Inlined on purpose.** A logo is a few kB of flat colour, it belongs in
            the first paint, and a data URI costs one fewer round trip on the worst
            link of the guest's day. It lands inside the document, so every byte is
            paid on every portal launch before the guest sees a word — which is why
            `logoMaxBytes` exists, and the server enforces it rather than leaving it
            to TypeScript. The ceiling (512 000 decoded bytes) is on
            `PortalSettingsUpdate.logoDataUri`, which is where it refuses things.

            A photograph must **not** go here. See `putPortalHeroImage`.
        heroImage:
          oneOf:
            - $ref: "#/components/schemas/HeroImage"
            - type: "null"
        languages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Language" }
          description: |
            What this venue advertises. A venue advertising one language renders no
            switcher at all — the same rule the admin follows for driver
            capabilities: a control for a choice that does not exist is a control
            that lies.
        methods:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PortalMethod" }
          description: |
            The ways this venue lets a guest on — any of voucher, local account,
            click-through and phone (a code sent by SMS; see `PortalMethod`).
        clickThroughMinutes:
          type: [integer, "null"]
          minimum: 1
          description: |
            How long a click-through guest is granted, in minutes.

            **Required in practice whenever `click-through` is offered**, and the
            server refuses the combination without it: a mode with no credential and
            no duration is unmetered public internet handed out on one tap, which is
            a decision a venue should make deliberately rather than inherit from a
            default. Null where the method is not offered.
        terms:
          type: object
          required: [summary]
          properties:
            summary:
              type: object
              additionalProperties: { type: string }
              description: |
                Language code to the venue's terms in that language. The resolution
                order is on `PortalContext.terms` and is implemented identically
                here, in the portal, and by the backend wherever it renders terms.

                **Foyer's consent sentence is not in here and cannot be put in
                here.** It is rendered unconditionally beneath whatever resolves, and
                it says the captive portal is a billing and consent boundary rather
                than a security one (`docs/rules/security.md` §6). Venue terms
                replace the default terms, never this sentence.
        design:
          $ref: "#/components/schemas/PortalDesign"
        budgets:
          type: object
          description: |
            **The cost of this configuration, sent by the server rather than computed
            by the client.** Two clients computing a byte budget is one client
            computing it wrongly, and the number decides whether a guest on a
            just-associated device sees a page or a spinner.

            **Each of these three figures is declared once, in this document, and
            read from it.** None of them is stored, because none of them is a fact
            about a site — they are the shape of the product, and a per-site copy
            would be a row that can disagree with the gate that enforces it. Two of
            them are ceilings and sit beside the field they bound, as
            `x-max-decoded-bytes`; the third bounds no field at all and is declared
            here, where it is reported. The server reads all three out of the
            specification it was generated from rather than restating them
            (`docs/rules/database.md` — derive the stand-in from what it stands in
            for).
          required: [logoMaxBytes, imageMaxBytes, codeBudgetBytes]
          properties:
            logoMaxBytes:
              type: integer
              description: |
                Decoded size of `logoDataUri`. It is spent from the code budget.

                **Reported here, declared and enforced on
                `PortalSettingsUpdate.logoDataUri`** as `x-max-decoded-bytes`. This
                property carries no figure of its own on purpose: a number a server
                reports and a number a server enforces that are written in two places
                are two numbers, and the operator finds out which is which by having
                an upload accepted and a build go red.
            imageMaxBytes:
              type: integer
              description: |
                Transfer size of `heroImage`, budgeted separately.

                **Reported here, declared and enforced on
                `HeroImageUpload.dataBase64`** as `x-max-decoded-bytes`, for the same
                reason as `logoMaxBytes`.
            codeBudgetBytes:
              # The one figure with nowhere else to live. It is not a ceiling on any
              # request — no call to this API can violate it — so there is no field
              # to hang `x-max-decoded-bytes` on, and it is declared beside the place
              # it is reported instead.
              #
              # `web/tools/check-budget.mjs` is what enforces it, on the built portal,
              # and it holds its own copy of `50 * 1024`. Neither that copy nor
              # `web/contract/src/index.ts`'s `CODE_BUDGET_BYTES` is checked against
              # this, unlike `IMAGE_MAX_BYTES`, which is checked against
              # `HeroImageUpload.dataBase64`.
              x-budget-bytes: 51200
              type: integer
              description: |
                The portal's own bytes for one page view — HTML plus any CSS or JS it
                references, gzipped. **51 200**, declared machine-readably beside this
                property as `x-budget-bytes`.

                One page view rather than one file, because Android calls
                `clearCache(true)` on every portal launch and the iOS CNA has no
                persistent store: there is no warm second load to amortise anything
                against. `logoDataUri` lands *inside* the document, so it is spent
                from this budget rather than from `imageMaxBytes`.

    PortalSettingsUpdate:
      type: object
      description: Partial. Omitted is unchanged; explicit `null` clears where allowed.
      properties:
        venueName: { type: string }
        networkName: { type: [string, "null"] }
        logoDataUri:
          type: [string, "null"]
          # The logo's ceiling, declared where it is enforced and nowhere else.
          #
          # 512 000 (500 kB) is a deliberate trade against the reasoning below — a
          # data URI is *inside* the document, so 500 kB is ten times the 50 kB code
          # budget, paid on every portal launch before the guest sees a word. That
          # tradeoff is recorded rather than re-argued here.
          #
          # A figure that lived only in `LOGO_MAX_BYTES` in
          # `web/contract/src/index.ts` would sit on the side of the seam that cannot
          # bind a server, and the console would size the upload against a limit
          # nothing downstream applied.
          #
          # Beside the field rather than on `PortalSettings.budgets.logoMaxBytes`,
          # for the reason `HeroImageUpload.dataBase64` is the home of the image's:
          # a ceiling belongs where the value it refuses arrives.
          x-max-decoded-bytes: 512000
          description: |
            The venue's logo, inline. **The ceiling is on the decoded bytes and is
            512 000 (500 kB)** — declared machine-readably beside this field as
            `x-max-decoded-bytes` so that no implementation has to restate it, and
            reported to the console as `PortalSettings.budgets.logoMaxBytes`.

            **A deliberate trade.** A data URI is *inside* the document, so a logo
            at the ceiling is ten times the 50 kB code budget, paid on every portal
            launch — Android clears the cache each time — before the guest sees a
            word. The ceiling refuses the unreasonable; it is not a target, and a
            few kB of flat colour is what a logo should cost. A photograph belongs in
            `putPortalHeroImage`, which is linked, budgeted separately and arrives
            after the page renders.

            Over the ceiling is `413` with `/problems/too-large`, carrying `bytes`
            and `limitBytes`, the same refusal `putPortalHeroImage` makes.
        languages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Language" }
        methods:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PortalMethod" }
          description: |
            Any of voucher, local account, click-through and phone. `phone` is
            refused with `needs-phone-provider` until `getPhoneSignIn` is configured.
        clickThroughMinutes:
          type: [integer, "null"]
          minimum: 1
          description: |
            How long a click-through guest is granted, in minutes.

            **Required in practice whenever `click-through` is offered**, and the
            server refuses the combination without it: a mode with no credential and
            no duration is unmetered public internet handed out on one tap, which is
            a decision a venue should make deliberately rather than inherit from a
            default. Null where the method is not offered.
        terms:
          type: object
          properties:
            summary:
              type: object
              additionalProperties: { type: string }
        design:
          $ref: "#/components/schemas/PortalDesign"
          description: |
            The whole page design, replaced as one value. Partial updates of a block
            list are how two tabs lose each other's edits; a design is small enough
            to send whole, and the console always holds all of it.

    # ── phone sign-in ──────────────────────────────────────────────────────

    PhoneSignInProvider:
      type: string
      enum: [esms-sms, esms-zalo]
      description: |
        How codes reach a guest's phone. Both go through **eSMS.vn**, one account and
        one pair of keys: `esms-sms` sends an SMS from the venue's registered
        brandname (CSKH, `SmsType 2`), `esms-zalo` sends a Zalo ZNS template message
        from the venue's Official Account. Vietnamese carriers deliver brandname
        messages only for **pre-registered templates**, so `messageTemplate` must be
        the template the provider approved, character for character.

        **UNVERIFIED against the live provider**: the adapter is written from eSMS's
        published API and exercised against a fake of it; no message has been sent
        through a real account.

    PhoneSignInLimits:
      type: object
      description: |
        The abuse limits in force at this venue, reported so the console can state
        them. Tunable within bounds through `updatePhoneAbuseControls` and never off:
        they are the product's defence against SMS toll fraud rather than a venue
        preference (`docs/rules/security.md` §9).
      required: [perNumberPerHour, perNumberPerDay, perDevicePerHour, perAddressPerHour, codeMinutes, maxAttempts]
      properties:
        perNumberPerHour: { type: integer }
        perNumberPerDay: { type: integer }
        perDevicePerHour: { type: integer }
        perAddressPerHour: { type: integer }
        codeMinutes: { type: integer }
        maxAttempts: { type: integer }

    PhoneSignIn:
      type: object
      description: |
        The operator's view of phone sign-in for one site. `provider: null` means it
        has never been configured, and `phone` cannot then be offered in
        `PortalSettings.methods`.
      required: [siteId, provider, credentialsSet, sandbox, dailyLimit, sentToday, sessionMinutes, messageTemplate, country, limits]
      properties:
        siteId: { type: string }
        provider:
          oneOf:
            - $ref: "#/components/schemas/PhoneSignInProvider"
            - type: "null"
        brandname:
          type: [string, "null"]
          description: The registered sender name an SMS shows. `esms-sms` only.
        zaloOaId:
          type: [string, "null"]
          description: The Zalo Official Account id. `esms-zalo` only.
        zaloTemplateId:
          type: [string, "null"]
          description: The approved ZNS template, which takes one parameter, `otp`. `esms-zalo` only.
        credentialsSet:
          type: boolean
          description: Whether an API key and secret key are stored. Never the keys.
        sandbox:
          type: boolean
          description: Send through the provider's test mode, which delivers nothing.
        dailyLimit:
          type: [integer, "null"]
          minimum: 1
          description: |
            Messages this site may send per calendar day — the SMS cost ceiling.
            Null until configured: there is no default ceiling to report.
        sentToday:
          type: integer
          description: Messages counted against today's ceiling so far.
        sessionMinutes:
          type: [integer, "null"]
          minimum: 1
          description: How long a guest who signed in with their phone is granted. Null until configured.
        messageTemplate:
          type: [string, "null"]
          description: The message text, with `{code}` where the code goes. Null until configured.
        country:
          type: string
          enum: [VN]
          description: |
            The destination allowlist. Only Vietnamese mobile numbers receive codes,
            which is the default §9 asks for — the install's own country — and the
            single most effective defence against premium-rate number pumping.
            `getPhoneAbuseControls` says which of its mobile ranges are open.
        limits:
          $ref: "#/components/schemas/PhoneSignInLimits"

    PhoneSignInUpdate:
      type: object
      required: [provider, dailyLimit, sessionMinutes, messageTemplate]
      properties:
        provider: { $ref: "#/components/schemas/PhoneSignInProvider" }
        brandname: { type: [string, "null"], maxLength: 11 }
        zaloOaId: { type: [string, "null"], maxLength: 64 }
        zaloTemplateId: { type: [string, "null"], maxLength: 64 }
        apiKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Write-only. Omitted is unchanged.
        secretKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Write-only. Omitted is unchanged.
        sandbox: { type: boolean }
        dailyLimit: { type: integer, minimum: 1, maximum: 100000 }
        sessionMinutes: { type: integer, minimum: 1, maximum: 10080 }
        messageTemplate:
          type: string
          minLength: 6
          maxLength: 320
          description: |
            Must contain `{code}` exactly once — refused with
            `missing-code-placeholder` otherwise. For `esms-sms` it must match the
            brandname template the provider registered.

    PhoneMobilePrefix:
      type: string
      pattern: "^0[35789]$"
      description: |
        A Vietnamese mobile range by its leading digits in the national form: `03`,
        `05`, `07`, `08` or `09` — the post-2018 ten-digit mobile plan. Landlines
        (`02x`) cannot receive an SMS and are not a member.

    PhoneAbuseControls:
      type: object
      description: |
        The abuse limits phone sign-in enforces at one venue, and the ranges it sends
        to. Read by every `requestPhoneCode` and `verifyPhoneCode`, so a change applies
        to the next code requested.
      required: [siteId, limits, bounds, mobilePrefixes, country, customised]
      properties:
        siteId: { type: string }
        limits: { $ref: "#/components/schemas/PhoneSignInLimits" }
        bounds: { $ref: "#/components/schemas/PhoneAbuseLimitBounds" }
        mobilePrefixes:
          type: array
          items: { $ref: "#/components/schemas/PhoneMobilePrefix" }
          description: The mobile ranges a code may be sent to. Every other number is refused `phone-invalid`.
        country:
          type: string
          enum: [VN]
          description: The one country codes are sent to. Not settable.
        customised:
          type: boolean
          description: False while no operator has changed the product defaults.
        updatedAt:
          type: [string, "null"]
          format: date-time

    PhoneAbuseLimitBounds:
      type: object
      description: |
        Each limit's range and product default. The ranges are `PhoneAbuseLimitsUpdate`'s
        own, read by the server from this contract, so the console never restates them;
        the defaults are the ones `internal/identity/otp` enforces until an operator saves.
      required: [perNumberPerHour, perNumberPerDay, perDevicePerHour, perAddressPerHour, codeMinutes, maxAttempts]
      properties:
        perNumberPerHour: { $ref: "#/components/schemas/NetworkBound" }
        perNumberPerDay: { $ref: "#/components/schemas/NetworkBound" }
        perDevicePerHour: { $ref: "#/components/schemas/NetworkBound" }
        perAddressPerHour: { $ref: "#/components/schemas/NetworkBound" }
        codeMinutes: { $ref: "#/components/schemas/NetworkBound" }
        maxAttempts: { $ref: "#/components/schemas/NetworkBound" }

    PhoneAbuseLimitsUpdate:
      type: object
      description: |
        Every limit, each bounded. The bounds are the product's and are enforced in the
        database as well; there is no *unlimited*.
      required: [perNumberPerHour, perNumberPerDay, perDevicePerHour, perAddressPerHour, codeMinutes, maxAttempts]
      properties:
        perNumberPerHour: { type: integer, minimum: 1, maximum: 10 }
        perNumberPerDay: { type: integer, minimum: 1, maximum: 20 }
        perDevicePerHour: { type: integer, minimum: 1, maximum: 20 }
        perAddressPerHour:
          type: integer
          minimum: 1
          maximum: 2000
          description: |
            Codes an hour from one client address. Raise it where every guest reaches
            the portal through one NAT or proxy address.
        codeMinutes: { type: integer, minimum: 1, maximum: 10 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }

    PhoneAbuseControlsUpdate:
      type: object
      required: [limits, mobilePrefixes]
      properties:
        limits: { $ref: "#/components/schemas/PhoneAbuseLimitsUpdate" }
        mobilePrefixes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: "#/components/schemas/PhoneMobilePrefix" }

    PhoneTestMessageRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          maxLength: 32
          description: The operator's own number, spelled any way `requestPhoneCode` accepts.
          example: "0912 345 678"

    PhoneTestMessageOutcome:
      type: string
      enum: [sent, phone-invalid, not-configured, ceiling-reached, provider-refused, provider-unreachable]
      description: |
        `sent` — the provider accepted the message; whether the handset received it
        is what the operator is checking. `phone-invalid` — not a number in
        `mobilePrefixes`. `not-configured` — no provider is saved, or its keys cannot
        be unsealed. `ceiling-reached` — the site's or the deployment's daily cap is
        spent, or could not be counted. `provider-refused` — the provider answered and
        said no (wrong keys, template not registered, balance exhausted);
        `providerCode` says which. `provider-unreachable` — no answer.

    PhoneTestMessageResult:
      type: object
      required: [outcome, sentToday]
      properties:
        outcome: { $ref: "#/components/schemas/PhoneTestMessageOutcome" }
        providerCode:
          type: [string, "null"]
          maxLength: 16
          description: The provider's result code on `provider-refused`. Never its free text.
        sentToday:
          type: integer
          minimum: 0
          description: This site's count against today's ceiling, after this message.

    PhoneSpendCap:
      type: object
      required: [dailyLimit, bounds]
      properties:
        bounds:
          type: object
          description: The range `updatePhoneSpendCap` accepts, read by the server from this contract.
          required: [minimum, maximum]
          properties:
            minimum: { type: integer }
            maximum: { type: integer }
        dailyLimit:
          type: [integer, "null"]
          minimum: 1
          description: Messages the deployment may send per day across every site. Null is no deployment-wide cap.
        updatedAt:
          type: [string, "null"]
          format: date-time

    PhoneSpendCapUpdate:
      type: object
      required: [dailyLimit]
      properties:
        dailyLimit:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000

    # ── the guest network's Wi-Fi password, for the voucher slip ───────────

    GuestWifiKeyStatus:
      type: object
      description: Whether a passphrase is stored, and when. Never the passphrase.
      required: [set, updatedAt, updatedBy]
      properties:
        set: { type: boolean }
        updatedAt: { type: [string, "null"], format: date-time }
        updatedBy: { type: [string, "null"] }

    GuestWifiKeyUpdate:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: [string, "null"]
          format: password
          writeOnly: true
          description: |
            Write-only. 8–63 printable ASCII characters, or null to clear. Checked by
            the server (`not-a-wifi-passphrase`) rather than by a `pattern` here, so
            the refusal names the fault the console has words for.

    VoucherSlipWifi:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: [string, "null"]
          description: The guest network's WPA passphrase, or null for an open network.

    # ── portal page design ─────────────────────────────────────────────────

    PortalDesign:
      type: object
      description: |
        **What a venue says to its guests, as opposed to how they sign in.** The
        settings above answer *who is this and how do I get on*; this answers *what
        does the venue want a guest to read* — the welcome line, today's offer, the
        menu, the breakfast hours, the Facebook page — and it is edited by the
        person who runs the café, not by whoever installed the network.

        **Blocks, not HTML.** Every captive-portal product that lets a non-technical
        owner build a page (Meraki, UniFi, Purple, Social WiFi, Spotipo) gives them
        a fixed set of content blocks rather than markup, and the reason here is
        sharper than ease of use: this page is served *before authentication* to
        anyone within radio range, so venue-authored markup would be stored XSS on a
        page a guest has just been asked to trust. Every string below is text, and
        every renderer escapes it.

        **Links only after sign-in.** Before the guest is authorised the only
        origin their phone can reach is the portal's own, so a link to Facebook on
        the welcome page is a button that spins and fails — the same reason there
        is no `terms.url` (see `PortalContext.terms`). `button` and `social`
        blocks are therefore refused anywhere but `connected`, with
        `link-before-sign-in` — the one placement where the guest has internet and
        a link is a link.

        **And `connected` is best-effort, which the console must say.** Android
        destroys the login WebView the instant the network validates
        (`docs/rules/frontend.md`), so many Android guests never see the
        connected page at all. Nothing a guest *must* read may be placed there;
        a review link or a Facebook page may.

        The renderer drops a block that is hidden, outside its dates, or has no
        text in any language. It never invents text for one.
      required: [accent, headline, blocks]
      properties:
        accent:
          type: [string, "null"]
          pattern: "^#[0-9a-f]{6}$"
          description: |
            The venue's brand colour, lowercase `#rrggbb`. Null is Foyer's own teal.

            **An operator picks a colour, not a contrast ratio.** The renderer
            derives the shade it actually paints — darkened on the light page,
            lightened on the dark one — until text in it and text on it both clear
            WCAG AA (4.5:1), so a pale yellow brand still produces a legible button.
            The derivation is identical in both renderers and is pinned by shared
            test vectors (`web/portal/src/theme.vectors.json`).
        headline:
          $ref: "#/components/schemas/PortalLocalisedLine"
        blocks:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/PortalBlock" }
          description: |
            In the order they are shown. Twelve at most: every block on the welcome
            page is paid for on every launch, on the guest's worst connection, and a
            page that needs more than twelve is a website.

    PortalLocalisedLine:
      type: object
      description: |
        A short line per language — the welcome page's big heading. An absent or
        blank language falls back to the venue's other language (marked with that
        language), then to the portal's own "Get online". The terms resolution
        order, applied to marketing text.
      properties:
        en: { type: string, maxLength: 60 }
        vi: { type: string, maxLength: 60 }

    PortalBlockKind:
      type: string
      enum: [text, offer, list, notice, button, social]
      description: |
        - `text` — a heading and a paragraph. A welcome, a story, the rules of the house.
        - `offer` — a promotion, optionally with a code to show at the counter.
        - `list` — label/value rows. A menu with prices, opening hours, an agenda.
        - `notice` — one short highlighted line, shown **above** the sign-in
          choices on the welcome page. Every other kind sits below them, because
          a guest who cannot find how to get online reads nothing else.
        - `button` — one link, after sign-in only.
        - `social` — the venue's pages (Facebook, Zalo, Google review…), after sign-in only.

    PortalBlockPlacement:
      type: string
      enum: [welcome, connected]
      description: |
        `welcome` is before sign-in, `connected` is the page a guest lands on once
        online. `button` and `social` are only valid on `connected`.

    PortalBlock:
      type: object
      required: [id, kind, placement, visible, content]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9-]{1,40}$"
          description: Unique within the design. The console makes it; nothing else reads it.
        kind: { $ref: "#/components/schemas/PortalBlockKind" }
        placement: { $ref: "#/components/schemas/PortalBlockPlacement" }
        visible:
          type: boolean
          description: A switch the owner flips without deleting what they wrote.
        startsOn:
          type: [string, "null"]
          format: date
          description: |
            First day shown, inclusive, in the site's local date (`getSiteTimeZone`). A campaign
            that starts on the 1st is written once and appears on the 1st.
        endsOn:
          type: [string, "null"]
          format: date
          description: Last day shown, inclusive. Refused if before `startsOn` (`ends-before-start`).
        code:
          type: [string, "null"]
          maxLength: 24
          description: An `offer`'s code, shown large. Codes are not translated.
        url:
          type: [string, "null"]
          maxLength: 500
          description: |
            A `button`'s destination: `https://`, `http://` or `tel:`. Anything else
            is refused with `not-a-link` — this lands in an `href`. Not `mailto:`,
            which Android's captive-portal WebView hard-blocks.
        links:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/PortalSocialLink" }
          description: A `social` block's pages, in the order shown.
        content:
          type: object
          description: The block's words, per language. The fallback is `PortalLocalisedLine`'s.
          properties:
            en: { $ref: "#/components/schemas/PortalBlockText" }
            vi: { $ref: "#/components/schemas/PortalBlockText" }

    PortalBlockText:
      type: object
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 500 }
        label:
          type: string
          maxLength: 40
          description: A `button`'s caption.
        items:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label]
            properties:
              label: { type: string, maxLength: 60 }
              value: { type: string, maxLength: 30 }

    PortalSocialNetwork:
      type: string
      enum: [facebook, instagram, tiktok, zalo, youtube, google-review, website, phone]
      description: |
        No `email`: `mailto:` is hard-blocked in Android's captive-portal WebView
        (`docs/rules/frontend.md`), and `tel:` is the only non-http scheme that
        opens from it.

    PortalSocialLink:
      type: object
      required: [network, url]
      properties:
        network: { $ref: "#/components/schemas/PortalSocialNetwork" }
        url:
          type: string
          maxLength: 500
          description: Same rule as `PortalBlock.url`.

    # ── walled garden ──────────────────────────────────────────────────────

    GardenEntryKind:
      type: string
      enum: [fqdn, ip-range]
      description: |
        `fqdn` — matched by name, via SNI. One allowance means one destination.
        `ip-range` — matched by address. **Materially weaker**, and the weakness is
        not a matter of degree: a CDN address range hosts arbitrary customers, so an
        entry meant to allow one service allows everything else behind the same
        edge. Available only where no device in the site can do FQDN/SNI.

    GardenEntryOrigin:
      type: string
      enum: [required, operator]
      description: |
        `required` — Foyer's own, and not removable: the portal's FQDN, its
        certificate chain's OCSP/CRL endpoints, and the RFC 8908 endpoint. Without
        them the portal cannot serve itself and the failure presents to a guest as a
        broken network rather than as a misconfiguration.
        `operator` — added by an operator, and theirs to remove.

    GardenEntry:
      type: object
      required: [id, siteId, kind, value, origin, createdAt]
      properties:
        id: { type: string }
        siteId: { type: string }
        kind: { $ref: "#/components/schemas/GardenEntryKind" }
        value:
          type: string
          description: A hostname for `fqdn`, a CIDR for `ip-range`.
        note: { type: string }
        origin: { $ref: "#/components/schemas/GardenEntryOrigin" }
        createdAt: { type: string, format: date-time }

    GardenEntryCreate:
      type: object
      required: [kind, value]
      properties:
        kind: { $ref: "#/components/schemas/GardenEntryKind" }
        value: { type: string }
        note: { type: string }

    GardenDriverCoverage:
      type: object
      description: |
        One device in the site, and what it can do with this garden. Present so the
        console can render *which* devices ignore an entry rather than a single
        site-wide verdict that is true of neither.
      required: [nasId, name, walledGarden]
      properties:
        nasId: { type: string }
        name: { type: string }
        walledGarden: { $ref: "#/components/schemas/GardenKind" }

    WalledGarden:
      type: object
      description: |
        **The entries and their reach, in one response.** Two separate reads would
        let a console render an entry list with no statement about whether anything
        honours it, and a garden nothing honours looks identical to one that works.
      required: [siteId, entries, drivers, effectiveKind]
      properties:
        siteId: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/GardenEntry" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/GardenDriverCoverage" }
        effectiveKind:
          $ref: "#/components/schemas/GardenKind"
          description: |
            The **weakest** garden any device in the site can enforce, which is the
            one that decides what a guest behind that device can actually reach.
            Deliberately not the strongest and not an average: a site is only as
            enclosed as its most permissive device, and reporting the best case is
            how an operator concludes a garden is protecting something it is not.

    # ── portal ─────────────────────────────────────────────────────────────

    PortalContext:
      type: object
      required: [venueName, methods, languages, terms]
      properties:
        venueName: { type: string }
        networkName: { type: [string, "null"] }
        logoDataUri:
          type: [string, "null"]
          description: |
            A data URI, never a **remote** URL. The portal must render before the
            client has internet, and an external resource would also have to be added
            to the walled garden on every driver.

            **That reason does not extend to same-origin assets**: it rules out an
            external origin, not a linked asset. The portal's own FQDN is already required
            to be inside the garden or the portal cannot serve itself
            (`docs/rules/security.md` §5), so an asset it serves itself is
            reachable by construction. A logo stays inlined because it is a few kB of
            flat colour that belongs in the first paint; a photograph must not be —
            see `heroImageUrl`.
        heroImageUrl:
          type: [string, "null"]
          description: |
            The venue's photograph, as a **same-origin path the portal serves
            itself** — never a data URI and never another origin.

            Measured, and the measurement is the whole argument: a real photograph
            downscaled to 900 px, the macOS CNA's full window width, is 89,697 B at
            JPEG q70. Base64 inflates it by a third and gzip gives back exactly that,
            so as a data URI it costs *more than the raw file* and lands at 1.75× the
            entire document budget. Inlined, the guest waits for the whole photograph
            before seeing a word; linked, the document renders at 4 kB and the image
            arrives after — which is the right order on a link with no default route.

            The path is same-origin because the portal's FQDN is already inside the
            walled garden by requirement. `docs/rules/security.md` §5,
            `docs/protocol-reality.md`.
          pattern: "^/[^\\s]*$"
        methods:
          type: array
          items: { type: string, enum: [voucher, account, click-through, phone] }
          description: |
            Voucher, local account, click-through and phone code. Social login is out: the CNA
            keeps no cookies and cannot open windows, which is exactly what an OAuth
            redirect flow needs.
        languages:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        terms:
          type: object
          description: |
            Rendered on the welcome page, before authentication — never in a modal
            and never afterwards. A modal is not a navigation, and after
            authorization the window may already be gone.

            Both members are keyed by language code, because a venue with foreign
            guests has to be able to supply its terms in more than one language and
            a single unkeyed string forces it to pick one. Terms are legal text: the
            portal never paraphrases them, never machine-translates them, and never
            silently substitutes one language for another.

            **Resolution order. The portal implements this and so does the backend
            wherever it renders terms itself:**

            1. The venue's text for the language being read, if it supplied one.
            2. Otherwise the venue's text in any other language it did supply,
               rendered with a `lang` attribute naming *that* language. Showing
               Vietnamese terms to an English reader is bad; showing no terms at all
               is worse. The `lang` attribute is what lets a screen reader and a
               browser's translation offer do the right thing with text the portal
               itself must leave alone.
            3. Otherwise the portal's own catalogue default, in the language being
               read. This is what keeps the billing-and-consent-boundary sentence on
               screen in a deployment that never configured terms.

            **There is deliberately no `url` member, and it must not be re-added.**
            A per-language link to the venue's full terms is the obvious addition;
            the reasoning is recorded here so it is not helpfully added by somebody
            who only sees a missing feature:

              - A link is only reachable pre-auth if the venue's FQDN is inside the
                walled garden. A driver with `WalledGarden: none` cannot put it
                there at all, and an `ip-range` driver can only do it in the
                degraded CDN-range form `docs/rules/security.md` §5 forbids —
                "allow the terms host" becomes "allow a general-purpose HTTPS
                tunnel". The portal cannot know which driver the guest is behind,
                so the honest rendering is a link that dies for an unknowable share
                of guests, on the one screen where a dead link reads as "the portal
                is broken".
              - The portal has no separate terms page for the same reason a link
                fails: the iOS CNA has no tabs, so following
                one replaces the portal view; the Android login WebView has no back
                affordance because `setSupportMultipleWindows` is never called; and
                leaving the CNA can destroy the session outright.

            A venue with more to say than fits here says it in `summary`. If a
            future driver can prove FQDN/SNI garden membership for an arbitrary
            host *and* the client environment can survive the navigation, that is
            the evidence that would reopen this — not the absence of the field.
          properties:
            summary:
              type: object
              additionalProperties: { type: string }
              description: |
                Language code from `Language` to the venue's terms text in that
                language. An absent or empty map means the venue configured none.
              example: { en: "Internet access is provided as is.", vi: "Truy cập Internet được cung cấp nguyên trạng." }
        design:
          $ref: "#/components/schemas/PortalDesign"
          description: |
            The venue's page, **narrowed for a guest**: hidden blocks are not sent
            and neither are blocks outside their dates, so a promotion an owner
            switched off is not readable pre-authentication by anyone who asks.
            Sent whenever the venue has settings, empty (`accent: null`, no
            blocks) on one that never designed a page — both servers do, and a
            client treats an absent member the same way.
        dataCollection:
          $ref: "#/components/schemas/PortalDataCollection"
          description: |
            What the sign-in forms ask for. Absent is the same as
            no fields and no consent checkbox.
        phoneCodeMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
          description: |
            How long a phone sign-in code works at this venue, in minutes — the
            `codeMinutes` of the venue's abuse controls (`PhoneSignInLimits`), which
            an administrator tunes between 1 and 10. Present where the venue offers
            `phone`, null or absent elsewhere.

            It is here because the code form tells the guest how long they have, and
            the lifetime is configurable. A guest told five
            minutes by a venue that set two reads the expiry as the portal breaking.
            A client with no value renders the product default, five.

    PortalStatus:
      type: object
      required: [state, plan]
      properties:
        state:
          type: string
          enum: [connected, expired, revoked, not-on-network]
          description: |
            **`not-on-network` is the guest-facing half of a failure that would
            otherwise be answered `connected`.**

            The authenticating operations answer `303` and ask the NAS to
            authorize the client **after** the response is written, because Android
            destroys the login WebView the instant the network validates. That
            ordering is not negotiable, and its price is that the guest is already
            reading the connected page when the controller call runs. When that call
            fails — the controller is restarting, or its API key expired — the grant
            is real, the voucher is spent, and **no packet of the guest's will leave
            the access point.** Answering `connected` there is the product telling
            somebody they succeeded while they stand in a café with no internet.

            The other three states are about the **grant**: `expired` is the clock
            passing a number, `revoked` is an operator's act. This one is about the
            **network**, which is why it is worth a member rather than a flag: the
            portal picks one sentence from `state`, and a fourth situation needs a
            fourth sentence.

            It is not produced while the authorization is still in flight. The status
            read and the driver call race by construction — the redirect is flushed
            first — and *nothing has failed yet* must not render as *this failed*. A
            grant nothing has reported on stays `connected`.

            The operator-facing half is not here: it is an `AuthAttempt` with
            `source: driver` and `kind: authorize-failed`, which `listAuthAttempts`
            returns.
        plan: { $ref: "#/components/schemas/Plan" }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        venueName: { type: string }
        originalUrl:
          type: [string, "null"]
          # http or https, an authority containing no `@`, and no whitespace. That
          # rejects every shape the prose asks against: `javascript:`,
          # `data:`, the protocol-relative `//evil.example`, and the userinfo form
          # `http://portal.example@evil.example` whose visible prefix is the thing a
          # guest is most likely to read as the destination.
          pattern: "^https?://[^/?#@\\s]+(?:[/?#][^\\s]*)?$"
          maxLength: 2048
          description: |
            Where the client was going, from the NAS redirect — so it is unsigned and
            attacker-controlled at source (`docs/protocol-reality.md`, UniFi redirect
            parameters). Rendered as a link the guest chooses to follow, never an
            automatic bounce: the victim of an open redirect here is on an untrusted
            network, expects to be redirected, and has just typed credentials.

            **The `pattern` above is the point of this field's declaration.** An
            allowlist kept only in this description and in a server-side helper would
            be invisible to runtime contract validation — a defence enforced by
            discipline rather than mechanically. It is three gates: the server allowlists
            before answering, this schema rejects a response that got it wrong, and
            the portal parses once more at the point where the value becomes an
            `href`. The pattern does not replace either of the others; a regex is a
            shape test and `URL` is a parser, and the browser uses a parser.

    # ── guest data and marketing consent ─────────────────────────────────────

    GuestDataField:
      type: string
      enum: [name, phone, email]
      description: |
        What a venue may ask a guest for. **Three, and deliberately no free-form
        field**: a venue that can invent a field can ask for a national ID number on
        a café's Wi-Fi, and minimisation (Law 91/2025/QH15; GDPR Article 5(1)(c)) is
        easier to keep as a closed list than as advice. Purple's own default form is
        name and e-mail. A field added here is a column in `guest_details` and
        `marketing_consents`, registered with how it is erased.

    GuestDataFieldSetting:
      type: object
      required: [field, required]
      additionalProperties: false
      properties:
        field: { $ref: "#/components/schemas/GuestDataField" }
        required:
          type: boolean
          description: |
            True: a guest who leaves it blank is not let on, and is told so beside
            the form. False: offered and skippable. **Optional unless the venue
            chooses otherwise** — the rule, and the default here.

    ConsentText:
      type: object
      additionalProperties: false
      description: |
        The consent sentence per language, verbatim. Resolved like the terms: the
        language being read, else another the venue supplied (marked with its
        `lang`), else — because there is no catalogue default for a promise only the
        venue can make — the checkbox is not shown at all.
      properties:
        en: { type: string, maxLength: 500 }
        vi: { type: string, maxLength: 500 }

    ConsentVersion:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        The SHA-256, lower-case hex, of one language's consent text exactly as a
        guest was shown it (UTF-8, surrounding whitespace trimmed). The version a
        consent record carries, and the key the text is kept under.

    ConsentVersionInput:
      type: string
      description: |
        The hidden field beside the checkbox: the `ConsentVersion` of the text the
        page rendered. A value that is not a version of this venue's text records
        nothing.

    ConsentVersions:
      type: object
      additionalProperties: false
      description: The version of each language's current text. Absent for a language with none.
      properties:
        en: { $ref: "#/components/schemas/ConsentVersion" }
        vi: { $ref: "#/components/schemas/ConsentVersion" }

    MarketingConsentSetting:
      type: object
      required: [enabled, text, versions]
      properties:
        enabled:
          type: boolean
          description: |
            Whether the sign-in forms carry the marketing checkbox. It is always
            **unticked** when the page loads and never required to get online; there
            is no setting for either, on purpose.
        text: { $ref: "#/components/schemas/ConsentText" }
        versions: { $ref: "#/components/schemas/ConsentVersions" }

    MarketingConsentSettingUpdate:
      type: object
      required: [enabled, text]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        text: { $ref: "#/components/schemas/ConsentText" }

    GuestDataSettings:
      type: object
      required: [fields, marketingConsent]
      properties:
        fields:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/GuestDataFieldSetting" }
          description: In the order the form shows them. Empty collects nothing.
        marketingConsent: { $ref: "#/components/schemas/MarketingConsentSetting" }

    GuestDataSettingsUpdate:
      type: object
      required: [fields, marketingConsent]
      additionalProperties: false
      properties:
        fields:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/GuestDataFieldSetting" }
        marketingConsent: { $ref: "#/components/schemas/MarketingConsentSettingUpdate" }

    PortalDataCollection:
      type: object
      required: [fields, marketingConsent]
      description: |
        `GuestDataSettings` narrowed for a guest: the fields, and the consent
        texts with their versions **only when the venue asks for consent**.
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/GuestDataFieldSetting" }
        marketingConsent:
          oneOf:
            - $ref: "#/components/schemas/PortalMarketingConsent"
            - type: "null"

    PortalMarketingConsent:
      type: object
      required: [text, versions]
      properties:
        text: { $ref: "#/components/schemas/ConsentText" }
        versions: { $ref: "#/components/schemas/ConsentVersions" }

    # The five guest-detail inputs carry no length, pattern or enum on purpose. A
    # form field the contract refused would be answered `422` with a problem
    # document, which a Captive Network Assistant renders as raw JSON with no way
    # back. The server applies each rule itself and answers the guest the way every
    # other refusal on this surface is answered: `303` to the form, with a reason.
    GuestNameInput:
      type: string
      description: Offered where the venue collects `name`. Blank is absent; at most 120 characters.

    GuestPhoneInput:
      type: string
      description: |
        Offered where the venue collects `phone`. Digits with an optional leading
        `+` and spaces, dots, dashes or brackets between them; eight to fifteen
        digits (E.164's ceiling). A value of another shape sends the guest back to
        the form with `details-invalid`.

    GuestEmailInput:
      type: string
      description: |
        Offered where the venue collects `email`. One `@`, something on each side,
        a dot in the domain, no whitespace, at most 254 characters — a shape check,
        not a delivery check.

    MarketingConsentInput:
      type: string
      description: |
        The checkbox. A browser sends `yes` only when it is ticked, and an unticked
        box sends nothing — **the absence is the refusal, and nothing else is read as
        consent**: not accepting the terms, not submitting the form, not a value the
        server did not expect.

    MarketingConsentState:
      type: string
      enum: [active, withdrawn]

    ConsentWithdrawnBy:
      type: string
      enum: [guest, operator]
      description: The guest from the portal, or an administrator on their behalf.

    MarketingConsent:
      type: object
      required: [id, siteId, consentedAt, state, lang, consentVersion, consentText, clientMac]
      description: |
        One consent a guest ticked. **A withdrawn consent carries no contact
        details** — `name`, `phone` and `email` are cleared the moment it is
        withdrawn — and keeps when it was given, which text, and when and by whom it
        was withdrawn: the venue's evidence that it asked properly and that it
        stopped.
      properties:
        id: { type: string }
        siteId: { type: string }
        consentedAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/MarketingConsentState" }
        withdrawnAt: { type: [string, "null"], format: date-time }
        withdrawnBy:
          oneOf:
            - $ref: "#/components/schemas/ConsentWithdrawnBy"
            - type: "null"
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        lang: { $ref: "#/components/schemas/Language" }
        consentVersion: { $ref: "#/components/schemas/ConsentVersion" }
        consentText:
          type: string
          description: The exact sentence the guest ticked the box beside, in `lang`.
        clientMac:
          type: string
          description: |
            The device the consent was given from. A device, not a person — see
            `exportGuests` — and the key an erasure by MAC removes this record by.
